<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>タイヤホテルOKABE DX</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#003882">
<script src="api.js"></script>
<script src="common.js"></script>
<style>
.login-screen { display: flex; justify-content: center; align-items: center; min-height: 100dvh; padding: 24px; background: linear-gradient(160deg, #FAF8F5 0%, #F0EBE3 100%); }
.login-box { width: 100%; max-width: 360px; }
.login-logo { text-align: center; margin-bottom: 40px; font-size: 22px; font-weight: 700; color: var(--brown); letter-spacing: 2px; }
.login-logo span { font-size: 24px; }
.login-card { background: var(--white); border-radius: 16px; padding: 32px 24px; box-shadow: var(--shadow-md); border: 1px solid var(--border-light); }
.login-btn { width: 100%; padding: 16px; font-size: 16px; font-weight: 700; color: var(--white); background: var(--orange); border: none; border-radius: 10px; cursor: pointer; }
.login-btn:active { background: var(--orange-dark); transform: scale(0.98); }
.login-error { display: none; margin-top: 16px; padding: 12px; background: #FFF5F5; border: 1px solid #F5C6CB; border-radius: 8px; color: var(--red); font-size: 13px; text-align: center; }
.login-error.show { display: block; }
.pw-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 18px; }

.top-header { background: var(--white); border-bottom: 1px solid var(--border-light); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.staff-bar { background: var(--white); border-bottom: 1px solid var(--border-light); padding: 10px 16px; display: flex; align-items: center; gap: 8px; }
.role-badge { padding: 4px 10px; font-size: 11px; font-weight: 600; border-radius: 4px; color: var(--white); background: var(--orange); }
.user-name { font-size: 13px; color: var(--text2); }
.user-name strong { color: var(--text); display: block; }
.logout-btn { padding: 6px 12px; font-size: 12px; color: var(--text2); background: var(--cream); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
.logout-btn:active { background: var(--border); transform: scale(0.95); }

.quick-btn { flex: 1; padding: 20px 8px; font-size: 17px; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; box-shadow: var(--shadow-md); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.quick-btn:active { transform: scale(0.97); }
.quick-btn.primary { background: var(--orange); color: var(--white); }
.quick-btn.primary:active { background: var(--orange-dark); }
.quick-btn.secondary { background: var(--white); color: var(--orange); border: 2.5px solid var(--orange); box-shadow: var(--shadow-sm); }
.quick-sub { font-size: 10px; font-weight: 400; opacity: 0.8; }

.status-card { background: var(--white); border: 1px solid var(--border-light); border-radius: 12px; padding: 14px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
.status-title { font-size: 13px; font-weight: 600; color: var(--brown); margin-bottom: 10px; }
.status-row { display: flex; justify-content: space-around; text-align: center; }
.status-item { flex: 1; }
.status-num { font-size: 24px; font-weight: 700; }
.status-label { font-size: 11px; color: var(--text3); margin-top: 2px; }

.alert-card { background: #FFF5F5; border: 1.5px solid var(--red); border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; cursor: pointer; }
.alert-card:active { transform: scale(0.98); }
.alert-title { font-size: 13px; font-weight: 700; color: var(--red); margin-bottom: 2px; }
.alert-desc { font-size: 12px; color: var(--text2); }
</style>
</head>
<body>

<!-- ===== ログイン画面 ===== -->
<div id="scrLogin" class="screen active">
  <div class="login-screen">
    <div class="login-box">
      <div class="login-logo">タイヤホテル<span>OKABE</span> DX</div>
      <div class="login-card" onkeydown="if(event.key==='Enter')doLogin()">
        <div class="form-row">
          <label class="form-label">スタッフID</label>
          <input class="form-input" type="text" id="staffIdInput" placeholder="S-0001" autocomplete="off" autocapitalize="off">
        </div>
        <div class="form-row">
          <label class="form-label">パスワード</label>
          <div style="position:relative;">
            <input class="form-input" type="password" id="pwInput" placeholder="パスワードを入力">
            <span class="pw-toggle" onclick="togglePw(this)">&#x1F441;</span>
          </div>
        </div>
        <button class="login-btn" id="loginBtn" onclick="doLogin()">ログイン</button>
        <div class="login-error" id="loginError"></div>
        <div style="text-align:center;margin-top:12px;">
          <a href="#" style="font-size:12px;color:var(--blue);" onclick="event.preventDefault();showScr('scrPwSetup')">パスワードを変更する</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===== パスワード設定画面 ===== -->
<div id="scrPwSetup" class="screen">
  <div class="login-screen">
    <div class="login-box">
      <div class="login-logo">タイヤホテル<span>OKABE</span> DX</div>
      <div class="login-card">
        <div style="font-size:15px;font-weight:600;color:var(--brown);margin-bottom:12px;text-align:center;">パスワードの設定</div>
        <div class="form-row">
          <label class="form-label">スタッフID</label>
          <input class="form-input" type="text" id="pwStaffId" placeholder="S-0001">
        </div>
        <div class="form-row">
          <label class="form-label">現在のパスワード</label>
          <div style="position:relative;">
            <input class="form-input" type="password" id="currentPw" placeholder="仮パスワード">
            <span class="pw-toggle" onclick="togglePw(this)">&#x1F441;</span>
          </div>
        </div>
        <div class="form-row">
          <label class="form-label">新しいパスワード</label>
          <div style="position:relative;">
            <input class="form-input" type="password" id="newPw" placeholder="8文字以上">
            <span class="pw-toggle" onclick="togglePw(this)">&#x1F441;</span>
          </div>
        </div>
        <div class="form-row">
          <label class="form-label">確認入力</label>
          <div style="position:relative;">
            <input class="form-input" type="password" id="confirmPw" placeholder="もう一度入力">
            <span class="pw-toggle" onclick="togglePw(this)">&#x1F441;</span>
          </div>
        </div>
        <button class="login-btn" id="pwSetupBtn" onclick="doPwSetup()">設定する</button>
        <button class="btn-secondary" style="margin-top:8px;" onclick="showScr('scrLogin')">戻る</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== トップ画面 ===== -->
<div id="scrTop" class="screen">
  <div class="top-header">
    <div class="header-title">タイヤホテルOKABE DX</div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="user-name"><strong id="hName">-</strong><span id="hRole">-</span></div>
      <button class="logout-btn" onclick="doLogout()">ログアウト</button>
    </div>
  </div>
  <div class="staff-bar">
    <span class="role-badge" id="roleBadge">-</span>
    <span style="font-size:12px;color:var(--text3);" id="branchLabel">-</span>
  </div>

  <div class="content" style="padding-bottom:80px;">

    <!-- アラート -->
    <div id="alertArea"></div>

    <!-- メインボタン -->
    <div style="margin-bottom:20px;">
      <button class="quick-btn primary" style="width:100%;" onclick="navigateTo('scan_workorder.html')">作業開始<span class="quick-sub">作業指示書の読み取り</span></button>
    </div>

    <!-- 今日の作業状況 -->
    <div class="status-card">
      <div class="status-title">今日の作業状況</div>
      <div class="status-row">
        <div class="status-item">
          <div class="status-num" style="color:var(--orange);" id="countExchange">-</div>
          <div class="status-label">交換予定</div>
        </div>
        <div class="status-item">
          <div class="status-num" style="color:var(--green);" id="countOutbound">-</div>
          <div class="status-label">出庫準備</div>
        </div>
        <div class="status-item">
          <div class="status-num" style="color:var(--red);" id="countStore">-</div>
          <div class="status-label">格納待ち</div>
        </div>
      </div>
    </div>

    <!-- メニュー -->
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px;">
      <div class="menu-card" onclick="navigateTo('pit_work.html')">
        <div class="menu-card-icon">&#x1F527;</div>
        <div class="menu-card-label">ピット作業</div>
      </div>
      <div class="menu-card" onclick="navigateTo('warehouse.html')">
        <div class="menu-card-icon">&#x1F4E6;</div>
        <div class="menu-card-label">倉庫作業</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px;">
      <div class="menu-card" onclick="navigateTo('contract.html')">
        <div class="menu-card-icon">&#x1F4DD;</div>
        <div class="menu-card-label">契約書発行</div>
      </div>
      <div class="menu-card" onclick="navigateTo('overdue.html')">
        <div class="menu-card-icon">&#x1F4C5;</div>
        <div class="menu-card-label">返却予定日</div>
      </div>
    </div>
    <!-- 預かり検索 -->
    <div style="margin-bottom:12px;">
      <div class="menu-card" onclick="navigateTo('search.html')" style="text-align:center;">
        <div class="menu-card-icon">&#x1F50D;</div>
        <div class="menu-card-label">預かり検索</div>
      </div>
    </div>
    <!-- 各種台帳（一番下） -->
    <div style="font-size:12px;font-weight:600;color:var(--text3);margin:16px 0 8px;padding-left:4px;">各種台帳</div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px;">
      <div class="menu-card" onclick="navigateTo('customer.html')">
        <div class="menu-card-icon">&#x1F464;</div>
        <div class="menu-card-label">顧客台帳</div>
      </div>
      <div class="menu-card" onclick="navigateTo('vehicle.html')">
        <div class="menu-card-icon">&#x1F697;</div>
        <div class="menu-card-label">車両台帳</div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item" onclick="navigateTo('master.html')"><div class="nav-item-icon">&#x2699;&#xFE0F;</div><div>設定</div></div>
    <div class="nav-item" onclick="navigateTo('permission.html')"><div class="nav-item-icon">&#x1F512;</div><div>権限管理</div></div>
    <div class="nav-item" onclick="navigateTo('export.html')"><div class="nav-item-icon">&#x1F4E5;</div><div>CSV出力</div></div>
    <div class="nav-item" onclick="navigateTo('qa.html')"><div class="nav-item-icon">&#x1F4AC;</div><div>Q&A</div></div>
  </div>
</div>

<script>
// --- 画面切り替え ---
function showScr(id) {
  var s = document.querySelectorAll('.screen');
  for (var i = 0; i < s.length; i++) s[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
}

// --- パスワード表示切り替え ---
function togglePw(el) {
  var input = el.parentNode.querySelector('input');
  input.type = input.type === 'password' ? 'text' : 'password';
}

// --- ログイン ---
async function doLogin() {
  var staffId = document.getElementById('staffIdInput').value.trim();
  var pw = document.getElementById('pwInput').value;
  if (!staffId || !pw) { showLoginError('スタッフIDとパスワードを入力してください'); return; }

  startLoading(document.getElementById('loginBtn'));
  var r = await callAPI('login', { staffId: staffId, password: pw });
  stopLoading(document.getElementById('loginBtn'));

  if (!r || !r.ok) {
    if (r && r.code === 'PASSWORD_CHANGE_REQUIRED') {
      document.getElementById('pwStaffId').value = staffId;
      document.getElementById('currentPw').value = pw;
      showScr('scrPwSetup');
      return;
    }
    showLoginError(r ? r.message : 'ログインに失敗しました');
    return;
  }

  localStorage.setItem('sessionId', r.data.sessionId);
  localStorage.setItem('staffId', r.data.staffId);
  localStorage.setItem('staffName', r.data.staffName);
  localStorage.setItem('role', r.data.role);
  localStorage.setItem('branch', r.data.branchCode);
  showTop();
}

function showLoginError(msg) {
  var el = document.getElementById('loginError');
  el.textContent = msg;
  el.classList.add('show');
}

// --- パスワード設定 ---
async function doPwSetup() {
  var staffId = document.getElementById('pwStaffId').value.trim();
  var cur = document.getElementById('currentPw').value;
  var np = document.getElementById('newPw').value;
  var cp = document.getElementById('confirmPw').value;
  if (!staffId || !cur || !np) { showError('全項目を入力してください'); return; }
  if (np.length < 8) { showError('新しいパスワードは8文字以上にしてください'); return; }
  if (np !== cp) { showError('確認入力が一致しません'); return; }

  startLoading(document.getElementById('pwSetupBtn'));
  var r = await callAPI('setInitialPassword', { staffId: staffId, currentPassword: cur, newPassword: np });
  stopLoading(document.getElementById('pwSetupBtn'));

  if (handleAPIError(r)) return;
  showSuccess('パスワードを設定しました。ログインしてください');
  showScr('scrLogin');
}

// --- ログアウト ---
async function doLogout() {
  await callAPI('logout', {});
  localStorage.clear();
  showScr('scrLogin');
}

// --- トップ画面表示 ---
function showTop() {
  document.getElementById('hName').textContent = getStaffName();
  document.getElementById('hRole').textContent = localStorage.getItem('role') || '';
  document.getElementById('roleBadge').textContent = localStorage.getItem('role') || '';
  document.getElementById('branchLabel').textContent = localStorage.getItem('branch') || '';
  showScr('scrTop');
  loadSummary();
}

// --- 今日の作業状況 ---
async function loadSummary() {
  var r = await callAPI('home_summary', {});
  if (!r || !r.ok) {
    document.getElementById('countExchange').textContent = '-';
    document.getElementById('countOutbound').textContent = '-';
    document.getElementById('countStore').textContent = '-';
    return;
  }
  var d = r.data;
  document.getElementById('countExchange').textContent = d.exchange || 0;
  document.getElementById('countOutbound').textContent = d.outbound || 0;
  document.getElementById('countStore').textContent = d.store || 0;

  var alertHtml = '';
  if (d.store > 0) {
    alertHtml += '<div class="alert-card" onclick="navigateTo(\'warehouse.html\')"><div class="alert-title">&#x26A0; 格納待ち ' + d.store + '件</div><div class="alert-desc">棚番号を入力して格納してください</div></div>';
  }
  document.getElementById('alertArea').innerHTML = alertHtml;
}

// --- 起動時 ---
if (getSessionId()) {
  showTop();
} else {
  showScr('scrLogin');
}
</script>
</body>
</html>
