<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>G. 早期返却・廃棄 - タイヤホテルOKABE DX</title>
<link rel="stylesheet" href="style.css">
<script src="api.js"></script>
<script src="common.js"></script>
<style>
.wo-card { background: var(--white); border: 1px solid var(--border-light); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; box-shadow: var(--shadow-sm); }
.wo-card:active { transform: scale(0.98); }
.wo-card-detail { font-size: 14px; color: var(--text2); line-height: 1.5; }
.tab-bar { display: flex; gap: 4px; margin-bottom: 16px; }
.tab-item { flex: 1; padding: 10px; font-size: 13px; font-weight: 600; text-align: center; border: 1.5px solid var(--border); border-radius: 8px; background: var(--white); color: var(--text3); cursor: pointer; }
.tab-item.active { border-color: var(--orange); background: #FFF3EB; color: var(--orange); }
.btn-danger { width: 100%; padding: 14px; font-size: 15px; font-weight: 600; color: var(--red); background: var(--white); border: 1.5px solid var(--red); border-radius: 10px; cursor: pointer; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="page">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="location.href='g_warehouse.html'">&lt; 戻る</button>
    <div class="header-title">早期返却・廃棄・棚</div>
  </div>
  <div class="content">
    <div class="tab-bar">
      <div class="tab-item active" id="tabEarlyBtn" onclick="showTab('tabEarly')">早期返却</div>
      <div class="tab-item" id="tabDisposalBtn" onclick="showTab('tabDisposal')">廃棄</div>
      <div class="tab-item" id="tabRackBtn" onclick="showTab('tabRack')">棚番一覧</div>
    </div>
    <div id="tabEarly">
      <div id="earlyReleaseList"></div>
    </div>
    <div id="tabDisposal" style="display:none;">
      <div id="disposalList"></div>
    </div>
    <div id="tabRack" style="display:none;">
      <div id="rackList"></div>
    </div>
  </div>
</div>

<script>
if (!requireLogin()) {}

function showTab(tabId) {
  ['tabEarly','tabDisposal','tabRack'].forEach(function(t) {
    document.getElementById(t).style.display = 'none';
    document.getElementById(t + 'Btn').classList.remove('active');
  });
  document.getElementById(tabId).style.display = '';
  document.getElementById(tabId + 'Btn').classList.add('active');
}

async function loadEarlyReleases() {
  var result = await callAPI('earlyRelease_list', {});
  if (handleAPIError(result)) return;
  var list = result.data.releases || [];
  if (list.length === 0) {
    document.getElementById('earlyReleaseList').innerHTML =
      '<div style="text-align:center;color:var(--text3);padding:20px;">早期返却の申請はありません</div>';
    return;
  }
  var html = '<div class="section-label">早期返却（' + list.length + '件）</div>';
  for (var i = 0; i < list.length; i++) {
    var r = list[i];
    html += '<div class="wo-card">'
      + '<div style="display:flex;justify-content:space-between;margin-bottom:4px;">'
      + '<span style="font-size:13px;color:var(--text3);">' + escapeHtml(r['申請ID']) + '</span>'
      + '<span class="status ' + getStatusClass(r['状態']) + '">' + escapeHtml(r['状態']) + '</span></div>'
      + '<div class="wo-card-detail">セット: ' + escapeHtml(r['タイヤセットID']) + '</div>'
      + '<div class="wo-card-detail">申請日: ' + formatDate(r['申請日時']) + '</div>';
    if (r['状態'] === '申請中') {
      html += '<div style="margin-top:8px;display:flex;gap:8px;">'
        + '<button class="btn-primary" style="flex:1;margin:0;font-size:13px;padding:10px;" '
        + 'onclick="confirmEarlyRelease(\'' + escapeHtml(r['申請ID']) + '\',' + Number(r['版番号']) + ')">確定</button>'
        + '<button class="btn-secondary" style="flex:1;margin:0;font-size:13px;padding:10px;" '
        + 'onclick="rejectEarlyRelease(\'' + escapeHtml(r['申請ID']) + '\',' + Number(r['版番号']) + ')">却下</button></div>';
    }
    html += '</div>';
  }
  document.getElementById('earlyReleaseList').innerHTML = html;
}

async function confirmEarlyRelease(releaseId, version) {
  if (!confirmAction('早期返却を確定しますか？')) return;
  var result = await callAPI('earlyRelease_confirm', {
    releaseId: releaseId, version: version, idempotencyKey: generateIdempotencyKey()
  });
  if (handleAPIError(result)) return;
  showSuccess('早期返却を確定しました');
  loadEarlyReleases();
}

async function rejectEarlyRelease(releaseId, version) {
  if (!confirmAction('早期返却を却下しますか？')) return;
  var result = await callAPI('earlyRelease_reject', { releaseId: releaseId, version: version });
  if (handleAPIError(result)) return;
  showSuccess('早期返却を却下しました');
  loadEarlyReleases();
}

async function loadDisposals() {
  var result = await callAPI('disposal_list', {});
  if (handleAPIError(result)) return;
  var list = result.data.disposals || [];
  if (list.length === 0) {
    document.getElementById('disposalList').innerHTML =
      '<div style="text-align:center;color:var(--text3);padding:20px;">廃棄申請はありません</div>';
    return;
  }
  var html = '<div class="section-label">廃棄申請（' + list.length + '件）</div>';
  for (var i = 0; i < list.length; i++) {
    var d = list[i];
    html += '<div class="wo-card">'
      + '<div style="display:flex;justify-content:space-between;margin-bottom:4px;">'
      + '<span style="font-size:13px;color:var(--text3);">' + escapeHtml(d['廃棄ID']) + '</span>'
      + '<span class="status ' + getStatusClass(d['状態']) + '">' + escapeHtml(d['状態']) + '</span></div>'
      + '<div class="wo-card-detail">セット: ' + escapeHtml(d['タイヤセットID']) + '</div>'
      + '<div class="wo-card-detail">理由: ' + escapeHtml(d['理由'] || '') + '</div>';
    if (d['状態'] === '申請') {
      html += '<div style="margin-top:8px;">'
        + '<button class="btn-danger" style="font-size:13px;padding:10px;" '
        + 'onclick="confirmDisposal(\'' + escapeHtml(d['廃棄ID']) + '\',' + Number(d['版番号']) + ')">廃棄を確定</button></div>';
    }
    html += '</div>';
  }
  document.getElementById('disposalList').innerHTML = html;
}

async function confirmDisposal(disposalId, version) {
  if (!confirmAction('廃棄を確定しますか？（24時間以内なら取消可）')) return;
  var result = await callAPI('disposal_confirm', {
    disposalId: disposalId, version: version, idempotencyKey: generateIdempotencyKey()
  });
  if (handleAPIError(result)) return;
  showSuccess('廃棄を確定しました');
  loadDisposals();
}

async function loadRacks() {
  var result = await callAPI('warehouse_rackList', {});
  if (handleAPIError(result)) return;
  var racks = result.data.racks || [];
  if (racks.length === 0) {
    document.getElementById('rackList').innerHTML =
      '<div style="text-align:center;color:var(--text3);padding:20px;">棚がありません</div>';
    return;
  }
  var html = '<div class="section-label">棚番一覧（' + racks.length + '件）</div>';
  for (var i = 0; i < racks.length; i++) {
    var r = racks[i];
    html += '<div class="wo-card" style="cursor:default;">'
      + '<div style="font-size:15px;font-weight:700;margin-bottom:4px;">' + escapeHtml(r['棚番']) + '</div>'
      + '<div class="wo-card-detail">棚ID: ' + escapeHtml(r['棚ID'])
      + ' / 倉庫: ' + escapeHtml(r['倉庫コード']) + '</div>'
      + '<div class="wo-card-detail">収容: ' + escapeHtml(r['収容セット数'])
      + ' / 有効: ' + escapeHtml(r['有効']) + '</div></div>';
  }
  document.getElementById('rackList').innerHTML = html;
}

loadEarlyReleases();
loadDisposals();
loadRacks();
if (getParam('tab') === 'rack') showTab('tabRack');
if (getParam('tab') === 'disposal') showTab('tabDisposal');
</script>
</body>
</html>
