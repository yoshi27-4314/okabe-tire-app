<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>C. 車両管理 - タイヤホテルOKABE DX</title>
<link rel="stylesheet" href="style.css">
<script src="api.js"></script>
<script src="common.js"></script>
<style>
.tab-bar { display: flex; gap: 4px; margin-bottom: 16px; }
.tab-item { flex: 1; padding: 10px; font-size: 13px; font-weight: 600; text-align: center; border: 1.5px solid var(--border); border-radius: 8px; background: var(--white); color: var(--text3); cursor: pointer; }
.tab-item.active { border-color: var(--orange); background: #FFF3EB; color: var(--orange); }
.wo-card { background: var(--white); border: 1px solid var(--border-light); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; box-shadow: var(--shadow-sm); }
.wo-card:active { transform: scale(0.98); }
.wo-card-detail { font-size: 14px; color: var(--text2); line-height: 1.5; }
.btn-danger { width: 100%; padding: 14px; font-size: 15px; font-weight: 600; color: var(--red); background: var(--white); border: 1.5px solid var(--red); border-radius: 10px; cursor: pointer; margin-bottom: 10px; }
</style>
</head>
<body>

<!-- C-1 車両検索 -->
<div id="scrSearch" class="screen active">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="goBack()">&lt; 戻る</button>
    <div class="header-title">C. 車両管理</div>
  </div>
  <div class="content">
    <div class="search-box">
      <input class="search-input" type="text" id="searchQuery" placeholder="何でも検索" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="search-btn" id="searchBtn" onclick="doSearch()">検索</button>
    </div>
    <div style="font-size:12px;color:var(--text3);margin-top:-12px;margin-bottom:12px;padding-left:4px;">ナンバー / 車種 / メーカー / 顧客名 / VIN / メモ</div>
    <div id="searchResults"></div>
  </div>
  <div class="page-id">C-1 車両検索</div>
</div>

<!-- C-2 車両詳細 -->
<div id="scrDetail" class="screen">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="showScr('scrSearch')">&lt; 戻る</button>
    <div class="header-title">車両詳細</div>
  </div>
  <div class="content">
    <div class="tab-bar">
      <div class="tab-item active" onclick="showTab('tabInfo',this)">車両情報</div>
      <div class="tab-item" onclick="showTab('tabTire',this)">預かりタイヤ</div>
      <div class="tab-item" onclick="showTab('tabOwnership',this)">所有履歴</div>
    </div>
    <div id="tabInfo">
      <div class="confirm-box" id="vehicleInfo"></div>
      <button class="btn-primary" onclick="showEditScreen()">車両情報を編集する</button>
      <div style="text-align:right;margin-top:24px;"><a href="#" id="endOwnershipBtn" onclick="event.preventDefault();doEndOwnership()" style="font-size:13px;color:var(--red);text-decoration:underline;">この車を保有終了にする</a></div>
    </div>
    <div id="tabTire" style="display:none;">
      <div class="section-label">預かりタイヤ</div>
      <div id="tireList"><div style="color:var(--text3);padding:20px;text-align:center;">読み込み中...</div></div>
    </div>
    <div id="tabOwnership" style="display:none;">
      <div class="section-label">所有履歴</div>
      <div id="ownershipList"></div>
    </div>
  </div>
  <div class="page-id">C-2 車両詳細</div>
</div>

<!-- C-3 車両情報編集 -->
<div id="scrEdit" class="screen">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="showScr('scrDetail')">&lt; 戻る</button>
    <div class="header-title">車両情報の編集</div>
  </div>
  <div class="content">
    <div class="form-section">
      <div class="form-section-title">ナンバー</div>
      <div class="form-row"><label class="form-label">地名</label><input class="form-input" type="text" id="editArea" style="width:150px;"></div>
      <div class="form-row"><label class="form-label">分類番号</label><input class="form-input" type="text" id="editClassNo" style="width:120px;"></div>
      <div class="form-row"><label class="form-label">かな</label><input class="form-input" type="text" id="editKana" style="width:80px;"></div>
      <div class="form-row"><label class="form-label">下4桁</label><input class="form-input" type="text" id="editPlateNum" style="width:120px;font-size:20px;font-weight:700;text-align:center;"></div>
    </div>
    <div class="form-section">
      <div class="form-section-title">車両</div>
      <div class="form-row"><label class="form-label">メーカー</label><input class="form-input" type="text" id="editMaker"></div>
      <div class="form-row"><label class="form-label">車種名</label><input class="form-input" type="text" id="editModel"></div>
      <div class="form-row"><label class="form-label">輪数</label>
        <select class="form-select" id="editWheelCount"><option value="未確認">未確認</option><option value="4輪">4輪</option><option value="6輪">6輪</option></select>
      </div>
      <div class="form-row"><label class="form-label">車台番号 VIN</label><input class="form-input" type="text" id="editVin"></div>
    </div>
    <div class="hint-bar">変更した事実（誰が・いつ・どの項目）は記録されます。</div>
    <button class="btn-primary" id="saveBtn" onclick="saveVehicle()">変更を保存</button>
    <button class="btn-secondary" onclick="showScr('scrDetail')">キャンセル</button>
  </div>
  <div class="page-id">C-3 車両情報編集</div>
</div>

<script>
if (!requireLogin()) {}
var currentVehicle = null;
var currentVersion = null;
var currentOwnerships = [];

function showScr(id) {
  var s = document.querySelectorAll('.screen');
  for (var i = 0; i < s.length; i++) s[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
function showTab(tabId, el) {
  ['tabInfo','tabTire','tabOwnership'].forEach(function(t) { document.getElementById(t).style.display = 'none'; });
  document.getElementById(tabId).style.display = '';
  var items = document.querySelectorAll('.tab-item');
  for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
  el.classList.add('active');
}

async function doSearch() {
  var query = document.getElementById('searchQuery').value.trim();
  if (!query) { showError('検索語を入力してください'); return; }
  startLoading(document.getElementById('searchBtn'));
  var result = await callAPI('vehicle_search', { query: query });
  stopLoading(document.getElementById('searchBtn'));
  if (handleAPIError(result)) return;
  var vehicles = result.data.vehicles || [];
  var html = '<div class="section-label">検索結果（' + vehicles.length + '件）</div>';
  if (vehicles.length === 0) html += '<div style="text-align:center;color:var(--text3);padding:20px;">該当なし</div>';
  for (var i = 0; i < vehicles.length; i++) {
    var v = vehicles[i];
    var plate = [v['地名'], v['分類番号'], v['かな'], v['下4桁']].filter(Boolean).join(' ');
    html += '<div class="wo-card" onclick="loadDetail(\'' + escapeHtml(v['車両ID']) + '\')">'
      + '<div style="font-size:17px;font-weight:700;margin-bottom:4px;">' + escapeHtml(plate || '（ナンバー未登録）') + '</div>'
      + '<div class="wo-card-detail">' + escapeHtml(v['車種名'] || '') + ' / ' + escapeHtml(v['メーカー'] || '') + ' / ' + escapeHtml(v['輪数'] || '') + '</div></div>';
  }
  document.getElementById('searchResults').innerHTML = html;
}

async function loadDetail(vehicleId) {
  var result = await callAPI('vehicle_detail', { vehicleId: vehicleId });
  if (handleAPIError(result)) return;
  currentVehicle = result.data.vehicle;
  currentVersion = currentVehicle['版番号'];
  currentOwnerships = result.data.ownerships || [];
  var v = currentVehicle;
  var plate = [v['地名'], v['分類番号'], v['かな'], v['下4桁']].filter(Boolean).join(' ');
  var fields = [
    ['ナンバー', plate || '（未登録）'], ['車種', v['車種名']],
    ['メーカー', v['メーカー']], ['輪数', v['輪数']],
    ['VIN', v['車台番号']], ['登録日', formatDate(v['登録日時'])]
  ];
  var html = '<div style="font-size:13px;font-weight:600;color:var(--brown);margin-bottom:6px;">車両情報</div>';
  for (var i = 0; i < fields.length; i++) {
    if (fields[i][1]) html += '<div class="confirm-row"><span class="confirm-label">' + fields[i][0] + '</span><span class="confirm-value">' + escapeHtml(fields[i][1]) + '</span></div>';
  }
  document.getElementById('vehicleInfo').innerHTML = html;
  var ohtml = '';
  if (currentOwnerships.length === 0) ohtml = '<div style="color:var(--text3);padding:20px;text-align:center;">履歴なし</div>';
  for (var o = 0; o < currentOwnerships.length; o++) {
    var ow = currentOwnerships[o];
    var status = ow['所有終了日'] ? '終了' : '現所有';
    var stColor = ow['所有終了日'] ? 'var(--text3)' : 'var(--green)';
    ohtml += '<div class="wo-card">'
      + '<div class="confirm-row"><span class="confirm-label">顧客ID</span><span class="confirm-value">' + escapeHtml(ow['顧客ID']) + '</span></div>'
      + '<div class="confirm-row"><span class="confirm-label">開始</span><span class="confirm-value">' + formatDate(ow['所有開始日']) + '</span></div>'
      + (ow['所有終了日'] ? '<div class="confirm-row"><span class="confirm-label">終了</span><span class="confirm-value">' + formatDate(ow['所有終了日']) + '</span></div>' : '')
      + '<div class="confirm-row"><span class="confirm-label">状態</span><span class="confirm-value" style="color:' + stColor + ';">' + status + '</span></div></div>';
  }
  document.getElementById('ownershipList').innerHTML = ohtml;
  loadTires(vehicleId);
  showScr('scrDetail');
}

function showEditScreen() {
  if (!currentVehicle) return;
  var v = currentVehicle;
  document.getElementById('editArea').value = v['地名'] || '';
  document.getElementById('editClassNo').value = v['分類番号'] || '';
  document.getElementById('editKana').value = v['かな'] || '';
  document.getElementById('editPlateNum').value = v['下4桁'] || '';
  document.getElementById('editMaker').value = v['メーカー'] || '';
  document.getElementById('editModel').value = v['車種名'] || '';
  document.getElementById('editWheelCount').value = v['輪数'] || '未確認';
  document.getElementById('editVin').value = v['車台番号'] || '';
  showScr('scrEdit');
}

async function saveVehicle() {
  if (!currentVehicle) return;
  startLoading(document.getElementById('saveBtn'));
  var result = await callAPI('vehicle_update', {
    vehicleId: currentVehicle['車両ID'], version: currentVersion,
    updates: {
      '地名': document.getElementById('editArea').value,
      '分類番号': document.getElementById('editClassNo').value,
      'かな': document.getElementById('editKana').value,
      '下4桁': document.getElementById('editPlateNum').value,
      'メーカー': document.getElementById('editMaker').value,
      '車種名': document.getElementById('editModel').value,
      '輪数': document.getElementById('editWheelCount').value,
      '車台番号': document.getElementById('editVin').value
    }
  });
  stopLoading(document.getElementById('saveBtn'));
  if (handleAPIError(result)) return;
  currentVersion = result.data.newVersion;
  showSuccess('変更を保存しました');
  loadDetail(currentVehicle['車両ID']);
}

async function doEndOwnership() {
  if (!currentVehicle) return;
  var currentOwner = null;
  for (var i = 0; i < currentOwnerships.length; i++) {
    if (!currentOwnerships[i]['所有終了日']) { currentOwner = currentOwnerships[i]; break; }
  }
  if (!currentOwner) { showError('現在の所有者が見つかりません'); return; }
  var reason = prompt('終了理由を入力してください（売却・廃車・名義変更など）');
  if (reason === null) return;
  if (!confirmAction('この車を保有終了にします。よろしいですか？')) return;
  startLoading(document.getElementById('endOwnershipBtn'));
  var result = await callAPI('vehicle_endOwnership', {
    vehicleId: currentVehicle['車両ID'],
    customerId: currentOwner['顧客ID'],
    reason: reason
  });
  stopLoading(document.getElementById('endOwnershipBtn'));
  if (handleAPIError(result)) return;
  if (result.data.warning) showError(result.data.warning);
  else showSuccess('保有終了しました');
  loadDetail(currentVehicle['車両ID']);
}

async function loadTires(vehicleId) {
  document.getElementById('tireList').innerHTML = '<div style="color:var(--text3);padding:20px;text-align:center;">読み込み中...</div>';
  var r = await callAPI('warehouse_searchTires', { vehicleId: vehicleId });
  if (!r || !r.ok) {
    document.getElementById('tireList').innerHTML = '<div style="color:var(--text3);padding:20px;text-align:center;">取得できませんでした</div>';
    return;
  }
  var items = r.data.results || [];
  if (items.length === 0) {
    document.getElementById('tireList').innerHTML = '<div style="color:var(--text3);padding:20px;text-align:center;">預かりタイヤなし</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < items.length; i++) {
    var ts = items[i].tireSet || {}, loc = items[i].location || {};
    var sc = getStatusClass(loc['状態'] || '');
    var tireInfo = [ts['区分'], ts['メーカー'], ts['銘柄'], ts['サイズ']].filter(Boolean).join(' / ');
    html += '<div class="wo-card" onclick="navigateTo(\'search_storage.html\',{tireSetId:\'' + escapeHtml(ts['タイヤセットID']) + '\'})">'
      + '<div style="display:flex;justify-content:space-between;margin-bottom:6px;">'
      + '<span style="font-size:15px;font-weight:700;color:var(--brown);">' + escapeHtml(loc['棚'] || '棚未定') + '</span>'
      + '<span class="status ' + sc + '">' + escapeHtml(loc['状態'] || '') + '</span></div>'
      + (tireInfo ? '<div class="wo-card-detail">' + escapeHtml(tireInfo) + '</div>' : '')
      + '</div>';
  }
  document.getElementById('tireList').innerHTML = html;
}

var paramId = getParam('vehicleId');
if (paramId) loadDetail(paramId);
</script>
</body>
</html>
