<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Q&A - タイヤホテルOKABE DX</title>
<link rel="stylesheet" href="style.css">
<script src="api.js"></script>
<script src="common.js"></script>
<style>
.chat-area { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.chat-msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
.chat-msg.mine { align-self: flex-end; background: var(--orange); color: var(--white); border-bottom-right-radius: 4px; }
.chat-msg.other { align-self: flex-start; background: var(--white); color: var(--text); border: 1px solid var(--border-light); border-bottom-left-radius: 4px; }
.chat-sender { font-size: 11px; color: var(--text3); margin-bottom: 2px; }
.chat-time { font-size: 10px; opacity: 0.7; margin-top: 4px; }
.chat-input-area { display: flex; gap: 8px; padding: 12px; background: var(--white); border-top: 1px solid var(--border-light); }
.chat-input { flex: 1; padding: 10px 14px; font-size: 15px; border: 1.5px solid var(--border); border-radius: 20px; outline: none; }
.chat-input:focus { border-color: var(--orange); }
.chat-send-btn { padding: 10px 20px; font-size: 14px; font-weight: 700; color: var(--white); background: var(--orange); border: none; border-radius: 20px; cursor: pointer; }
.chat-send-btn:active { opacity: 0.8; }
</style>
</head>
<body>

<div class="page" style="display:flex;flex-direction:column;">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="goBack()">&lt; 戻る</button>
    <div class="header-title">Q&A</div>
  </div>
  <div class="chat-area" id="chatArea">
    <div style="text-align:center;color:var(--text3);padding:20px;">読み込み中...</div>
  </div>
  <div class="chat-input-area">
    <input class="chat-input" type="text" id="chatInput" placeholder="メッセージを入力" onkeydown="if(event.key==='Enter')sendMsg()">
    <button class="chat-send-btn" onclick="sendMsg()">送信</button>
  </div>
  <div class="page-id">Q&A チャット</div>
</div>

<script>
if (!requireLogin()) {}
var myStaffId = getStaffId();

async function loadMessages() {
  var r = await callAPI('chat_list', {});
  if (handleAPIError(r)) return;
  var msgs = r.data.messages || [];
  var area = document.getElementById('chatArea');
  if (msgs.length === 0) {
    area.innerHTML = '<div style="text-align:center;color:var(--text3);padding:40px;">まだメッセージはありません</div>';
    return;
  }
  var h = '';
  for (var i = 0; i < msgs.length; i++) {
    var m = msgs[i];
    var isMine = m['送信者ID'] === myStaffId;
    h += '<div>';
    if (!isMine) h += '<div class="chat-sender">' + escapeHtml(m['送信者名']) + '</div>';
    h += '<div class="chat-msg ' + (isMine ? 'mine' : 'other') + '">'
      + escapeHtml(m['内容'])
      + '<div class="chat-time">' + formatDateTime(m['送信日時']) + '</div>'
      + '</div></div>';
  }
  area.innerHTML = h;
  area.scrollTop = area.scrollHeight;
}

async function sendMsg() {
  var input = document.getElementById('chatInput');
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  var r = await callAPI('chat_send', { content: text });
  if (handleAPIError(r)) return;
  loadMessages();
}

loadMessages();
setInterval(loadMessages, 15000);
</script>
</body>
</html>
