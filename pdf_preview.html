<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>受付確認書 - タイヤホテルOKABE DX</title>
<script src="api.js"></script>
<script src="common.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; background: #888; padding: 20px; }
.page { width: 210mm; min-height: 297mm; background: #fff; margin: 0 auto 20px; padding: 10mm 15mm; box-shadow: 0 2px 20px rgba(0,0,0,0.3); position: relative; font-size: 10pt; color: #222; line-height: 1.5; overflow: hidden; }
@media print { body { background: #fff; padding: 0; } .page { box-shadow: none; margin: 0; } .no-print { display: none !important; } .page-break { page-break-before: always; } }
.doc-title { text-align: center; font-size: 16pt; font-weight: bold; margin-bottom: 4mm; letter-spacing: 3pt; }
.company-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4mm; }
.company-info { font-size: 9pt; line-height: 1.5; }
.company-name { font-size: 11pt; font-weight: bold; margin-bottom: 1mm; }
.stamp-box { width: 22mm; height: 22mm; border: 0.5pt solid #999; display: flex; align-items: center; justify-content: center; font-size: 7pt; color: #999; }
.order-info { display: flex; justify-content: space-between; font-size: 9pt; margin-bottom: 3mm; padding-bottom: 2mm; border-bottom: 0.5pt solid #ccc; }
.two-col { display: flex; gap: 4mm; margin-bottom: 3mm; }
.two-col > div { flex: 1; }
.section { margin-bottom: 3mm; }
.section-title { font-size: 9pt; font-weight: bold; background: #f0ebe3; padding: 1mm 2mm; margin-bottom: 1mm; }
.row { display: flex; border-bottom: 0.3pt solid #eee; }
.row-label { width: 22mm; font-size: 8.5pt; color: #666; padding: 0.8mm 2mm; flex-shrink: 0; }
.row-value { flex: 1; font-size: 9pt; padding: 0.8mm 2mm; }
.price-table { width: 100%; border-collapse: collapse; font-size: 9pt; }
.price-table td { padding: 0.8mm 2mm; border-bottom: 0.3pt solid #eee; }
.price-table .label { color: #666; font-size: 8.5pt; }
.price-table .amount { text-align: right; font-weight: bold; }
.price-table .total { border-top: 0.8pt solid #222; font-size: 10pt; }
.price-table .discount { color: #006B3F; }
.notice { font-size: 8.5pt; line-height: 1.5; margin-bottom: 2mm; }
.notice-title { font-size: 9pt; font-weight: bold; margin-bottom: 1mm; }
.terms-title { text-align: center; font-size: 14pt; font-weight: bold; margin-bottom: 4mm; }
.article-title { font-size: 10pt; font-weight: bold; margin-top: 3mm; margin-bottom: 0.5mm; }
.article-body { font-size: 9pt; line-height: 1.6; margin-bottom: 1mm; padding-left: 1mm; }
.no-print { position: fixed; top: 10px; right: 20px; z-index: 100; display: flex; gap: 8px; }
.no-print button { padding: 10px 20px; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: #fff; }
.btn-print { background: #5C4033; }
.btn-back { background: #E86A2A; }
.loading-msg { text-align: center; padding: 40px; font-size: 16pt; color: #666; background: #fff; width: 210mm; margin: 0 auto; border-radius: 8px; }
</style>
</head>
<body>
<div class="no-print">
  <button class="btn-print" onclick="window.print()">印刷 / PDF保存</button>
  <button class="btn-back" onclick="goBack()">戻る</button>
</div>
<div id="pdfContent"><div class="loading-msg">受付確認書を読み込み中...</div></div>

<script>
var orderNumber = getParam('orderNumber');
function esc(v) { return escapeHtml(v || ''); }

async function loadPdfData() {
  if (!orderNumber) { document.getElementById('pdfContent').innerHTML = '<div class="loading-msg">伝票番号が指定されていません</div>'; return; }
  var result = await callAPI('reception_outputPdf', { orderNumber: orderNumber });
  if (!result.ok) { document.getElementById('pdfContent').innerHTML = '<div class="loading-msg">' + (result.message || 'データを取得できませんでした') + '</div>'; return; }
  // GASは { order:{}, customer:{}, vehicle:{} } で返す。フラットに統合する
  var raw = result.data || {}, ord = raw.order || {}, cust = raw.customer || {}, veh = raw.vehicle || {};
  var d = {
    '伝票番号': ord['伝票番号'], '受付日時': ord['受付日時'] || ord['登録日時'],
    '受付担当': ord['受付担当'] || ord['作成者'],
    '顧客名': cust['氏名'], '電話': cust['電話'], '携帯': cust['携帯'],
    '住所': (cust['郵便番号'] ? '\u3012' + cust['郵便番号'] + ' ' : '') + (cust['住所'] || ''),
    '顧客コード': cust['顧客コード'],
    'ナンバー': [veh['地名'], veh['分類番号'], veh['かな'], veh['下4桁']].filter(Boolean).join(' '),
    '車種': veh['車種名'], '車台番号': veh['車台番号'],
    '区分': ord['区分'] || '', 'メーカー': ord['メーカー'] || '', '銘柄': ord['銘柄'] || '',
    'サイズ': ord['サイズ'] || '', '預かり日': ord['預かり日'], '返却予定日': ord['返却予定日'],
    '保管料': ord['保管料'] || '', '割引名': ord['割引名'] || '',
    '割引額': ord['割引額'] || '', '合計': ord['合計'] || ord['保管料'] || '',
    'ホイール種類': ord['ホイール種類'] || '', 'キャップ': ord['キャップ'] || '', 'ナット': ord['ナット'] || '',
    '残溝左前': ord['残溝左前'] || '', '残溝右前': ord['残溝右前'] || '',
    '残溝左後': ord['残溝左後'] || '', '残溝右後': ord['残溝右後'] || '',
    'メモ左前': ord['メモ左前'] || '', 'メモ右前': ord['メモ右前'] || '',
    'メモ左後': ord['メモ左後'] || '', 'メモ右後': ord['メモ右後'] || '',
    '社内メモ': cust['社内メモ'] || ''
  };
  document.getElementById('pdfContent').innerHTML = page1(d) + page2() + page3(d);
}

function companyHeader() {
  return '<div class="company-header"><div class="company-info"><div class="company-name">株式会社 OKABE GROUP</div>'
    + '<div>本部・本社工場 〒500-8357 岐阜市六条大溝1丁目5番1号</div>'
    + '<div>TEL 058-272-6555 / 0120-726-381　FAX 058-275-2070 / 058-272-6225</div>'
    + '<div>E-mail: okabe6555@proof.ocn.ne.jp</div></div><div class="stamp-box">収入印紙</div></div>';
}
function orderInfo(d) {
  return '<div class="order-info"><div>受付番号: ' + esc(d['伝票番号']) + '</div>'
    + '<div>受付日時: ' + esc(formatDateTime(d['受付日時'])) + '</div>'
    + '<div>受付担当: ' + esc(d['受付担当']) + '</div></div>';
}
function custVeh(d) {
  return '<div class="two-col"><div class="section"><div class="section-title">お客様情報</div>'
    + '<div class="row"><div class="row-label">お名前</div><div class="row-value">' + esc(d['顧客名']) + ' 様</div></div>'
    + '<div class="row"><div class="row-label">電話</div><div class="row-value">' + esc(d['電話']) + '</div></div>'
    + '<div class="row"><div class="row-label">携帯</div><div class="row-value">' + esc(d['携帯']) + '</div></div>'
    + '<div class="row"><div class="row-label">住所</div><div class="row-value">' + esc(d['住所']) + '</div></div>'
    + '<div class="row"><div class="row-label">顧客コード</div><div class="row-value">' + esc(d['顧客コード']) + '</div></div>'
    + '</div><div class="section"><div class="section-title">車両情報</div>'
    + '<div class="row"><div class="row-label">ナンバー</div><div class="row-value">' + esc(d['ナンバー']) + '</div></div>'
    + '<div class="row"><div class="row-label">車種</div><div class="row-value">' + esc(d['車種']) + '</div></div>'
    + '<div class="row"><div class="row-label">車台番号</div><div class="row-value">' + esc(d['車台番号']) + '</div></div></div></div>';
}
function tirePrice(d) {
  var disc = d['割引名'] ? '<tr class="discount"><td class="label">' + esc(d['割引名']) + '</td><td class="amount">-\u00A5' + esc(d['割引額']) + '</td></tr>' : '';
  return '<div class="two-col"><div class="section"><div class="section-title">お預かりタイヤ</div>'
    + '<div class="row"><div class="row-label">区分</div><div class="row-value">' + esc(d['区分']) + '</div></div>'
    + '<div class="row"><div class="row-label">銘柄</div><div class="row-value">' + esc(d['メーカー']) + ' ' + esc(d['銘柄']) + '</div></div>'
    + '<div class="row"><div class="row-label">サイズ</div><div class="row-value">' + esc(d['サイズ']) + '</div></div>'
    + '<div class="row"><div class="row-label">預かり日</div><div class="row-value">' + esc(formatDate(d['預かり日'])) + '</div></div>'
    + '<div class="row"><div class="row-label">返却予定</div><div class="row-value">' + esc(formatDate(d['返却予定日'])) + '</div></div>'
    + '<div class="row"><div class="row-label">チェック</div><div class="row-value">' + esc(d['受付担当']) + '</div></div>'
    + '</div><div class="section"><div class="section-title">料金</div><table class="price-table">'
    + '<tr><td class="label">保管料（税別）</td><td class="amount">\u00A5' + esc(d['保管料']) + '</td></tr>'
    + disc + '<tr class="total"><td class="label">合計（税別）</td><td class="amount">\u00A5' + esc(d['合計']) + '</td></tr>'
    + '</table><div style="font-size:7pt;color:#999;margin-top:1mm;">※ 料金は税別表示です</div></div></div>';
}
function tireDetail(d) {
  var pos = [{l:'左前',d:d['残溝左前'],m:d['メモ左前']},{l:'右前',d:d['残溝右前'],m:d['メモ右前']},{l:'左後',d:d['残溝左後'],m:d['メモ左後']},{l:'右後',d:d['残溝右後'],m:d['メモ右後']}];
  var h = '<div class="section"><div class="section-title">タイヤ状態詳細</div><table style="width:100%;border-collapse:collapse;font-size:8.5pt;">'
    + '<tr style="background:#f0ebe3;"><td style="padding:0.8mm 2mm;font-weight:bold;">位置</td><td style="padding:0.8mm 2mm;font-weight:bold;">残溝</td><td style="padding:0.8mm 2mm;font-weight:bold;">ホイール</td><td style="padding:0.8mm 2mm;font-weight:bold;">キャップ</td><td style="padding:0.8mm 2mm;font-weight:bold;">ナット</td><td style="padding:0.8mm 2mm;font-weight:bold;">状態メモ</td></tr>';
  for (var i = 0; i < pos.length; i++) h += '<tr style="border-bottom:0.3pt solid #eee;"><td style="padding:0.8mm 2mm;">' + esc(pos[i].l) + '</td><td style="padding:0.8mm 2mm;">' + esc(pos[i].d) + '</td><td style="padding:0.8mm 2mm;">' + esc(d['ホイール種類']) + '</td><td style="padding:0.8mm 2mm;">' + esc(d['キャップ']) + '</td><td style="padding:0.8mm 2mm;">' + esc(d['ナット']) + '</td><td style="padding:0.8mm 2mm;">' + esc(pos[i].m) + '</td></tr>';
  return h + '</table></div>';
}
function notices() {
  return '<div class="two-col"><div class="notice"><div class="notice-title">【返却・お持ち帰りのご予約について】</div><div>返却予定日までのお預かり期間中に、交換作業もしくはお持ち帰りのご予約をお願い致します。ご予約は1週間前までにご連絡をお願い致します。</div></div>'
    + '<div class="notice"><div class="notice-title">【ご注意】</div><div>1）ナットやセンターキャップ等の付属品は、お預かりできかねます。</div><div>2）お預かり料金は年1台分（タイヤ4本セット）となっております。</div><div>3）お預かり期間中、当店の責任により損害が生じた場合、タイヤ及びホイールの時価相当額を補償致します。</div><div>4）お預かり期間を過ぎてもお引取りのない場合、追加の保管料金をお支払い頂きます。</div></div></div>';
}
function page1(d) { return '<div class="page"><div class="doc-title">タイヤ保管 受付確認書（お客様控え）</div>' + companyHeader() + orderInfo(d) + custVeh(d) + tirePrice(d) + tireDetail(d) + notices() + '</div>'; }
function page2() {
  return '<div class="page page-break"><div class="terms-title">タイヤ保管同意書（契約条項）</div>'
    + '<div class="article-title">第一条 目的・内容</div><div class="article-body">当サービスは通常ノーマルタイヤ(夏タイヤ)&ホイールセット、若しくはスタッドレスタイヤ(冬タイヤ)&ホイールセットの不使用期間を有料にて保管するものであり、株式会社 OKABE GROUP がサービスの一環として行うものとします。</div>'
    + '<div class="article-title">第二条 保管対象</div><div class="article-body">① 軽自動車・普通自動車・4WD車のタイヤに限ります。<br>② タイヤのみのお預かりの場合でも、保管料金は変わりません。<br>③ ホイールに付属する部品(ナット・ボルト等)のお預かりは致しません。<br>④ ホイールがタイヤよりはみ出している場合、お預かり出来ない場合がございます。</div>'
    + '<div class="article-title">第三条 契約解除と失効</div><div class="article-body">① 契約解除はお申し出後、保管されているタイヤの返却をもって解除とします。<br>② 契約期間満了前の解除であっても、保管料の返金は致しかねます。<br>③ 保管期間終了後、一ヵ月の猶予を過ぎてもご連絡がない場合、自動更新とし請求を致します。</div>'
    + '<div class="article-title">第四条 契約条項の変更</div><div class="article-body">① 本契約条項は予告なく変更される事があります。但し変更は速やかに通知します。<br>② 異議申し立て等ある場合は、契約の解除をお受けいたします。<br>③ 住所変更・連絡先変更がある場合、当社にご連絡ください。</div>'
    + '<div class="article-title">第五条 保証と免責</div><div class="article-body">保管期間中、管理者の落ち度による著しい損傷・盗難・火災が発生した場合、時価額賠償にて保証致します。但し天災・経年劣化・保管前の傷を除きます。</div>'
    + '<div class="article-title">第六条 個人情報の取り扱い</div><div class="article-body">当社は取得した個人情報をタイヤ保管業務以外には利用致しません。</div>'
    + '<div class="article-title">第七条 同時契約</div><div class="article-body">車輛名義が同名義人又は同居人の車輛に限る。</div>'
    + '<div style="text-align:center;margin-top:15mm;padding-top:5mm;border-top:0.5pt solid #ccc;"><div style="font-size:11pt;font-weight:bold;margin-bottom:10mm;">上記条項に同意します。</div><div style="font-size:10pt;margin-bottom:10mm;">令和　　年　　月　　日</div><div style="display:inline-flex;align-items:flex-end;gap:3mm;"><div style="font-size:10pt;">契約者</div><div style="width:60mm;border-bottom:0.5pt solid #222;height:10mm;"></div><div style="font-size:11pt;margin-bottom:1mm;">&#12958;</div></div></div></div>';
}
function page3(d) {
  return '<div class="page page-break"><div class="doc-title">タイヤ保管 受付確認書（会社控え）</div>' + companyHeader() + orderInfo(d) + custVeh(d) + tirePrice(d) + tireDetail(d)
    + '<div style="margin-top:8mm;text-align:center;"><div style="font-size:9pt;color:#666;margin-bottom:6mm;">上記の内容を確認し、タイヤ保管契約に同意します。</div><div style="display:inline-flex;align-items:flex-end;gap:3mm;"><div style="font-size:10pt;">契約者</div><div style="width:60mm;border-bottom:0.5pt solid #222;height:10mm;"></div><div style="font-size:11pt;margin-bottom:1mm;">&#12958;</div></div></div></div>';
}
loadPdfData();
</script>
</body>
</html>
