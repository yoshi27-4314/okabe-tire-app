<!DOCTYPE html>
<html lang="ja" style="color-scheme:only light;">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>受付確認書 - タイヤホテルOKABE DX</title>
<script src="api.js"></script>
<script src="common.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif; background: #888; padding: 20px; }
.page { width: 210mm; min-height: 297mm; background: #fff; margin: 0 auto 20px; padding: 11mm 17mm; box-shadow: 0 2px 20px rgba(0,0,0,0.3); position: relative; font-size: 12pt; color: #222; line-height: 1.7; overflow: hidden; }
@media print { body { background: #fff; padding: 0; } .page { box-shadow: none; margin: 0; } .no-print { display: none !important; } .page-break { page-break-before: always; } }
.doc-title { text-align: center; font-size: 20pt; font-weight: bold; margin-bottom: 7mm; letter-spacing: 3pt; }
.company-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5mm; }
.company-info { font-size: 11pt; line-height: 1.6; }
.company-name { font-size: 14pt; font-weight: bold; margin-bottom: 1mm; }
.stamp-box { width: 25mm; height: 25mm; border: 0.5pt solid #999; display: flex; align-items: center; justify-content: center; font-size: 8pt; color: #999; }
.order-info { display: flex; justify-content: space-between; font-size: 11pt; margin-bottom: 4mm; padding-bottom: 2mm; border-bottom: 0.5pt solid #ccc; }
.two-col { display: flex; gap: 5mm; margin-bottom: 4mm; }
.two-col > div { flex: 1; }
.section { margin-bottom: 4mm; }
.section-title { font-size: 12pt; font-weight: bold; background: #f0ebe3; padding: 1mm 2mm; margin-bottom: 1mm; }
.row { display: flex; border-bottom: 0.3pt solid #eee; }
.row-label { width: 28mm; font-size: 11pt; color: #666; padding: 1mm 2mm; flex-shrink: 0; }
.row-value { flex: 1; font-size: 12pt; padding: 1mm 2mm; }
.notice { font-size: 11pt; line-height: 1.6; margin-bottom: 3mm; }
.notice-title { font-size: 12pt; font-weight: bold; margin-bottom: 1mm; }
.terms-title { text-align: center; font-size: 20pt; font-weight: bold; margin-bottom: 7mm; }
.article-title { font-size: 13pt; font-weight: bold; margin-top: 5mm; margin-bottom: 1mm; }
.article-body { font-size: 12pt; line-height: 1.8; margin-bottom: 2mm; padding-left: 1mm; }
.tire-table { width: 100%; border-collapse: collapse; font-size: 11pt; }
.tire-table td, .tire-table th { padding: 1mm 2mm; border-bottom: 0.3pt solid #eee; }
.tire-table th { background: #f0ebe3; font-weight: bold; text-align: left; }
.no-print { position: fixed; top: 10px; right: 20px; z-index: 100; display: flex; gap: 8px; }
.no-print button { padding: 10px 20px; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: #fff; }
.btn-print { background: #5C4033; }
.btn-back { background: #E86A2A; }
.loading-msg { text-align: center; padding: 40px; font-size: 16pt; color: #666; background: #fff; width: 210mm; margin: 0 auto; border-radius: 8px; }
</style>
</head>
<body>
<div class="no-print">
  <button class="btn-print" onclick="window.print()">印刷 / PDF保存</button>
  <button class="btn-back" onclick="history.back()">戻る</button>
</div>
<div id="pdfContent"><div class="loading-msg">受付確認書を読み込み中...</div></div>

<script>
var orderNumber = getParam('orderNumber');
function esc(v) { return escapeHtml(v || ''); }

async function loadPdfData() {
  if (!orderNumber) { document.getElementById('pdfContent').innerHTML = '<div class="loading-msg">伝票番号が指定されていません</div>'; return; }
  if (!requireLogin()) return;

  var r = await callAPI('contract_getPreview', { orderNumber: orderNumber });
  if (!r || !r.ok) { document.getElementById('pdfContent').innerHTML = '<div class="loading-msg">' + (r ? r.message : 'データを取得できませんでした') + '</div>'; return; }

  var cust = r.data.customer || {};
  var veh = r.data.vehicle || {};
  var ts = r.data.tireSet || {};
  var recs = r.data.tireRecords || [];
  var order = r.data.order || {};

  var plate = [veh['地名'], veh['分類番号'], veh['かな'], veh['下4桁']].filter(Boolean).join(' ');
  var address = (cust['郵便番号'] ? '\u3012' + cust['郵便番号'] + ' ' : '') + (cust['住所'] || '');

  var d = {
    orderNumber: order['伝票番号'] || orderNumber,
    date: order['登録日時'] || '',
    staff: order['作成者'] || '',
    custName: cust['氏名'] || '',
    phone: cust['電話'] || '',
    mobile: cust['携帯'] || '',
    address: address,
    custCode: cust['顧客コード'] || '',
    plate: plate,
    model: veh['車種名'] || '',
    vin: veh['車台番号'] || '',
    tireType: ts['区分'] || '',
    tireCount: ts['本数'] || '4',
    recs: recs,
  };

  document.getElementById('pdfContent').innerHTML = page1(d) + page2() + page3(d);
}

function companyHeader() {
  return '<div class="company-header"><div class="company-info"><div class="company-name">株式会社 OKABE GROUP</div>'
    + '<div>本部・本社工場 〒500-8357 岐阜市六条大溝1丁目5番1号</div>'
    + '<div>TEL 058-272-6555 / 0120-726-381　FAX 058-275-2070 / 058-272-6225</div>'
    + '<div>E-mail: okabe6555@proof.ocn.ne.jp</div></div><div class="stamp-box">収入印紙</div></div>';
}

function orderInfo(d) {
  return '<div class="order-info"><div>受付番号: ' + esc(d.orderNumber) + '</div>'
    + '<div>受付日時: ' + esc(formatDateTime(d.date)) + '</div>'
    + '<div>受付担当: ' + esc(d.staff) + '</div></div>';
}

function custVeh(d) {
  return '<div class="two-col"><div class="section"><div class="section-title">お客様情報</div>'
    + '<div class="row"><div class="row-label">お名前</div><div class="row-value">' + esc(d.custName) + ' 様</div></div>'
    + '<div class="row"><div class="row-label">電話</div><div class="row-value">' + esc(d.phone) + '</div></div>'
    + '<div class="row"><div class="row-label">携帯</div><div class="row-value">' + esc(d.mobile) + '</div></div>'
    + '<div class="row"><div class="row-label">住所</div><div class="row-value">' + esc(d.address) + '</div></div>'
    + '<div class="row"><div class="row-label">顧客コード</div><div class="row-value">' + esc(d.custCode) + '</div></div>'
    + '</div><div class="section"><div class="section-title">車両情報</div>'
    + '<div class="row"><div class="row-label">ナンバー</div><div class="row-value">' + esc(d.plate) + '</div></div>'
    + '<div class="row"><div class="row-label">車種</div><div class="row-value">' + esc(d.model) + '</div></div>'
    + '<div class="row"><div class="row-label">車台番号</div><div class="row-value">' + esc(d.vin) + '</div></div></div></div>';
}

function tireDetail(d) {
  var h = '<div class="section"><div class="section-title">お預かりタイヤ（' + esc(d.tireType) + 'タイヤ ' + esc(d.tireCount) + '本）</div>';
  h += '<table class="tire-table"><tr><th>位置</th><th>メーカー</th><th>パターン</th><th>サイズ</th><th>残溝</th><th>ホイール</th><th>キャップ</th><th>傷</th></tr>';
  for (var i = 0; i < d.recs.length; i++) {
    var rec = d.recs[i];
    var scratches = [];
    if (rec['傷_サイドウォール'] === 'はい') scratches.push('側面');
    if (rec['傷_トレッド面'] === 'はい') scratches.push('トレッド');
    if (rec['傷_リム'] === 'はい') scratches.push('リム');
    var scratchText = rec['傷なし'] === 'はい' ? 'なし' : scratches.join(',') || '';
    h += '<tr><td>' + esc(rec['ポジション']) + '</td><td>' + esc(rec['メーカー']) + '</td><td>' + esc(rec['パターン']) + '</td><td>' + esc(rec['サイズ']) + '</td><td>' + esc(rec['残溝']) + 'mm</td><td>' + esc(rec['ホイール種別']) + '</td><td>' + esc(rec['キャップ']) + '</td><td>' + scratchText + '</td></tr>';
  }
  h += '</table></div>';
  return h;
}

function notices() {
  return '<div class="two-col"><div class="notice"><div class="notice-title">【返却・お持ち帰りのご予約について】</div><div>返却予定日までのお預かり期間中に、交換作業もしくはお持ち帰りのご予約をお願い致します。ご予約は1週間前までにご連絡をお願い致します。</div></div>'
    + '<div class="notice"><div class="notice-title">【ご注意】</div><div>1）ナットやセンターキャップ等の付属品は、お預かりできかねます。</div><div>2）お預かり料金は年1台分（タイヤ4本セット）となっております。</div><div>3）お預かり期間中、当店の責任により損害が生じた場合、タイヤ及びホイールの時価相当額を補償致します。</div><div>4）お預かり期間を過ぎてもお引取りのない場合、追加の保管料金をお支払い頂きます。</div></div></div>';
}

function page1(d) {
  return '<div class="page"><div class="doc-title">タイヤ保管 受付確認書（お客様控え）</div>' + companyHeader() + orderInfo(d) + custVeh(d) + tireDetail(d) + notices() + '</div>';
}

function page2() {
  return '<div class="page page-break"><div class="terms-title">タイヤ保管同意書（契約条項）</div>'
    + '<div class="article-title">第一条 目的・内容</div><div class="article-body">当サービスは通常ノーマルタイヤ(夏タイヤ)&ホイールセット、若しくはスタッドレスタイヤ(冬タイヤ)&ホイールセットの不使用期間を有料にて保管するものであり、株式会社 OKABE GROUP がサービスの一環として行うものとします。</div>'
    + '<div class="article-title">第二条 保管対象</div><div class="article-body">① 軽自動車・普通自動車・4WD車のタイヤに限ります。<br>② タイヤのみのお預かりの場合でも、保管料金は変わりません。<br>③ ホイールに付属する部品(ナット・ボルト等)のお預かりは致しません。<br>④ ホイールがタイヤよりはみ出している場合、お預かり出来ない場合がございます。</div>'
    + '<div class="article-title">第三条 契約解除と失効</div><div class="article-body">① 契約解除はお申し出後、保管されているタイヤの返却をもって解除とします。<br>② 契約期間満了前の解除であっても、保管料の返金は致しかねます。<br>③ 保管期間終了後、一ヵ月の猶予を過ぎてもご連絡がない場合、自動更新とし請求を致します。</div>'
    + '<div class="article-title">第四条 契約条項の変更</div><div class="article-body">① 本契約条項は予告なく変更される事があります。但し変更は速やかに通知します。<br>② 異議申し立て等ある場合は、契約の解除をお受けいたします。<br>③ 住所変更・連絡先変更がある場合、当社にご連絡ください。</div>'
    + '<div class="article-title">第五条 保証と免責</div><div class="article-body">保管期間中、管理者の落ち度による著しい損傷・盗難・火災が発生した場合、時価額賠償にて保証致します。但し天災・経年劣化・保管前の傷を除きます。</div>'
    + '<div class="article-title">第六条 個人情報の取り扱い</div><div class="article-body">当社は取得した個人情報をタイヤ保管業務以外には利用致しません。</div>'
    + '<div class="article-title">第七条 同時契約</div><div class="article-body">車輛名義が同名義人又は同居人の車輛に限る。</div>'
    + '<div style="text-align:center;margin-top:15mm;padding-top:5mm;border-top:0.5pt solid #ccc;"><div style="font-size:11pt;font-weight:bold;margin-bottom:10mm;">上記条項に同意します。</div><div style="font-size:10pt;margin-bottom:10mm;">令和　　年　　月　　日</div><div style="display:inline-flex;align-items:flex-end;gap:3mm;"><div style="font-size:10pt;">契約者</div><div style="width:60mm;border-bottom:0.5pt solid #222;height:10mm;"></div><div style="font-size:11pt;margin-bottom:1mm;">&#12958;</div></div></div></div>';
}

function page3(d) {
  return '<div class="page page-break"><div class="doc-title">タイヤ保管 受付確認書（会社控え）</div>' + companyHeader() + orderInfo(d) + custVeh(d) + tireDetail(d)
    + '<div style="margin-top:8mm;text-align:center;"><div style="font-size:9pt;color:#666;margin-bottom:6mm;">上記の内容を確認し、タイヤ保管契約に同意します。</div><div style="display:inline-flex;align-items:flex-end;gap:3mm;"><div style="font-size:10pt;">契約者</div><div style="width:60mm;border-bottom:0.5pt solid #222;height:10mm;"></div><div style="font-size:11pt;margin-bottom:1mm;">&#12958;</div></div></div></div>';
}

loadPdfData();
</script>
</body>
</html>
