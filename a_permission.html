<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>A. 権限管理 - タイヤホテルOKABE DX</title>
<link rel="stylesheet" href="style.css">
<script src="api.js"></script>
<script src="common.js"></script>
<style>
.wo-card { background: var(--white); border: 1px solid var(--border-light); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; box-shadow: var(--shadow-sm); }
.wo-card:active { transform: scale(0.98); }
.wo-card-customer { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.wo-card-detail { font-size: 14px; color: var(--text2); line-height: 1.5; }
.filter-bar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.filter-btn { padding: 6px 12px; font-size: 12px; font-weight: 600; border: 1.5px solid var(--border); border-radius: 6px; color: var(--text3); cursor: pointer; background: var(--white); }
.filter-btn.active { border-color: var(--orange); background: #FFF3EB; color: var(--orange); }
.perm-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-light); }
.perm-info { flex: 1; }
.perm-name { font-size: 13px; color: var(--text); }
.perm-desc { font-size: 11px; color: var(--text3); }
.perm-toggle { width: 48px; height: 28px; border-radius: 14px; border: none; cursor: pointer; position: relative; transition: background 0.2s; flex-shrink: 0; }
.perm-toggle.on { background: var(--green); }
.perm-toggle.off { background: var(--border); }
.perm-toggle::after { content: ''; position: absolute; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--white); transition: left 0.2s; }
.perm-toggle.on::after { left: 23px; }
.perm-toggle.off::after { left: 3px; }
</style>
</head>
<body>

<!-- A-1 スタッフ一覧 -->
<div id="scrTop" class="screen active">
  <div class="header">
    <button class="home-btn" onclick="goHome()">ホーム</button>
    <button class="back-btn" onclick="goBack()">&lt; 戻る</button>
    <div class="header-title">A. 権限管理</div>
  </div>
  <div class="content">
    <div class="search-box">
      <input class="search-input" type="text" id="staffQuery" placeholder="スタッフ名で検索" onkeydown="if(event.key==='Enter')renderList()">
      <button class="search-btn" onclick="renderList()">検索</button>
    </div>
    <div class="filter-bar">
      <span class="filter-btn active" data-value="" onclick="setDept(this)">全員</span>
      <span class="filter-btn" data-value="フロント" onclick="setDept(this)">フロント</span>
      <span class="filter-btn" data-value="サービス" onclick="setDept(this)">サービス</span>
      <span class="filter-btn" data-value="営業" onclick="setDept(this)">営業</span>
    </div>
    <div id="staffList" style="color:var(--text3);text-align:center;padding:20px;">読み込み中...</div>
  </div>
  <div class="page-id">A-1 スタッフ一覧</div>
</div>

<!-- A-2 権限設定 -->
<div id="scrPerm" class="screen">
  <div class="header">
    <button class="home-btn" onclick="goHome()">ホーム</button>
    <button class="back-btn" onclick="showScr('scrTop')">&lt; 戻る</button>
    <div class="header-title">権限設定</div>
  </div>
  <div class="content">
    <div class="confirm-box" id="staffInfo"></div>
    <div id="permBody"></div>
    <div class="form-section">
      <div class="form-section-title">変更理由 <span style="color:var(--red);font-size:12px;">*必須</span></div>
      <textarea class="form-input" rows="2" id="reason" placeholder="変更する理由を入力してください（必須）" style="resize:vertical;"></textarea>
    </div>
    <button class="btn-primary" id="saveBtn" style="background:var(--green);font-size:16px;padding:16px;" onclick="savePerm()">権限を保存する</button>
    <button class="btn-secondary" onclick="showScr('scrLog')">変更履歴を見る</button>
    <button class="btn-secondary" onclick="showScr('scrTop')">キャンセル</button>
  </div>
  <div class="page-id">A-2 権限設定</div>
</div>

<!-- A-3 保存結果 -->
<div id="scrDone" class="screen">
  <div class="header"><button class="home-btn" onclick="goHome()">ホーム</button><div class="header-title">権限保存結果</div></div>
  <div class="content">
    <div style="text-align:center;font-size:48px;margin:40px 0 16px;">&#x2705;</div>
    <div style="text-align:center;font-size:20px;font-weight:700;color:var(--brown);margin-bottom:8px;">権限を保存しました</div>
    <div class="confirm-box" id="doneInfo"></div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:16px;text-align:center;">変更内容は監査ログに記録されます</div>
    <button class="btn-primary" onclick="loadStaff();showScr('scrTop')">スタッフ一覧に戻る</button>
  </div>
  <div class="page-id">A-3 保存結果</div>
</div>

<!-- A-4 変更履歴 -->
<div id="scrLog" class="screen">
  <div class="header">
    <button class="home-btn" onclick="goHome()">ホーム</button>
    <button class="back-btn" onclick="showScr('scrPerm')">&lt; 戻る</button>
    <div class="header-title">権限変更履歴</div>
  </div>
  <div class="content"><div id="logBody" style="color:var(--text3);text-align:center;padding:20px;">読み込み中...</div></div>
  <div class="page-id">A-4 変更履歴</div>
</div>

<script>
if (!requireLogin()) {}
var perms = JSON.parse(sessionStorage.getItem('permissions') || '{}');
if (!perms['can_manage_permission']) {
  showError('この画面を表示する権限がありません');
  setTimeout(function() { location.href = 'index.html'; }, 1500);
}

// 第8版 権限テーブルの日本語名・やさしい説明
var PERM = {
  can_reception:             { name: '受付',         desc: '来店受付・予約の登録・顧客車両の新規作成ができる' },
  can_signature:             { name: '電子署名',     desc: '契約書の署名受領・契約のACTIVE化ができる' },
  can_view_discount:         { name: '割引確認',     desc: '台数割引のランク・割引率を閲覧できる' },
  can_early_release_apply:   { name: '早期返却申請', desc: '契約途中のタイヤ返却を申請できる' },
  can_early_release_confirm: { name: '早期返却確定', desc: '早期返却の申請を確定し引渡しできる' },
  can_view_customer_schedule:{ name: '顧客予定',     desc: '顧客の予約・作業予定を閲覧できる' },
  can_view_tire_target:      { name: '買替提案',     desc: '残溝・製造年から買替対象を抽出できる' },
  can_print_proposal_pdf:    { name: '提案書PDF',    desc: '営業用の提案書PDFを印刷できる' },
  can_quick_lookup:          { name: 'クイック検索', desc: '顧客・車両・タイヤの統合検索ができる' },
  can_pit_work:              { name: 'サービス作業', desc: 'タイヤ交換作業の開始・完了ができる' },
  can_pit_pause:             { name: '作業中断',     desc: '作業を一時中断できる。部品待ち等' },
  can_edit_pit_record:       { name: '作業記録訂正', desc: '完了済みの作業記録を訂正できる' },
  can_write_manager_memo:    { name: '責任者メモ',   desc: 'サービス責任者のメモを追記できる' },
  can_warehouse_storage:     { name: '棚番・格納',   desc: 'タイヤの入出庫・棚番の割当ができる' },
  can_edit_capacity:         { name: '容量変更',     desc: '倉庫の収容セット数の上限を変更できる' },
  can_procurement_queue:     { name: '発注準備',     desc: 'タイヤ・部品の発注キューを作成できる' },
  can_order_confirm:         { name: '発注確定',     desc: '発注キューを確定し仕入先に注文できる' },
  can_schedule_dispatch:     { name: '作業予定管理', desc: '翌日の作業計画・リフト割当を組める' },
  can_input_cost:            { name: '原価入力',     desc: '仕入原価を入力できる' },
  can_view_cost:             { name: '原価閲覧',     desc: '仕入原価を閲覧できる' },
  can_view_kpi_sales:        { name: '売上KPI',      desc: '売上のKPIダッシュボードを閲覧できる' },
  can_view_kpi_profit:       { name: '利益KPI',      desc: '粗利のKPIを閲覧できる' },
  can_view_kpi_volume:       { name: '台数KPI',      desc: '作業台数・預かり台数のKPIを閲覧できる' },
  can_compare_kpi_periods:   { name: '期間比較',     desc: '前年・前月との比較分析ができる' },
  can_simulate_business_plan:{ name: '事業計画',     desc: '事業計画シミュレーションができる' },
  can_edit_master_supplier:  { name: '仕入先マスタ', desc: '仕入先の追加・編集ができる' },
  can_edit_master_price:     { name: '料金マスタ',   desc: '保管料金・台数割引の変更ができる' },
  can_edit_master_location:  { name: '棚番マスタ',   desc: '棚番・ロケーションの追加・編集ができる' },
  can_edit_master_facility:  { name: '設備マスタ',   desc: 'リフト等の設備の追加・編集ができる' },
  can_edit_master_staff:     { name: 'スタッフマスタ', desc: 'スタッフの追加・編集・無効化ができる' },
  can_manage_permission:     { name: '権限管理',     desc: '他スタッフの権限を変更できる' },
  can_create_executive:      { name: '役員権限発行', desc: '上位権限の作成ができる（社長のみ）' },
  can_manage_operator:       { name: '運用管理者',   desc: 'システム運用責任者の任命ができる' },
  can_export_backup:         { name: 'バックアップ出力', desc: 'データのExcel出力ができる' },
  can_tv_display_edit:       { name: 'TV表示編集',   desc: '工場モニターの表示内容を編集できる' },
  can_view_audit_timeline:   { name: '監査ログ閲覧', desc: '全操作の監査ログを閲覧できる' }
};

var GROUPS = [
  { title: '受付・顧客（9権限）', keys: ['can_reception','can_signature','can_view_discount','can_early_release_apply','can_early_release_confirm','can_view_customer_schedule','can_view_tire_target','can_print_proposal_pdf','can_quick_lookup'] },
  { title: 'サービス作業（4権限）', keys: ['can_pit_work','can_pit_pause','can_edit_pit_record','can_write_manager_memo'] },
  { title: '倉庫・発注・配車（5権限）', keys: ['can_warehouse_storage','can_edit_capacity','can_procurement_queue','can_order_confirm','can_schedule_dispatch'] },
  { title: '経営・KPI（7権限）', keys: ['can_input_cost','can_view_cost','can_view_kpi_sales','can_view_kpi_profit','can_view_kpi_volume','can_compare_kpi_periods','can_simulate_business_plan'] },
  { title: 'マスタ編集（5権限）', keys: ['can_edit_master_supplier','can_edit_master_price','can_edit_master_location','can_edit_master_facility','can_edit_master_staff'] },
  { title: '管理・監査（4権限）', keys: ['can_manage_permission','can_create_executive','can_manage_operator','can_export_backup'] },
  { title: '表示・閲覧（2権限）', keys: ['can_tv_display_edit','can_view_audit_timeline'] }
];

var allStaff = [], dept = '', curId = '', curPerm = {}, orgPerm = {};

function showScr(id) {
  var s = document.querySelectorAll('.screen');
  for (var i = 0; i < s.length; i++) s[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
  if (id === 'scrLog') loadLog();
}
function setDept(el) {
  var b = document.querySelectorAll('.filter-btn');
  for (var i = 0; i < b.length; i++) b[i].classList.remove('active');
  el.classList.add('active');
  dept = el.dataset.value || '';
  renderList();
}

async function loadStaff() {
  var r = await callAPI('admin_staffList', {});
  if (handleAPIError(r)) return;
  allStaff = r.data.staffList || [];
  renderList();
}
function renderList() {
  var q = (document.getElementById('staffQuery').value || '').trim();
  var f = allStaff.filter(function(s) {
    if (dept && (s['部門'] || '').indexOf(dept) < 0 && (s['役職'] || '').indexOf(dept) < 0 && (s['兼任'] || '').indexOf(dept) < 0) return false;
    if (q && (s['氏名'] || '').indexOf(q) < 0) return false;
    return true;
  });
  if (!f.length) { document.getElementById('staffList').innerHTML = '<div style="color:var(--text3);text-align:center;padding:20px;">該当なし</div>'; return; }
  f.sort(function(a, b) {
    var aRole = (a['役職'] || ''), bRole = (b['役職'] || '');
    var aScore = 2, bScore = 2;
    if (aRole.indexOf('社長') >= 0) aScore = 0;
    else if (dept && aRole.indexOf(dept) >= 0 && aRole.indexOf('責任者') >= 0) aScore = 0;
    else if (aRole.indexOf('責任者') >= 0) aScore = 1;
    if (bRole.indexOf('社長') >= 0) bScore = 0;
    else if (dept && bRole.indexOf(dept) >= 0 && bRole.indexOf('責任者') >= 0) bScore = 0;
    else if (bRole.indexOf('責任者') >= 0) bScore = 1;
    return aScore - bScore;
  });
  var h = '';
  for (var i = 0; i < f.length; i++) {
    h += '<div class="wo-card" onclick="openPerm(\'' + escapeHtml(f[i]['スタッフID']) + '\')">'
      + '<div class="wo-card-customer">' + escapeHtml(f[i]['氏名'] || '') + '</div>'
      + '<div class="wo-card-detail">' + escapeHtml(f[i]['役職'] || '') + '</div></div>';
  }
  document.getElementById('staffList').innerHTML = h;
}

async function openPerm(id) {
  curId = id;
  var s = allStaff.find(function(x) { return x['スタッフID'] === id; });
  if (!s) return;
  document.getElementById('staffInfo').innerHTML =
    '<div style="font-size:13px;font-weight:600;color:var(--brown);margin-bottom:6px;">スタッフ情報</div>'
    + '<div class="confirm-row"><span class="confirm-label">氏名</span><span class="confirm-value">' + escapeHtml(s['氏名']) + '</span></div>'
    + '<div class="confirm-row"><span class="confirm-label">ID</span><span class="confirm-value">' + escapeHtml(id) + '</span></div>'
    + '<div class="confirm-row"><span class="confirm-label">役職</span><span class="confirm-value">' + escapeHtml(s['役職'] || '') + '</span></div>';
  curPerm = {}; orgPerm = {};
  for (var g = 0; g < GROUPS.length; g++)
    for (var k = 0; k < GROUPS[g].keys.length; k++) { curPerm[GROUPS[g].keys[k]] = false; orgPerm[GROUPS[g].keys[k]] = false; }
  var r = await callAPI('admin_staffList', { targetStaffId: id });
  if (r && r.ok && r.data && r.data.permissions) {
    var p = r.data.permissions;
    for (var key in p) { if (curPerm.hasOwnProperty(key)) { curPerm[key] = !!p[key]; orgPerm[key] = !!p[key]; } }
  }
  renderPerm();
  document.getElementById('reason').value = '';
  showScr('scrPerm');
}
function renderPerm() {
  var h = '';
  for (var g = 0; g < GROUPS.length; g++) {
    var gr = GROUPS[g];
    h += '<div class="form-section"><div class="form-section-title">' + gr.title + '</div>';
    for (var k = 0; k < gr.keys.length; k++) {
      var key = gr.keys[k], p = PERM[key] || { name: key, desc: '' }, on = curPerm[key];
      h += '<div class="perm-row"><div class="perm-info"><div class="perm-name">' + escapeHtml(p.name) + '</div>'
        + '<div class="perm-desc">' + escapeHtml(p.desc) + '</div></div>'
        + '<button class="perm-toggle ' + (on ? 'on' : 'off') + '" data-key="' + key + '" onclick="tog(this)"></button></div>';
    }
    h += '</div>';
  }
  document.getElementById('permBody').innerHTML = h;
}
function tog(el) {
  var k = el.dataset.key;
  curPerm[k] = !curPerm[k];
  el.classList.toggle('on', curPerm[k]);
  el.classList.toggle('off', !curPerm[k]);
}

async function savePerm() {
  var reason = document.getElementById('reason').value.trim();
  if (!reason) { showError('変更理由を入力してください'); return; }
  var changes = [];
  for (var k in curPerm) { if (curPerm[k] !== orgPerm[k]) changes.push({ name: k, value: curPerm[k] ? 'はい' : 'いいえ' }); }
  if (!changes.length) { showError('変更された権限がありません'); return; }
  startLoading(document.getElementById('saveBtn'));
  for (var i = 0; i < changes.length; i++) {
    var r = await callAPI('admin_changePermission', { targetStaffId: curId, permissionName: changes[i].name, newValue: changes[i].value, reason: reason });
    if (handleAPIError(r)) { stopLoading(document.getElementById('saveBtn')); return; }
  }
  stopLoading(document.getElementById('saveBtn'));
  var st = allStaff.find(function(x) { return x['スタッフID'] === curId; });
  document.getElementById('doneInfo').innerHTML =
    '<div class="confirm-row"><span class="confirm-label">対象</span><span class="confirm-value">' + escapeHtml((st ? st['氏名'] : '') + ' (' + curId + ')') + '</span></div>'
    + '<div class="confirm-row"><span class="confirm-label">変更数</span><span class="confirm-value">' + changes.length + '件</span></div>'
    + '<div class="confirm-row"><span class="confirm-label">変更者</span><span class="confirm-value">' + escapeHtml(getStaffName()) + '</span></div>';
  showScr('scrDone');
}

async function loadLog() {
  var r = await callAPI('admin_permissionHistory', {});
  if (handleAPIError(r)) return;
  var logs = r.data.history || [];
  if (!logs.length) { document.getElementById('logBody').innerHTML = '<div style="color:var(--text3);text-align:center;padding:20px;">履歴なし</div>'; return; }
  var h = '';
  for (var i = 0; i < logs.length; i++) {
    var l = logs[i];
    h += '<div class="wo-card" style="cursor:default;">'
      + '<div style="font-size:12px;color:var(--text3);margin-bottom:4px;">' + escapeHtml(formatDateTime(l['日時'])) + '</div>'
      + '<div class="wo-card-detail">変更者: ' + escapeHtml(l['操作者'] || l['実行した人'] || '') + '</div>'
      + '<div style="margin-top:4px;font-size:13px;">' + escapeHtml(l['内容の要点'] || '') + '</div>'
      + '<div style="font-size:12px;color:var(--text3);margin-top:4px;">理由: ' + escapeHtml(l['理由'] || '') + '</div></div>';
  }
  document.getElementById('logBody').innerHTML = h;
}

loadStaff();
</script>
</body>
</html>
