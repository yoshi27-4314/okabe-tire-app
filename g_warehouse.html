<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>G. 倉庫 - タイヤホテルOKABE DX</title>
<link rel="stylesheet" href="style.css">
<script src="api.js"></script>
<script src="common.js"></script>
<style>
.wo-card { background: var(--white); border: 1px solid var(--border-light); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; box-shadow: var(--shadow-sm); }
.wo-card:active { transform: scale(0.98); }
.wo-card-detail { font-size: 14px; color: var(--text2); line-height: 1.5; }
.summary-card { background: var(--white); border: 1px solid var(--border-light); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.done-icon { text-align: center; font-size: 64px; margin: 30px 0 12px; }
.done-title { text-align: center; font-size: 20px; font-weight: 700; color: var(--brown); margin-bottom: 16px; }
</style>
</head>
<body>

<!-- G-1 倉庫トップ -->
<div id="scrTop" class="screen active">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="goBack()">&lt; 戻る</button>
    <div class="header-title">G. 倉庫</div>
  </div>
  <div class="content">
    <div id="warehouseSummary"><div style="text-align:center;color:var(--text3);padding:12px;">読み込み中...</div></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
      <button class="btn-primary" style="margin:0;" onclick="loadPending();showScr('scrPending')">格納待ち</button>
      <button class="btn-secondary" style="margin:0;" onclick="location.href='search_storage.html'">タイヤ検索</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <button class="btn-secondary" style="margin:0;" onclick="location.href='g_warehouse_special.html'">早期返却・廃棄</button>
      <button class="btn-secondary" style="margin:0;" onclick="location.href='g_warehouse_special.html?tab=rack'">棚番一覧</button>
    </div>
  </div>
  <div class="page-id">G-1 倉庫トップ</div>
</div>

<!-- G-2 格納待ち一覧 -->
<div id="scrPending" class="screen">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="showScr('scrTop')">&lt; 戻る</button>
    <div class="header-title">格納待ち</div>
  </div>
  <div class="content">
    <div id="pendingList"></div>
  </div>
  <div class="page-id">G-2 格納待ち一覧</div>
</div>

<!-- G-3 格納 -->
<div id="scrStore" class="screen">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="showScr('scrPending')">&lt; 戻る</button>
    <div class="header-title">タイヤ格納</div>
  </div>
  <div class="content">
    <div class="info-bar" id="storeInfo"></div>
    <div class="form-section">
      <div class="form-section-title">タイヤ情報</div>
      <div class="form-row"><label class="form-label">メーカー</label><input class="form-input" type="text" id="storeMaker" placeholder="ブリヂストン"></div>
      <div class="form-row"><label class="form-label">銘柄</label><input class="form-input" type="text" id="storeBrand" placeholder="ブリザック VRX3"></div>
      <div class="form-row"><label class="form-label">サイズ</label><input class="form-input" type="text" id="storeSize" placeholder="195/65R15"></div>
      <div class="form-row"><label class="form-label">残溝（mm）</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div><label style="font-size:11px;color:var(--text3);text-align:center;display:block;">左前</label>
            <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
              <button type="button" style="width:36px;height:36px;font-size:18px;font-weight:700;border:1.5px solid var(--border);border-radius:8px;background:var(--white);cursor:pointer;color:var(--orange);" onclick="adjG(this,-0.1)">-</button>
              <input class="form-input" type="number" id="storeG1" step="0.1" value="5.0" style="width:70px;text-align:center;padding:10px;font-size:18px;font-weight:700;">
              <button type="button" style="width:36px;height:36px;font-size:18px;font-weight:700;border:1.5px solid var(--border);border-radius:8px;background:var(--white);cursor:pointer;color:var(--orange);" onclick="adjG(this,0.1)">+</button>
            </div>
          </div>
          <div><label style="font-size:11px;color:var(--text3);text-align:center;display:block;">右前</label>
            <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
              <button type="button" style="width:36px;height:36px;font-size:18px;font-weight:700;border:1.5px solid var(--border);border-radius:8px;background:var(--white);cursor:pointer;color:var(--orange);" onclick="adjG(this,-0.1)">-</button>
              <input class="form-input" type="number" id="storeG2" step="0.1" value="5.0" style="width:70px;text-align:center;padding:10px;font-size:18px;font-weight:700;">
              <button type="button" style="width:36px;height:36px;font-size:18px;font-weight:700;border:1.5px solid var(--border);border-radius:8px;background:var(--white);cursor:pointer;color:var(--orange);" onclick="adjG(this,0.1)">+</button>
            </div>
          </div>
          <div><label style="font-size:11px;color:var(--text3);text-align:center;display:block;">左後</label>
            <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
              <button type="button" style="width:36px;height:36px;font-size:18px;font-weight:700;border:1.5px solid var(--border);border-radius:8px;background:var(--white);cursor:pointer;color:var(--orange);" onclick="adjG(this,-0.1)">-</button>
              <input class="form-input" type="number" id="storeG3" step="0.1" value="5.0" style="width:70px;text-align:center;padding:10px;font-size:18px;font-weight:700;">
              <button type="button" style="width:36px;height:36px;font-size:18px;font-weight:700;border:1.5px solid var(--border);border-radius:8px;background:var(--white);cursor:pointer;color:var(--orange);" onclick="adjG(this,0.1)">+</button>
            </div>
          </div>
          <div><label style="font-size:11px;color:var(--text3);text-align:center;display:block;">右後</label>
            <div style="display:flex;align-items:center;justify-content:center;gap:8px;">
              <button type="button" style="width:36px;height:36px;font-size:18px;font-weight:700;border:1.5px solid var(--border);border-radius:8px;background:var(--white);cursor:pointer;color:var(--orange);" onclick="adjG(this,-0.1)">-</button>
              <input class="form-input" type="number" id="storeG4" step="0.1" value="5.0" style="width:70px;text-align:center;padding:10px;font-size:18px;font-weight:700;">
              <button type="button" style="width:36px;height:36px;font-size:18px;font-weight:700;border:1.5px solid var(--border);border-radius:8px;background:var(--white);cursor:pointer;color:var(--orange);" onclick="adjG(this,0.1)">+</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="form-section">
      <div class="form-section-title">棚番を入力</div>
      <div class="form-row"><label class="form-label">棚ID</label><input class="form-input" type="text" id="storeRackId" placeholder="R-001"></div>
      <div class="form-row"><label class="form-label">格納メモ</label><textarea class="form-input" rows="2" id="storeMemo" placeholder="メモ" style="resize:vertical;"></textarea></div>
    </div>
    <button class="btn-primary" id="storeBtn" onclick="doStore()">格納する</button>
    <button class="btn-secondary" onclick="showScr('scrPending')">キャンセル</button>
  </div>
  <div class="page-id">G-3 タイヤ格納</div>
</div>

<!-- G-4 格納完了 -->
<div id="scrStoreDone" class="screen">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <div class="header-title">格納完了</div>
  </div>
  <div class="content">
    <div class="done-icon">&#x2705;</div>
    <div class="done-title">格納しました</div>
    <button class="btn-primary" onclick="loadPending();showScr('scrPending')">格納待ちに戻る</button>
    <button class="btn-secondary" onclick="loadTop();showScr('scrTop')">倉庫トップに戻る</button>
  </div>
  <div class="page-id">G-4 格納完了</div>
</div>

<!-- G-5 出庫 -->
<div id="scrRelease" class="screen">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="showScr('scrTop')">&lt; 戻る</button>
    <div class="header-title">タイヤ出庫</div>
  </div>
  <div class="content">
    <div class="info-bar" id="releaseInfo"></div>
    <div class="hint-bar">出庫すると、棚は解放されません（出庫済みのまま保持）。</div>
    <button class="btn-primary" id="releaseBtn" onclick="doRelease()">出庫する</button>
    <button class="btn-secondary" onclick="showScr('scrTop')">キャンセル</button>
  </div>
  <div class="page-id">G-5 タイヤ出庫</div>
</div>

<script>
if (!requireLogin()) {}
var currentTireSetId = '';
var currentLocationVersion = null;

function adjG(btn, delta) {
  var input = btn.parentNode.querySelector('input');
  var val = parseFloat(input.value) || 0;
  val = Math.round((val + delta) * 10) / 10;
  if (val < 0) val = 0;
  if (val > 10) val = 10;
  input.value = val.toFixed(1);
}

function showScr(id) {
  var s = document.querySelectorAll('.screen');
  for (var i = 0; i < s.length; i++) s[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

async function loadTop() {
  var result = await callAPI('warehouse_top', {});
  if (handleAPIError(result)) return;
  var warehouses = result.data.warehouses || [];
  var html = '<div class="section-label">倉庫の状況</div>';
  for (var i = 0; i < warehouses.length; i++) {
    var w = warehouses[i];
    html += '<div class="summary-card">'
      + '<div style="display:flex;justify-content:space-between;">'
      + '<span style="font-size:14px;font-weight:600;color:var(--brown);">'
      + escapeHtml(w.warehouse['倉庫名']) + '</span>'
      + '<span style="font-size:16px;font-weight:700;color:var(--orange);">'
      + w.storedCount + '台</span></div>'
      + '<div style="font-size:12px;color:var(--text3);">上限: '
      + escapeHtml(w.warehouse['収容セット数の上限']) + '</div></div>';
  }
  document.getElementById('warehouseSummary').innerHTML = html;
}

async function loadPending() {
  var result = await callAPI('warehouse_pendingList', {});
  if (handleAPIError(result)) return;
  var list = result.data.pendingList || [];
  if (list.length === 0) {
    document.getElementById('pendingList').innerHTML =
      '<div style="text-align:center;color:var(--text3);padding:20px;">格納待ちなし</div>';
    return;
  }
  var html = '<div class="section-label">格納待ち（' + list.length + '件）</div>';
  for (var i = 0; i < list.length; i++) {
    var loc = list[i].location;
    var ts = list[i].tireSet || {};
    var tsId = escapeHtml(loc['タイヤセットID']);
    var ver = Number(loc['版番号']);
    html += '<div class="wo-card" onclick="togglePendingCard(this, event)" data-setid="' + tsId + '" data-ver="' + ver + '">'
      + '<div style="font-size:16px;font-weight:600;margin-bottom:2px;">' + escapeHtml(ts['顧客名'] || '') + '</div>'
      + (ts['ナンバー'] || ts['車種'] ? '<div class="wo-card-detail">' + [ts['ナンバー'], ts['車種']].filter(Boolean).map(escapeHtml).join(' / ') + '</div>' : '')
      + '<div class="wo-card-detail">' + escapeHtml(ts['区分'] || '') + ' ' + escapeHtml(ts['本数'] || '') + '本</div>'
      + '<div style="font-size:12px;color:var(--text3);margin-top:4px;">' + tsId + ' ▼</div>'
      + '<div class="pending-detail" style="display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-light);">'
      + '<div style="font-size:13px;color:var(--text2);line-height:1.8;">'
      + '<div>メーカー: ' + escapeHtml(ts['メーカー'] || '未登録') + '</div>'
      + '<div>銘柄: ' + escapeHtml(ts['銘柄'] || '未登録') + '</div>'
      + '<div>サイズ: ' + escapeHtml(ts['サイズ'] || '未登録') + '</div>'
      + '</div>'
      + '<div style="margin-top:10px;">'
      + '<label style="font-size:12px;font-weight:600;color:var(--text2);">棚番</label>'
      + '<input class="form-input" type="text" placeholder="棚番を入力" style="margin-top:4px;" id="rack_' + tsId + '">'
      + '</div>'
      + '<button class="btn-primary" style="margin-top:10px;" onclick="event.stopPropagation();doStoreFromCard(\'' + tsId + '\',' + ver + ')">この棚に格納する</button>'
      + '</div></div>';
  }
  document.getElementById('pendingList').innerHTML = html;
}

function togglePendingCard(card, event) {
  if (event && (event.target.tagName === 'INPUT' || event.target.tagName === 'BUTTON' || event.target.tagName === 'TEXTAREA')) return;
  var detail = card.querySelector('.pending-detail');
  if (detail) detail.style.display = detail.style.display === 'none' ? '' : 'none';
}

async function doStoreFromCard(tireSetId, version) {
  var rackInput = document.getElementById('rack_' + tireSetId);
  var rackId = rackInput ? rackInput.value.trim() : '';
  if (!rackId) { showError('棚番を入力してください'); return; }
  var result = await callAPI('warehouse_store', {
    tireSetId: tireSetId, rackId: rackId, version: version, memo: ''
  });
  if (handleAPIError(result)) return;
  showSuccess('格納しました');
  loadPending();
}

function showStore(tireSetId, version) {
  currentTireSetId = tireSetId;
  currentLocationVersion = version;
  document.getElementById('storeInfo').innerHTML =
    '<span class="info-bar-label">セットID: </span><strong>'
    + escapeHtml(tireSetId) + '</strong>';
  document.getElementById('storeRackId').value = '';
  document.getElementById('storeMemo').value = '';
  document.getElementById('storeMaker').value = '';
  document.getElementById('storeBrand').value = '';
  document.getElementById('storeSize').value = '';
  document.getElementById('storeG1').value = '';
  document.getElementById('storeG2').value = '';
  document.getElementById('storeG3').value = '';
  document.getElementById('storeG4').value = '';
  showScr('scrStore');
}

async function doStore() {
  var rackId = document.getElementById('storeRackId').value.trim();
  if (!rackId) { showError('棚IDを入力してください'); return; }
  startLoading(document.getElementById('storeBtn'));
  // タイヤ情報があれば先に記録する
  var maker = document.getElementById('storeMaker').value.trim();
  var brand = document.getElementById('storeBrand').value.trim();
  var size = document.getElementById('storeSize').value.trim();
  if (maker || brand || size) {
    var positions = ['左前','右前','左後','右後'];
    var records = [];
    for (var p = 0; p < 4; p++) {
      records.push({
        position: positions[p], maker: maker, brand: brand, size: size,
        treadDepth: document.getElementById('storeG' + (p+1)).value || ''
      });
    }
    await callAPI('service_recordInspection', {
      jobId: '', tireSetId: currentTireSetId, records: records
    });
  }
  var result = await callAPI('warehouse_store', {
    tireSetId: currentTireSetId,
    rackId: rackId,
    version: currentLocationVersion,
    memo: document.getElementById('storeMemo').value.trim()
  });
  stopLoading(document.getElementById('storeBtn'));
  if (handleAPIError(result)) return;
  showScr('scrStoreDone');
}

function showRelease(tireSetId, version) {
  currentTireSetId = tireSetId;
  currentLocationVersion = version;
  document.getElementById('releaseInfo').innerHTML =
    '<span class="info-bar-label">セットID: </span><strong>'
    + escapeHtml(tireSetId) + '</strong>';
  showScr('scrRelease');
}

async function doRelease() {
  startLoading(document.getElementById('releaseBtn'));
  var result = await callAPI('warehouse_release', {
    tireSetId: currentTireSetId,
    version: currentLocationVersion
  });
  stopLoading(document.getElementById('releaseBtn'));
  if (handleAPIError(result)) return;
  showSuccess('出庫しました');
  loadTop();
  showScr('scrTop');
}

loadTop();

var paramSetId = getParam('tireSetId');
if (paramSetId) {
  (async function() {
    var r = await callAPI('warehouse_tireDetail', { tireSetId: paramSetId });
    if (r && r.ok && r.data && r.data.location) {
      showRelease(paramSetId, Number(r.data.location['版番号']));
    }
  })();
}
</script>
</body>
</html>
