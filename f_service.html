<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>F. サービス作業 - タイヤホテルOKABE DX</title>
<link rel="stylesheet" href="style.css">
<script src="api.js"></script>
<script src="common.js"></script>
<style>
.wo-card { background: var(--white); border: 1px solid var(--border-light); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; box-shadow: var(--shadow-sm); }
.wo-card:active { transform: scale(0.98); }
.wo-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.wo-number { font-size: 15px; font-weight: 700; color: var(--brown); }
.wo-card-detail { font-size: 14px; color: var(--text2); line-height: 1.5; }
.pit-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.pit-btn { padding: 12px 8px; text-align: center; font-size: 13px; font-weight: 600; border: 1.5px solid var(--border); border-radius: 8px; background: var(--white); cursor: pointer; }
.pit-btn.selected { border-color: var(--orange); background: #FFF3EB; color: var(--orange); }
.btn-danger { width: 100%; padding: 14px; font-size: 15px; font-weight: 600; color: var(--red); background: var(--white); border: 1.5px solid var(--red); border-radius: 10px; cursor: pointer; }
</style>
</head>
<body>

<!-- F-1 作業一覧 -->
<div id="scrList" class="screen active">
  <div class="header">
    <button class="home-btn" onclick="goHome()">ホーム</button>
    <button class="back-btn" onclick="goBack()">&lt; 戻る</button>
    <div class="header-title">F. サービス作業</div>
  </div>
  <div class="content">
    <div class="section-label">本日の作業</div>
    <div id="serviceList" style="text-align:center;color:var(--text3);padding:12px;">読み込み中...</div>
  </div>
  <div class="page-id">F-1 サービス作業一覧</div>
</div>

<!-- F-2 作業詳細・開始 -->
<div id="scrDetail" class="screen">
  <div class="header">
    <button class="home-btn" onclick="goHome()">ホーム</button>
    <button class="back-btn" onclick="showScr('scrList')">&lt; 戻る</button>
    <div class="header-title">作業詳細</div>
  </div>
  <div class="content">
    <div class="info-bar" id="detailInfo"></div>
    <button class="btn-primary" id="startBtn" onclick="startWork()">作業を開始する</button>
    <button class="btn-secondary" onclick="showScr('scrList')">戻る</button>
  </div>
  <div class="page-id">F-2 作業詳細・開始</div>
</div>

<!-- F-3 作業中 -->
<div id="scrWorking" class="screen">
  <div class="header">
    <button class="home-btn" onclick="goHome()">ホーム</button>
    <button class="back-btn" onclick="showScr('scrList')">&lt; 戻る</button>
    <div class="header-title">作業中</div>
  </div>
  <div class="content">
    <div id="workBanner" style="background:var(--orange);color:#fff;border-radius:10px;padding:14px;text-align:center;margin-bottom:16px;"></div>
    <div class="form-section">
      <label class="form-label">作業メモ</label>
      <textarea class="form-input" rows="3" id="workMemo" placeholder="作業メモ・注意事項" style="resize:vertical;"></textarea>
    </div>
    <button class="btn-primary" style="background:var(--green);" id="completeBtn" onclick="completeWork()">作業完了</button>
    <button class="btn-secondary" onclick="showScr('scrPause')">中断する</button>
  </div>
  <div class="page-id">F-3 作業中</div>
</div>

<!-- F-4 中断 -->
<div id="scrPause" class="screen">
  <div class="header">
    <button class="home-btn" onclick="goHome()">ホーム</button>
    <button class="back-btn" onclick="showScr('scrWorking')">&lt; 戻る</button>
    <div class="header-title">作業中断</div>
  </div>
  <div class="content">
    <div class="form-section">
      <div class="form-section-title">中断理由 <span class="form-required">*</span></div>
      <div class="toggle-group" id="pauseReasonGroup">
        <span class="toggle-btn" onclick="toggleCheck(this)">部品待ち</span>
        <span class="toggle-btn" onclick="toggleCheck(this)">お客様確認待ち</span>
        <span class="toggle-btn" onclick="toggleCheck(this)">リフト空き待ち</span>
        <span class="toggle-btn" onclick="toggleCheck(this)">昼休憩</span>
        <span class="toggle-btn" onclick="toggleCheck(this)">その他</span>
      </div>
      <div class="form-row" style="margin-top:12px;">
        <label class="form-label">中断メモ</label>
        <textarea class="form-input" rows="2" id="pauseMemo" placeholder="詳細を入力" style="resize:vertical;"></textarea>
      </div>
    </div>
    <button class="btn-danger" id="pauseBtn" onclick="doPause()">中断を確定</button>
    <button class="btn-secondary" onclick="showScr('scrWorking')">キャンセル</button>
  </div>
  <div class="page-id">F-4 中断</div>
</div>

<!-- F-6 完了 -->
<div id="scrDone" class="screen">
  <div class="header">
    <button class="home-btn" onclick="goHome()">ホーム</button>
    <div class="header-title">作業完了</div>
  </div>
  <div class="content">
    <div style="text-align:center;font-size:64px;margin:30px 0 12px;">&#x2705;</div>
    <div style="text-align:center;font-size:20px;font-weight:700;color:var(--brown);margin-bottom:8px;">作業が完了しました</div>
    <div id="doneContent"></div>
    <button class="btn-primary" onclick="location.href='g_warehouse.html'">倉庫格納へ</button>
    <button class="btn-secondary" onclick="loadList();showScr('scrList')">作業一覧に戻る</button>
  </div>
  <div class="page-id">F-6 作業完了</div>
</div>

<script>
if (!requireLogin()) {}
var curOrder = null, curJob = null, curJobVer = null, liftId = '';

function showScr(id) {
  var s = document.querySelectorAll('.screen');
  for (var i = 0; i < s.length; i++) s[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
function selectLift(el) {
  var b = document.querySelectorAll('.pit-btn');
  for (var i = 0; i < b.length; i++) b[i].classList.remove('selected');
  el.classList.add('selected');
  liftId = el.dataset.id;
}

// F-1: 一覧読み込み（顧客名・ナンバー・車種はGASが付加して返す）
async function loadList() {
  var r = await callAPI('service_list', {});
  if (handleAPIError(r)) return;
  var items = r.data.items || [];
  if (!items.length) {
    document.getElementById('serviceList').innerHTML = '<div style="text-align:center;color:var(--text3);padding:20px;">本日の作業はありません</div>';
    return;
  }
  var h = '';
  for (var i = 0; i < items.length; i++) {
    var o = items[i].order, j = items[i].job;
    var st = j ? j['状態'] : '受付済';
    h += '<div class="wo-card" onclick="loadDetail(\'' + escapeHtml(o['伝票番号']) + '\')">'
      + '<div class="wo-card-top"><span class="wo-number">' + escapeHtml(o['伝票番号']) + '</span>'
      + '<span class="status ' + getStatusClass(st) + '">' + escapeHtml(st) + '</span></div>'
      + '<div style="font-size:16px;font-weight:600;margin-bottom:2px;">' + escapeHtml(o['顧客名'] || '') + '</div>'
      + '<div class="wo-card-detail">' + escapeHtml(o['ナンバー'] || '') + ' / ' + escapeHtml(o['車種'] || '') + '</div>'
      + '<div class="wo-card-detail">' + escapeHtml(o['利用区分'] || '') + '</div>'
      + '<div style="font-size:12px;color:var(--text3);margin-top:4px;">' + formatDateTime(o['登録日時']) + '</div>'
      + (st === '中断' ? '<div style="font-size:13px;color:var(--orange);font-weight:600;margin-top:6px;">タップして再開・詳細確認</div>' : '')
      + '</div>';
  }
  document.getElementById('serviceList').innerHTML = h;
}

// F-2: 詳細読み込み
async function loadDetail(orderNumber) {
  var r = await callAPI('service_detail', { orderNumber: orderNumber });
  if (handleAPIError(r)) return;
  curOrder = r.data.order; curJob = r.data.job;
  curJobVer = curJob ? curJob['版番号'] : null;
  var o = curOrder;
  document.getElementById('detailInfo').innerHTML =
    '<div style="font-size:17px;font-weight:600;margin-bottom:4px;">' + escapeHtml(o['顧客名'] || '') + '</div>'
    + '<div>' + escapeHtml(o['ナンバー'] || '') + ' / ' + escapeHtml(o['車種'] || '') + '</div>'
    + '<div>' + escapeHtml(o['利用区分'] || '') + '</div>';
  var lh = '';
  for (var l = 1; l <= 8; l++) {
    var lid = 'L-' + String(l).padStart(3, '0');
    lh += '<div class="pit-btn" data-id="' + lid + '" onclick="selectLift(this)">リフト' + l + '</div>';
  }
  document.getElementById('liftGrid').innerHTML = lh;
  if (curJob) {
    document.getElementById('workBanner').innerHTML =
      '<div style="font-size:12px;">作業中</div><div style="font-size:20px;font-weight:700;">' + escapeHtml(o['顧客名'] || '') + '</div>'
      + (o['ナンバー'] || o['車種'] ? '<div style="font-size:14px;">' + [o['ナンバー'], o['車種']].filter(Boolean).map(escapeHtml).join(' / ') + '</div>' : '');
    document.getElementById('workMemo').value = curJob['作業メモ'] || '';
    showScr('scrWorking');
  } else { showScr('scrDetail'); }
}

async function startWork() {
  if (!curOrder) return;
  startLoading(document.getElementById('startBtn'));
  var r = await callAPI('service_start', {
    orderNumber: curOrder['伝票番号'], staffId: getStaffId(),
    liftId: liftId, idempotencyKey: generateIdempotencyKey()
  });
  stopLoading(document.getElementById('startBtn'));
  if (handleAPIError(r)) return;
  curJob = { '実績ID': r.data.jobId, '版番号': 1 }; curJobVer = 1;
  document.getElementById('workBanner').innerHTML =
    '<div style="font-size:12px;">作業中</div><div style="font-size:20px;font-weight:700;">' + escapeHtml(curOrder['顧客名'] || '') + '</div>'
    + (curOrder['ナンバー'] || curOrder['車種'] ? '<div style="font-size:14px;">' + [curOrder['ナンバー'], curOrder['車種']].filter(Boolean).map(escapeHtml).join(' / ') + '</div>' : '');
  showScr('scrWorking');
}

async function doPause() {
  if (!curJob) return;
  var reason = getToggleValue('pauseReasonGroup');
  if (!reason) { showError('中断理由を選択してください'); return; }
  startLoading(document.getElementById('pauseBtn'));
  var r = await callAPI('service_pause', {
    jobId: curJob['実績ID'], version: curJobVer,
    reason: reason, memo: document.getElementById('pauseMemo').value.trim()
  });
  stopLoading(document.getElementById('pauseBtn'));
  if (handleAPIError(r)) return;
  curJobVer = r.data.newVersion;
  showSuccess('作業を中断しました');
  loadList(); showScr('scrList');
}

async function completeWork() {
  if (!curJob) return;
  if (!confirmAction('作業を完了しますか？')) return;
  startLoading(document.getElementById('completeBtn'));
  var r = await callAPI('service_complete', {
    jobId: curJob['実績ID'], version: curJobVer,
    idempotencyKey: generateIdempotencyKey(),
    memo: document.getElementById('workMemo').value.trim()
  });
  stopLoading(document.getElementById('completeBtn'));
  if (handleAPIError(r)) return;
  document.getElementById('doneContent').innerHTML =
    '<div class="confirm-box">'
    + '<div class="confirm-row"><span class="confirm-label">受付番号</span><span class="confirm-value">' + escapeHtml(curOrder['伝票番号']) + '</span></div>'
    + '<div class="confirm-row"><span class="confirm-label">完了日時</span><span class="confirm-value">' + formatDateTime(new Date()) + '</span></div></div>';
  showScr('scrDone');
}

loadList();
</script>
</body>
</html>
