<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>D. 予約 - タイヤホテルOKABE DX</title>
<link rel="stylesheet" href="style.css">
<script src="api.js"></script>
<script src="common.js"></script>
<style>
.wo-card { background: var(--white); border: 1px solid var(--border-light); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; box-shadow: var(--shadow-sm); }
.wo-card:active { transform: scale(0.98); }
.wo-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.wo-number { font-size: 15px; font-weight: 700; color: var(--brown); }
.wo-card-customer { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.wo-card-detail { font-size: 14px; color: var(--text2); line-height: 1.5; }
.wo-card-time { font-size: 14px; color: var(--text2); margin-top: 4px; }
.btn-danger { width: 100%; padding: 14px; font-size: 15px; font-weight: 600; color: var(--red); background: var(--white); border: 1.5px solid var(--red); border-radius: 10px; cursor: pointer; }
</style>
</head>
<body>

<!-- D-9 予約登録 -->
<div id="scrCreate" class="screen active">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="location.href='d_reception_list.html'">&lt; 戻る</button>
    <div class="header-title">タイヤ交換予約</div>
  </div>
  <div class="content">
    <div class="form-section">
      <div class="form-section-title">予約情報</div>
      <div class="form-row"><label class="form-label">予約希望日</label><input class="form-input" type="date" id="rvDate" style="padding:10px 12px;font-size:14px;"></div>
      <div class="form-row"><label class="form-label">希望日時（自由記述）</label><input class="form-input" type="text" id="rvDateTime" placeholder="10/3 午前、10/5〜10/7のどこか"></div>
      <div class="form-row"><label class="form-label">タイヤ交換</label>
        <div class="toggle-group" id="rvDirection">
          <span class="toggle-btn" data-value="冬→夏" onclick="toggleCheck(this)">冬→夏</span>
          <span class="toggle-btn" data-value="夏→冬" onclick="toggleCheck(this)">夏→冬</span>
        </div>
      </div>
    </div>
    <div class="form-section">
      <div class="form-section-title">お客様（顧客未登録でも予約可）</div>
      <div class="form-row"><label class="form-label">お名前</label><input class="form-input" type="text" id="rvName" placeholder="渡辺"></div>
      <div class="form-row"><label class="form-label">電話番号</label><input class="form-input" type="tel" id="rvPhone" placeholder="058-XXX-XXXX"></div>
      <div class="form-row"><label class="form-label">車種（分かれば）</label><input class="form-input" type="text" id="rvCarType" placeholder="プリウス"></div>
      <div class="form-row"><label class="form-label">ナンバー下4桁（分かれば）</label><input class="form-input" type="text" id="rvPlateNum" placeholder="1234"></div>
    </div>
    <div class="form-section">
      <div class="form-section-title">メモ</div>
      <textarea class="form-input" rows="4" id="rvMemo" placeholder="予約時の連絡事項など" style="resize:vertical;font-size:15px;"></textarea>
    </div>
    <div class="btn-row" style="flex-direction:column;gap:10px;">
      <button class="btn-primary" style="flex:none;background:var(--blue);" id="rvCreateBtn" onclick="createReservation()">予約を登録する</button>
      <button class="btn-secondary" style="flex:none;" onclick="location.href='d_reception_list.html'">キャンセル</button>
    </div>
  </div>
  <div class="page-id">D-9 タイヤ交換予約</div>
</div>

<!-- D-11 予約一覧 -->
<div id="scrList" class="screen">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="location.href='d_reception_list.html'">&lt; 戻る</button>
    <div class="header-title">予約一覧</div>
  </div>
  <div class="content">
    <div class="section-label">希望日順</div>
    <div id="reservationList"><div style="text-align:center;color:var(--text3);padding:12px;">読み込み中...</div></div>
  </div>
  <div class="page-id">D-11 予約一覧</div>
</div>

<!-- D-10 予約詳細 -->
<div id="scrDetail" class="screen">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="showScr('scrList')">&lt; 戻る</button>
    <div class="header-title">予約詳細</div>
  </div>
  <div class="content">
    <div id="detailContent"></div>
    <div class="form-section" style="margin-top:16px;">
      <div class="form-section-title">確認状況</div>
      <div class="toggle-group" id="confirmStatusGroup" style="margin-bottom:8px;">
        <span class="toggle-btn" data-value="未確認" onclick="toggleCheck(this)" style="font-size:12px;padding:8px 14px;">未確認</span>
        <span class="toggle-btn" data-value="返事待ち" onclick="toggleCheck(this)" style="font-size:12px;padding:8px 14px;">返事待ち</span>
        <span class="toggle-btn" data-value="確認済み" onclick="toggleCheck(this)" style="font-size:12px;padding:8px 14px;">確認済み</span>
      </div>
      <textarea class="form-input" rows="2" id="contactMemo" placeholder="連絡メモ" style="font-size:14px;resize:vertical;"></textarea>
      <button class="btn-primary" style="margin-top:8px;" id="statusBtn" onclick="updateStatus()">確認状況を保存</button>
    </div>
    <div class="btn-row" style="flex-direction:column;gap:10px;">
      <button class="btn-primary" style="flex:none;" onclick="goToReception()">来店受付へ進む</button>
      <button class="btn-danger" id="cancelBtn" onclick="cancelReservation()">予約をキャンセル</button>
    </div>
  </div>
  <div class="page-id">D-10 予約詳細</div>
</div>

<script>
if (!requireLogin()) {}
var currentOrder = null;
var currentVersion = null;

function showScr(id) {
  var s = document.querySelectorAll('.screen');
  for (var i = 0; i < s.length; i++) s[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

async function createReservation() {
  startLoading(document.getElementById('rvCreateBtn'));
  var result = await callAPI('reservation_create', {
    idempotencyKey: generateIdempotencyKey(),
    preferredDate: document.getElementById('rvDate').value,
    preferredDateTime: document.getElementById('rvDateTime').value.trim(),
    exchangeDirection: getToggleValue('rvDirection'),
    reservationName: document.getElementById('rvName').value.trim(),
    reservationPhone: document.getElementById('rvPhone').value.trim(),
    reservationCarType: document.getElementById('rvCarType').value.trim(),
    reservationPlateNum: document.getElementById('rvPlateNum').value.trim(),
    memo: document.getElementById('rvMemo').value.trim()
  });
  stopLoading(document.getElementById('rvCreateBtn'));
  if (handleAPIError(result)) return;
  showSuccess('予約を登録しました（' + result.data.orderNumber + '）');
  loadList();
  showScr('scrList');
}

async function loadList() {
  var result = await callAPI('reservation_list', {});
  if (handleAPIError(result)) return;
  var list = result.data.reservations || [];
  if (list.length === 0) {
    document.getElementById('reservationList').innerHTML =
      '<div style="text-align:center;color:var(--text3);padding:20px;">予約はありません</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var r = list[i];
    var st = r['予約の確認状況'] || '未確認';
    html += '<div class="wo-card" onclick="loadDetail(\'' + escapeHtml(r['伝票番号']) + '\')">'
      + '<div class="wo-card-top"><span class="wo-number">' + escapeHtml(r['伝票番号']) + '</span>'
      + '<span class="status ' + getStatusClass(st) + '">' + escapeHtml(st) + '</span></div>'
      + '<div class="wo-card-customer">' + escapeHtml(r['予約者の氏名'] || '（未入力）') + '</div>'
      + '<div class="wo-card-detail">' + escapeHtml(r['交換方向'] || '') + '</div>'
      + '<div class="wo-card-time">' + escapeHtml(r['予約希望日'] || '') + ' '
      + escapeHtml(r['予約の希望日時'] || '') + '</div></div>';
  }
  document.getElementById('reservationList').innerHTML = html;
}

async function loadDetail(orderNumber) {
  var result = await callAPI('reservation_detail', { orderNumber: orderNumber });
  if (handleAPIError(result)) return;
  currentOrder = result.data.order;
  currentVersion = currentOrder['版番号'];
  var o = currentOrder;
  var html = '<div class="confirm-box">'
    + '<div style="font-size:13px;font-weight:600;color:var(--brown);margin-bottom:6px;">予約情報</div>'
    + '<div class="confirm-row"><span class="confirm-label">受付番号</span><span class="confirm-value">'
    + escapeHtml(o['伝票番号']) + '</span></div>'
    + '<div class="confirm-row"><span class="confirm-label">予約日</span><span class="confirm-value">'
    + escapeHtml(o['予約希望日'] || '') + ' ' + escapeHtml(o['予約の希望日時'] || '') + '</span></div>'
    + '<div class="confirm-row"><span class="confirm-label">交換</span><span class="confirm-value">'
    + escapeHtml(o['交換方向'] || '') + '</span></div>'
    + '</div><div class="confirm-box">'
    + '<div style="font-size:13px;font-weight:600;color:var(--brown);margin-bottom:6px;">お客様</div>'
    + '<div class="confirm-row"><span class="confirm-label">氏名</span><span class="confirm-value">'
    + escapeHtml(o['予約者の氏名'] || '（未入力）') + '</span></div>'
    + '<div class="confirm-row"><span class="confirm-label">電話</span><span class="confirm-value">'
    + escapeHtml(o['予約者の電話'] || '') + '</span></div>'
    + '<div class="confirm-row"><span class="confirm-label">メモ</span><span class="confirm-value">'
    + escapeHtml(o['受付メモ'] || '-') + '</span></div></div>';
  document.getElementById('detailContent').innerHTML = html;
  var btns = document.querySelectorAll('#confirmStatusGroup .toggle-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle('checked',
      btns[i].dataset.value === (o['予約の確認状況'] || '未確認'));
  }
  document.getElementById('contactMemo').value = o['予約の連絡メモ'] || '';
  showScr('scrDetail');
}

async function updateStatus() {
  if (!currentOrder) return;
  startLoading(document.getElementById('statusBtn'));
  var result = await callAPI('reservation_updateStatus', {
    orderNumber: currentOrder['伝票番号'],
    version: currentVersion,
    confirmStatus: getToggleValue('confirmStatusGroup'),
    contactMemo: document.getElementById('contactMemo').value.trim()
  });
  stopLoading(document.getElementById('statusBtn'));
  if (handleAPIError(result)) return;
  currentVersion = result.data.newVersion;
  showSuccess('確認状況を更新しました');
}

async function cancelReservation() {
  if (!currentOrder) return;
  if (!confirmAction('この予約をキャンセルしますか？')) return;
  startLoading(document.getElementById('cancelBtn'));
  var result = await callAPI('reservation_cancel', {
    orderNumber: currentOrder['伝票番号'],
    version: currentVersion,
    idempotencyKey: generateIdempotencyKey(),
    reason: 'キャンセル'
  });
  stopLoading(document.getElementById('cancelBtn'));
  if (handleAPIError(result)) return;
  showSuccess('予約をキャンセルしました');
  loadList();
  showScr('scrList');
}

function goToReception() {
  if (!currentOrder) return;
  var name = currentOrder['予約者の氏名'] || '';
  var phone = currentOrder['予約者の電話'] || '';
  var orderNumber = currentOrder['伝票番号'] || '';
  if (name) sessionStorage.setItem('reservation_name', name);
  if (phone) sessionStorage.setItem('reservation_phone', phone);
  if (orderNumber) sessionStorage.setItem('reservation_orderNumber', orderNumber);
  location.href = 'd_reception_customer?fromReservation=1';
}

if (getParam('tab') === 'list') {
  loadList();
  showScr('scrList');
}
</script>
</body>
</html>
