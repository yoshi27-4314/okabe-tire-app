<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>B. 顧客管理 - タイヤホテルOKABE DX</title>
<link rel="stylesheet" href="style.css">
<script src="api.js"></script>
<script src="common.js"></script>
<style>
.tab-bar { display: flex; gap: 4px; margin-bottom: 16px; }
.tab-item { flex: 1; padding: 10px; font-size: 13px; font-weight: 600; text-align: center; border: 1.5px solid var(--border); border-radius: 8px; background: var(--white); color: var(--text3); cursor: pointer; }
.tab-item.active { border-color: var(--orange); background: #FFF3EB; color: var(--orange); }
.wo-card { background: var(--white); border: 1px solid var(--border-light); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; box-shadow: var(--shadow-sm); }
.wo-card:active { transform: scale(0.98); }
.wo-card-customer { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.wo-card-detail { font-size: 14px; color: var(--text2); line-height: 1.5; }
</style>
</head>
<body>

<!-- B-1 顧客検索 -->
<div id="scrSearch" class="screen active">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="goBack()">&lt; 戻る</button>
    <div class="header-title">B. 顧客管理</div>
  </div>
  <div class="content">
    <div class="search-box">
      <input class="search-input" type="text" id="searchQuery" placeholder="何でも検索" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="search-btn" id="searchBtn" onclick="doSearch()">検索</button>
    </div>
    <div style="font-size:12px;color:var(--text3);margin-top:-12px;margin-bottom:12px;padding-left:4px;">顧客名 / 電話 / 携帯 / ナンバー / 車種 / 顧客コード / メール / 郵便番号</div>
    <div id="searchResults"></div>
  </div>
  <div class="page-id">B-1 顧客検索</div>
</div>

<!-- B-2 顧客詳細 -->
<div id="scrProfile" class="screen">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="showScr('scrSearch')">&lt; 戻る</button>
    <div class="header-title">顧客詳細</div>
  </div>
  <div class="content">
    <div class="tab-bar">
      <div class="tab-item active" onclick="showTab('tabInfo',this)">基本情報</div>
      <div class="tab-item" onclick="showTab('tabVehicle',this)">車両</div>
      <div class="tab-item" onclick="showTab('tabMemo',this)">メモ</div>
    </div>
    <div id="tabInfo">
      <div class="confirm-box" id="customerInfo"></div>
      <button class="btn-primary" onclick="showEditScreen()">顧客情報を編集する</button>
    </div>
    <div id="tabVehicle" style="display:none;">
      <div class="section-label">登録車両</div>
      <div id="vehicleList"></div>
    </div>
    <div id="tabMemo" style="display:none;">
      <div class="section-label">社内メモ</div>
      <div class="form-section">
        <textarea class="form-input" rows="5" id="memoField" style="resize:vertical;font-size:15px;"></textarea>
      </div>
      <button class="btn-primary" id="memoSaveBtn" onclick="saveMemo()">メモを保存</button>
    </div>
  </div>
  <div class="page-id">B-2 顧客詳細</div>
</div>

<!-- B-3 顧客情報編集 -->
<div id="scrEdit" class="screen">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="showScr('scrProfile')">&lt; 戻る</button>
    <div class="header-title">顧客情報の編集</div>
  </div>
  <div class="content">
    <div class="form-section">
      <div class="form-section-title">お客様情報</div>
      <div class="form-row"><label class="form-label">お客さんの区分</label>
        <div class="toggle-group" id="categoryGroup">
          <span class="toggle-btn" data-value="個人" onclick="toggleCheck(this)">個人</span>
          <span class="toggle-btn" data-value="法人・団体" onclick="toggleCheck(this)">法人</span>
        </div>
      </div>
      <div class="form-row"><label class="form-label">氏名 <span class="form-required">*</span></label><input class="form-input" type="text" id="editName"></div>
      <div class="form-row"><label class="form-label">フリガナ</label><input class="form-input" type="text" id="editFurigana"></div>
      <div class="form-row"><label class="form-label">電話番号</label><input class="form-input" type="tel" id="editPhone"></div>
      <div class="form-row"><label class="form-label">携帯番号</label><input class="form-input" type="tel" id="editMobile"></div>
    </div>
    <div class="form-section">
      <div class="form-section-title">ご住所</div>
      <div class="form-row"><label class="form-label">郵便番号</label><input class="form-input" type="text" id="editZip"></div>
      <div class="form-row"><label class="form-label">住所</label><input class="form-input" type="text" id="editAddress"></div>
      <div class="form-row"><label class="form-label">住所フリガナ</label><input class="form-input" type="text" id="editAddressFuri"></div>
      <div class="form-row"><label class="form-label">Eメール</label><input class="form-input" type="email" id="editEmail"></div>
    </div>
    <div class="form-section">
      <div class="form-section-title">その他</div>
      <div class="form-row"><label class="form-label">顧客コード</label><input class="form-input" type="text" id="editCode"></div>
      <div class="form-row"><label class="form-label">営業担当</label><input class="form-input" type="text" id="editSalesRep"></div>
    </div>
    <div class="form-section">
      <div class="form-section-title">社内メモ</div>
      <textarea class="form-input" rows="4" id="editMemo" placeholder="社内での共有事項、注意点など" style="resize:vertical;font-size:15px;"></textarea>
    </div>
    <div class="hint-bar">変更した事実（誰が・いつ・どの項目）は記録されます。</div>
    <button class="btn-primary" id="saveBtn" onclick="saveCustomer()">変更を保存</button>
    <button class="btn-secondary" onclick="showScr('scrProfile')">キャンセル</button>
  </div>
  <div class="page-id">B-3 顧客情報編集</div>
</div>

<script>
if (!requireLogin()) {}
var currentCustomer = null;
var currentVersion = null;

function showScr(id) {
  var s = document.querySelectorAll('.screen');
  for (var i = 0; i < s.length; i++) s[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
function showTab(tabId, el) {
  ['tabInfo','tabVehicle','tabMemo'].forEach(function(t) { document.getElementById(t).style.display = 'none'; });
  document.getElementById(tabId).style.display = '';
  var items = document.querySelectorAll('.tab-item');
  for (var i = 0; i < items.length; i++) items[i].classList.remove('active');
  el.classList.add('active');
}

async function doSearch() {
  var query = document.getElementById('searchQuery').value.trim();
  if (!query) { showError('検索語を入力してください'); return; }
  startLoading(document.getElementById('searchBtn'));
  var result = await callAPI('customer_search', { query: query });
  stopLoading(document.getElementById('searchBtn'));
  if (handleAPIError(result)) return;
  var customers = result.data.customers || [];
  var html = '<div class="section-label">検索結果（' + customers.length + '件）</div>';
  if (customers.length === 0) html += '<div style="text-align:center;color:var(--text3);padding:20px;">該当なし</div>';
  for (var i = 0; i < customers.length; i++) {
    var c = customers[i];
    html += '<div class="wo-card" onclick="loadDetail(\'' + escapeHtml(c['顧客ID']) + '\')">'
      + '<div class="wo-card-customer">' + escapeHtml(c['氏名']) + '</div>'
      + '<div class="wo-card-detail">' + escapeHtml(c['電話'] || '') + (c['携帯'] ? ' / ' + escapeHtml(c['携帯']) : '') + '</div>'
      + '<div class="wo-card-detail">' + escapeHtml(c['顧客コード'] || '') + ' / ' + escapeHtml(c['区分'] || '') + '</div></div>';
  }
  document.getElementById('searchResults').innerHTML = html;
}

async function loadDetail(customerId) {
  var result = await callAPI('customer_detail', { customerId: customerId });
  if (handleAPIError(result)) return;
  currentCustomer = result.data.customer;
  currentVersion = currentCustomer['版番号'];
  var c = currentCustomer;
  var fields = [
    ['氏名', c['氏名']], ['フリガナ', c['フリガナ']], ['電話', c['電話']],
    ['携帯', c['携帯']], ['住所', (c['郵便番号'] ? '〒' + c['郵便番号'] + ' ' : '') + (c['住所'] || '')],
    ['メール', c['Eメール']], ['顧客コード', c['顧客コード']],
    ['営業担当', c['営業担当']], ['区分', c['区分']], ['登録日', formatDate(c['登録日時'])]
  ];
  var html = '<div style="font-size:13px;font-weight:600;color:var(--brown);margin-bottom:6px;">お客様情報</div>';
  for (var i = 0; i < fields.length; i++) {
    if (fields[i][1]) html += '<div class="confirm-row"><span class="confirm-label">' + fields[i][0] + '</span><span class="confirm-value">' + escapeHtml(fields[i][1]) + '</span></div>';
  }
  document.getElementById('customerInfo').innerHTML = html;
  var vehicles = result.data.vehicles || [];
  var vhtml = '';
  if (vehicles.length === 0) vhtml = '<div style="color:var(--text3);padding:20px;text-align:center;">登録車両なし</div>';
  for (var v = 0; v < vehicles.length; v++) {
    var vh = vehicles[v];
    var plate = [vh['地名'], vh['分類番号'], vh['かな'], vh['下4桁']].filter(Boolean).join(' ');
    vhtml += '<div class="wo-card" onclick="navigateTo(\'c_vehicle.html\',{vehicleId:\'' + vh['車両ID'] + '\'})">'
      + '<div style="font-size:16px;font-weight:700;">' + escapeHtml(plate || '（ナンバー未登録）') + '</div>'
      + '<div class="wo-card-detail">' + escapeHtml(vh['車種名'] || '') + ' / ' + escapeHtml(vh['輪数'] || '') + '</div></div>';
  }
  document.getElementById('vehicleList').innerHTML = vhtml;
  document.getElementById('memoField').value = c['社内メモ'] || '';
  showScr('scrProfile');
}

async function saveMemo() {
  if (!currentCustomer) return;
  startLoading(document.getElementById('memoSaveBtn'));
  var result = await callAPI('customer_update', {
    customerId: currentCustomer['顧客ID'], version: currentVersion,
    updates: { '社内メモ': document.getElementById('memoField').value }
  });
  stopLoading(document.getElementById('memoSaveBtn'));
  if (handleAPIError(result)) return;
  currentVersion = result.data.newVersion;
  showSuccess('メモを保存しました');
}

function showEditScreen() {
  if (!currentCustomer) return;
  var c = currentCustomer;
  document.getElementById('editName').value = c['氏名'] || '';
  document.getElementById('editFurigana').value = c['フリガナ'] || '';
  document.getElementById('editPhone').value = c['電話'] || '';
  document.getElementById('editMobile').value = c['携帯'] || '';
  document.getElementById('editZip').value = c['郵便番号'] || '';
  document.getElementById('editAddress').value = c['住所'] || '';
  document.getElementById('editAddressFuri').value = c['住所フリガナ'] || '';
  document.getElementById('editEmail').value = c['Eメール'] || '';
  document.getElementById('editCode').value = c['顧客コード'] || '';
  document.getElementById('editSalesRep').value = c['営業担当'] || '';
  document.getElementById('editMemo').value = c['社内メモ'] || '';
  var btns = document.querySelectorAll('#categoryGroup .toggle-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('checked', btns[i].dataset.value === (c['区分'] || '個人'));
  showScr('scrEdit');
}

async function saveCustomer() {
  if (!currentCustomer) return;
  startLoading(document.getElementById('saveBtn'));
  var result = await callAPI('customer_update', {
    customerId: currentCustomer['顧客ID'], version: currentVersion,
    updates: {
      '氏名': document.getElementById('editName').value,
      'フリガナ': document.getElementById('editFurigana').value,
      '電話': document.getElementById('editPhone').value,
      '携帯': document.getElementById('editMobile').value,
      '郵便番号': document.getElementById('editZip').value,
      '住所': document.getElementById('editAddress').value,
      '住所フリガナ': document.getElementById('editAddressFuri').value,
      'Eメール': document.getElementById('editEmail').value,
      '顧客コード': document.getElementById('editCode').value,
      '営業担当': document.getElementById('editSalesRep').value,
      '区分': getToggleValue('categoryGroup'),
      '社内メモ': document.getElementById('editMemo').value
    }
  });
  stopLoading(document.getElementById('saveBtn'));
  if (handleAPIError(result)) return;
  currentVersion = result.data.newVersion;
  showSuccess('変更を保存しました');
  loadDetail(currentCustomer['顧客ID']);
}

var paramId = getParam('customerId');
if (paramId) loadDetail(paramId);
</script>
</body>
</html>
