<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>T-1 タイヤ情報 - タイヤホテルOKABE DX</title>
<link rel="stylesheet" href="style.css">
<script src="api.js"></script>
<script src="common.js"></script>
<style>
.groove-input { width: 55px; text-align: center; padding: 8px; font-size: 16px; font-weight: 700; -moz-appearance: textfield; }
.groove-input::-webkit-inner-spin-button, .groove-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.pm-btn { width: 36px; height: 36px; font-size: 18px; font-weight: 700; border: 1.5px solid var(--border); border-radius: 8px; background: var(--white); cursor: pointer; color: var(--orange); }
.pm-btn:active { background: #FFF3EB; }
</style>
</head>
<body>

<div class="page">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="history.back()">&lt; 戻る</button>
    <div class="header-title">タイヤ情報</div>
  </div>
  <div class="content">
    <div class="info-bar" id="tireInfo"></div>
    <div class="hint-bar">受付時は全て任意です。分かる範囲で入力してください。</div>

    <div class="form-section">
      <div class="form-section-title">基本情報</div>
      <div class="form-row"><label class="form-label">タイヤ本数</label>
        <div class="toggle-group" id="tireCountGroup" style="flex-wrap:wrap;">
          <span class="toggle-btn" data-value="1" onclick="toggleCheck(this)">1本</span>
          <span class="toggle-btn" data-value="2" onclick="toggleCheck(this)">2本</span>
          <span class="toggle-btn" data-value="3" onclick="toggleCheck(this)">3本</span>
          <span class="toggle-btn checked" data-value="4" onclick="toggleCheck(this)">4本</span>
          <span class="toggle-btn" data-value="5" onclick="toggleCheck(this)">5本</span>
          <span class="toggle-btn" data-value="6" onclick="toggleCheck(this)">6本</span>
        </div>
      </div>
      <div class="form-row"><label class="form-label">タイヤ区分（預かり登録）</label>
        <div class="toggle-group" id="tireTypeGroup">
          <span class="toggle-btn" data-value="夏" onclick="toggleCheck(this)">夏タイヤ</span>
          <span class="toggle-btn" data-value="冬" onclick="toggleCheck(this)">冬タイヤ</span>
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">タイヤ共通情報（一括入力）</div>
      <div class="hint-bar">ここに入力すると全タイヤに反映されます。</div>
      <div class="form-row"><label class="form-label">メーカー</label><input class="form-input" type="text" id="bulkMaker" placeholder="ブリヂストン"></div>
      <div class="form-row"><label class="form-label">銘柄</label><input class="form-input" type="text" id="bulkBrand" placeholder="ブリザック VRX3"></div>
      <div class="form-row"><label class="form-label">サイズ</label><input class="form-input" type="text" id="bulkSize" placeholder="195/65R15"></div>
      <div class="form-row"><label class="form-label">製造年月</label><input class="form-input" type="text" id="bulkMfgDate" placeholder="2024.20"></div>
      <div class="form-row"><label class="form-label">ホイール種別</label>
        <div class="toggle-group" id="bulkWheelType">
          <span class="toggle-btn" data-value="純正" onclick="toggleCheck(this)">純正</span>
          <span class="toggle-btn" data-value="社外" onclick="toggleCheck(this)">社外</span>
        </div>
      </div>
      <div class="form-row"><label class="form-label">ホイール素材</label>
        <div class="toggle-group" id="bulkWheelMaterial">
          <span class="toggle-btn" data-value="アルミ" onclick="toggleCheck(this)">アルミ</span>
          <span class="toggle-btn" data-value="スチール" onclick="toggleCheck(this)">スチール</span>
        </div>
      </div>
      <div class="form-row"><label class="form-label">キャップ</label>
        <div class="toggle-group" id="bulkCap">
          <span class="toggle-btn" data-value="あり" onclick="toggleCheck(this)">あり</span>
          <span class="toggle-btn" data-value="なし" onclick="toggleCheck(this)">なし</span>
        </div>
      </div>
      <div class="form-row"><label class="form-label">ナット</label>
        <div class="toggle-group" id="bulkNut" style="flex-wrap:wrap;">
          <span class="toggle-btn" data-value="お客様保管" onclick="toggleCheck(this)">お客様保管</span>
          <span class="toggle-btn" data-value="車載" onclick="toggleCheck(this)">車載</span>
          <span class="toggle-btn" data-value="共用" onclick="toggleCheck(this)">共用</span>
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">残溝（個別入力）</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div><label class="form-label" style="text-align:center;">左前</label>
          <div style="display:flex;align-items:center;justify-content:center;gap:3px;">
            <button class="pm-btn" style="width:32px;font-size:13px;" onclick="adj(this,-1)">-1</button>
            <button class="pm-btn" style="width:28px;font-size:12px;" onclick="adj(this,-0.1)">-.1</button>
            <input class="form-input groove-input" type="number" id="g1" value="5.0" step="0.1" min="0" max="20">
            <button class="pm-btn" style="width:28px;font-size:12px;" onclick="adj(this,0.1)">+.1</button>
            <button class="pm-btn" style="width:32px;font-size:13px;" onclick="adj(this,1)">+1</button>
          </div>
        </div>
        <div><label class="form-label" style="text-align:center;">右前</label>
          <div style="display:flex;align-items:center;justify-content:center;gap:3px;">
            <button class="pm-btn" style="width:32px;font-size:13px;" onclick="adj(this,-1)">-1</button>
            <button class="pm-btn" style="width:28px;font-size:12px;" onclick="adj(this,-0.1)">-.1</button>
            <input class="form-input groove-input" type="number" id="g2" value="5.0" step="0.1" min="0" max="20">
            <button class="pm-btn" style="width:28px;font-size:12px;" onclick="adj(this,0.1)">+.1</button>
            <button class="pm-btn" style="width:32px;font-size:13px;" onclick="adj(this,1)">+1</button>
          </div>
        </div>
        <div><label class="form-label" style="text-align:center;">左後</label>
          <div style="display:flex;align-items:center;justify-content:center;gap:3px;">
            <button class="pm-btn" style="width:32px;font-size:13px;" onclick="adj(this,-1)">-1</button>
            <button class="pm-btn" style="width:28px;font-size:12px;" onclick="adj(this,-0.1)">-.1</button>
            <input class="form-input groove-input" type="number" id="g3" value="5.0" step="0.1" min="0" max="20">
            <button class="pm-btn" style="width:28px;font-size:12px;" onclick="adj(this,0.1)">+.1</button>
            <button class="pm-btn" style="width:32px;font-size:13px;" onclick="adj(this,1)">+1</button>
          </div>
        </div>
        <div><label class="form-label" style="text-align:center;">右後</label>
          <div style="display:flex;align-items:center;justify-content:center;gap:3px;">
            <button class="pm-btn" style="width:32px;font-size:13px;" onclick="adj(this,-1)">-1</button>
            <button class="pm-btn" style="width:28px;font-size:12px;" onclick="adj(this,-0.1)">-.1</button>
            <input class="form-input groove-input" type="number" id="g4" value="5.0" step="0.1" min="0" max="20">
            <button class="pm-btn" style="width:28px;font-size:12px;" onclick="adj(this,0.1)">+.1</button>
            <button class="pm-btn" style="width:32px;font-size:13px;" onclick="adj(this,1)">+1</button>
          </div>
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">タイヤ写真</div>
      <div id="photoSection"></div>
      <div id="photoPreview" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;"></div>
    </div>

    <div class="form-section">
      <div class="form-section-title">全体メモ</div>
      <textarea class="form-input" rows="3" id="tireMemo" placeholder="5・6本目の情報、状態の特記事項など" style="resize:vertical;"></textarea>
    </div>

    <div class="btn-row" style="flex-direction:column;gap:10px;">
      <button class="btn-primary" style="flex:none;" onclick="saveTireAndProceed()">保存して受付内容へ</button>
      <button class="btn-secondary" style="flex:none;" onclick="history.back()">戻る</button>
    </div>
  </div>
  <div class="page-id">T-1 タイヤ情報</div>
</div>

<script>
if (!requireLogin()) {}

var photoFolderId = sessionStorage.getItem('reception_photoFolderId') || '';
var uploadedFileIds = [];

function adj(btn, delta) {
  var input = btn.parentNode.querySelector('input');
  var val = parseFloat(input.value) || 0;
  val = Math.round((val + delta) * 10) / 10;
  if (val < 0) val = 0;
  if (val > 20) val = 20;
  input.value = val.toFixed(1);
}

function initTireInfo() {
  var cName = sessionStorage.getItem('reception_customerName') || '';
  document.getElementById('tireInfo').innerHTML =
    '<span class="info-bar-label">顧客: </span><strong>' + escapeHtml(cName) + '</strong>';
  initPhotoSection();
}

function initPhotoSection() {
  var section = document.getElementById('photoSection');
  if (photoFolderId) {
    section.innerHTML = '<button class="btn-secondary" style="margin:0;font-size:13px;padding:10px;" onclick="document.getElementById(\'tirePhoto\').click()">写真を選択してアップロード</button>'
      + '<input type="file" id="tirePhoto" accept="image/*" style="display:none;" onchange="uploadPhoto(this)">';
  } else {
    section.innerHTML = '<div style="font-size:13px;color:var(--text3);padding:8px 0;">写真は受付完了後に追加できます</div>';
  }
}

function saveTireAndProceed() {
  var positions = ['左前', '右前', '左後', '右後'];
  var records = [];
  for (var i = 0; i < 4; i++) {
    records.push({
      position: positions[i],
      maker: document.getElementById('bulkMaker').value.trim(),
      brand: document.getElementById('bulkBrand').value.trim(),
      size: document.getElementById('bulkSize').value.trim(),
      mfgDate: document.getElementById('bulkMfgDate').value.trim(),
      treadDepth: document.getElementById('g' + (i + 1)).value,
      wheelType: getToggleValue('bulkWheelType'),
      wheelMaterial: getToggleValue('bulkWheelMaterial'),
      cap: getToggleValue('bulkCap'),
      nut: getToggleValue('bulkNut')
    });
  }
  sessionStorage.setItem('reception_tireRecords', JSON.stringify(records));
  sessionStorage.setItem('reception_tireType', getToggleValue('tireTypeGroup'));
  sessionStorage.setItem('reception_tireCount', getToggleValue('tireCountGroup'));
  sessionStorage.setItem('reception_tireMemo', document.getElementById('tireMemo').value);
  if (uploadedFileIds.length > 0) {
    sessionStorage.setItem('reception_photoFileIds', JSON.stringify(uploadedFileIds));
  }
  var cid = getParam('customerId') || sessionStorage.getItem('reception_customerId') || '';
  var vid = getParam('vehicleId') || sessionStorage.getItem('reception_vehicleId') || '';
  location.href = 'd_reception_form.html?customerId=' + encodeURIComponent(cid)
    + '&vehicleId=' + encodeURIComponent(vid);
}

async function uploadPhoto(input) {
  if (!input.files || !input.files[0]) return;
  if (!photoFolderId) {
    showError('写真フォルダが作成されていません');
    return;
  }
  var file = input.files[0];
  var reader = new FileReader();
  reader.onload = async function(e) {
    showSuccess('アップロード中...');
    var result = await callAPI('photo_upload', {
      imageData: e.target.result,
      folderId: photoFolderId,
      position: ''
    });
    if (handleAPIError(result)) return;
    if (result.data && result.data.fileId) {
      uploadedFileIds.push(result.data.fileId);
    }
    var preview = document.getElementById('photoPreview');
    preview.innerHTML += '<div style="position:relative;width:80px;height:80px;">'
      + '<img src="' + e.target.result + '" style="width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--border);">'
      + '<div style="position:absolute;bottom:2px;right:2px;font-size:9px;color:var(--green);">&#x2705;</div></div>';
    showSuccess('写真を保存しました');
  };
  reader.readAsDataURL(file);
  input.value = '';
}

initTireInfo();
</script>
</body>
</html>
