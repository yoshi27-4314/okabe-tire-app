<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>データ出力 - タイヤホテルOKABE DX</title>
<link rel="stylesheet" href="style.css">
<script src="api.js"></script>
<script src="common.js"></script>
</head>
<body>
<div class="page">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="goBack()">&lt; 戻る</button>
    <div class="header-title">データ出力</div>
  </div>
  <div class="content">
    <div class="hint-bar">アプリのデータをCSVファイルでダウンロードできます。Googleスプレッドシートやエクセルで開けます。</div>
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:16px;">
      <button class="btn-primary" onclick="exportTable('customer','顧客一覧')">顧客一覧をダウンロード</button>
      <button class="btn-primary" onclick="exportTable('vehicle','車両一覧')">車両一覧をダウンロード</button>
      <button class="btn-primary" style="background:var(--green);" onclick="exportTireList()">預かりタイヤ一覧をダウンロード</button>
      <button class="btn-primary" style="background:var(--blue);" onclick="exportTable('work_order','受付伝票一覧')">受付伝票一覧をダウンロード</button>
      <button class="btn-primary" style="background:var(--brown);" onclick="exportTable('contract','契約一覧')">契約一覧をダウンロード</button>
    </div>
    <div id="exportStatus" style="margin-top:16px;text-align:center;color:var(--text3);"></div>
  </div>
  <div class="page-id">データ出力</div>
</div>

<script>
if (!requireLogin()) {}

async function exportTable(table, label) {
  document.getElementById('exportStatus').textContent = label + 'を取得中...';
  var result = await callAPI('admin_exportCsv', { table: table });
  if (handleAPIError(result)) { document.getElementById('exportStatus').textContent = ''; return; }
  var csv = result.data.csv || '';
  if (!csv) { showError('データがありません'); document.getElementById('exportStatus').textContent = ''; return; }
  downloadCsv(csv, table + '.csv');
  document.getElementById('exportStatus').textContent = '';
  showSuccess(label + 'をダウンロードしました');
}

async function exportTireList() {
  document.getElementById('exportStatus').textContent = '預かりタイヤ一覧を取得中...';
  var result = await callAPI('admin_exportTireCsv', {});
  if (handleAPIError(result)) { document.getElementById('exportStatus').textContent = ''; return; }
  var csv = result.data.csv || '';
  if (!csv) { showError('データがありません'); document.getElementById('exportStatus').textContent = ''; return; }
  downloadCsv(csv, 'tire_list.csv');
  document.getElementById('exportStatus').textContent = '';
  showSuccess('預かりタイヤ一覧をダウンロードしました');
}

function downloadCsv(csv, filename) {
  var bom = '\uFEFF';
  var blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
