<!DOCTYPE html>
<html lang="ja" style="color-scheme:only light;">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CSV出力 - タイヤホテルOKABE DX</title>
<link rel="stylesheet" href="style.css">
<script src="api.js"></script>
<script src="common.js"></script>
</head>
<body>
<div class="header">
  <button class="home-btn" onclick="goHome()">ホーム</button>
  <div class="header-title">CSV出力</div><button class="reload-btn" onclick="forceReload()">↻</button>
</div>
<div class="content">
  <div class="section-label">データをCSVでダウンロード</div>
  <div class="card clickable" onclick="downloadCsv('customer')"><div style="font-size:15px;font-weight:700;">顧客一覧</div><div style="font-size:12px;color:var(--text3);">氏名・電話・住所・顧客コード</div></div>
  <div class="card clickable" onclick="downloadCsv('vehicle')"><div style="font-size:15px;font-weight:700;">車両一覧</div><div style="font-size:12px;color:var(--text3);">ナンバー・車種・メーカー</div></div>
  <div class="card clickable" onclick="downloadCsv('tire_list')"><div style="font-size:15px;font-weight:700;">タイヤ一覧（預かり中）</div><div style="font-size:12px;color:var(--text3);">顧客名・ナンバー・サイズ・棚番号</div></div>
  <div class="card clickable" onclick="downloadCsv('work_order')"><div style="font-size:15px;font-weight:700;">作業伝票一覧</div><div style="font-size:12px;color:var(--text3);">伝票番号・状態・作業予定日</div></div>
  <div class="card clickable" onclick="downloadCsv('contract')"><div style="font-size:15px;font-weight:700;">契約一覧</div><div style="font-size:12px;color:var(--text3);">契約番号・状態・料金</div></div>
</div>
<script>
if (!requireLogin()) {}
async function downloadCsv(table) {
  showSuccess('ダウンロード準備中...');
  var action = table === 'tire_list' ? 'admin_exportTireCsv' : 'admin_exportCsv';
  var r = await callAPI(action, { table: table });
  if (handleAPIError(r)) return;
  var bom = '\uFEFF';
  var blob = new Blob([bom + r.data.csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = table + '_' + new Date(Date.now() + 9*60*60*1000).toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  showSuccess('ダウンロードしました');
}
</script>
</body>
</html>
