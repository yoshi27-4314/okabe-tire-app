<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>L. 旧台帳 - タイヤホテルOKABE DX</title>
<link rel="stylesheet" href="style.css">
<script src="api.js"></script>
<script src="common.js"></script>
<style>
.wo-card { background: var(--white); border: 1px solid var(--border-light); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; box-shadow: var(--shadow-sm); }
.wo-card:active { transform: scale(0.98); }
.wo-card-detail { font-size: 14px; color: var(--text2); line-height: 1.5; }
.filter-bar { display: flex; gap: 6px; margin-bottom: 12px; }
.filter-btn { padding: 6px 12px; font-size: 12px; font-weight: 600; border: 1.5px solid var(--border); border-radius: 6px; color: var(--text3); cursor: pointer; background: var(--white); }
.filter-btn.active { border-color: var(--orange); background: #FFF3EB; color: var(--orange); }
</style>
</head>
<body>

<!-- L-1 旧台帳一覧 -->
<div id="scrList" class="screen active">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="goBack()">&lt; 戻る</button>
    <div class="header-title">L. 旧台帳</div>
  </div>
  <div class="content">
    <div class="filter-bar">
      <span class="filter-btn active" onclick="selectFilter(this,'')">全て</span>
      <span class="filter-btn" onclick="selectFilter(this,'未照合')">未照合</span>
      <span class="filter-btn" onclick="selectFilter(this,'昇格済み')">昇格済み</span>
      <span class="filter-btn" onclick="selectFilter(this,'照合不要')">照合不要</span>
    </div>
    <div id="legacyList"></div>
  </div>
  <div class="page-id">L-1 旧台帳一覧</div>
</div>

<!-- L-2 旧台帳詳細 -->
<div id="scrDetail" class="screen">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="showScr('scrList')">&lt; 戻る</button>
    <div class="header-title">旧台帳詳細</div>
  </div>
  <div class="content">
    <div id="detailContent"></div>
    <div id="detailActions"></div>
  </div>
  <div class="page-id">L-2 旧台帳詳細</div>
</div>

<script>
if (!requireLogin()) {}
var currentItem = null;
var currentVersion = null;

function showScr(id) {
  var s = document.querySelectorAll('.screen');
  for (var i = 0; i < s.length; i++) s[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function selectFilter(el, status) {
  var btns = document.querySelectorAll('.filter-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  el.classList.add('active');
  loadList(status);
}

async function loadList(statusFilter) {
  var params = {};
  if (statusFilter) params.statusFilter = statusFilter;
  var result = await callAPI('legacy_list', params);
  if (handleAPIError(result)) return;
  var items = result.data.items || [];
  if (items.length === 0) {
    document.getElementById('legacyList').innerHTML =
      '<div style="text-align:center;color:var(--text3);padding:20px;">データがありません</div>';
    return;
  }
  var html = '<div class="section-label">旧台帳（' + items.length + '件）</div>';
  for (var i = 0; i < items.length; i++) {
    var r = items[i];
    html += '<div class="wo-card" onclick="loadDetail(\'' + escapeHtml(r['旧No']) + '\')">'
      + '<div style="display:flex;justify-content:space-between;margin-bottom:4px;">'
      + '<span style="font-size:13px;font-weight:700;">旧No.' + escapeHtml(r['旧No']) + '</span>'
      + '<span class="status ' + getStatusClass(r['確認の状態'] || '') + '">'
      + escapeHtml(r['確認の状態'] || '') + '</span></div>'
      + '<div class="wo-card-detail">' + escapeHtml(r['氏名(旧)'] || '')
      + ' / ' + escapeHtml(r['車名(旧)'] || '') + '</div>'
      + '<div class="wo-card-detail">' + escapeHtml(r['登録番号(旧)'] || '')
      + ' / ' + escapeHtml(r['タイヤサイズ(旧)'] || '') + '</div></div>';
  }
  document.getElementById('legacyList').innerHTML = html;
}

async function loadDetail(legacyNo) {
  var result = await callAPI('legacy_detail', { legacyNo: legacyNo });
  if (handleAPIError(result)) return;
  currentItem = result.data.item;
  currentVersion = currentItem['版番号'];
  var r = currentItem;
  var fields = [
    ['旧No', r['旧No']], ['氏名', r['氏名(旧)']],
    ['車名', r['車名(旧)']], ['登録番号', r['登録番号(旧)']],
    ['タイヤサイズ', r['タイヤサイズ(旧)']], ['ゾーン', r['ゾーン(旧)']],
    ['新規/継続', r['新規／継続(旧)']], ['割引', r['割引(旧)']],
    ['備考', r['備考(旧)']], ['確認の状態', r['確認の状態']],
    ['AI判定', r['AI判定の結果']]
  ];
  var html = '<div class="confirm-box">'
    + '<div style="font-size:13px;font-weight:600;color:var(--brown);margin-bottom:6px;">旧データ</div>';
  for (var i = 0; i < fields.length; i++) {
    if (fields[i][1]) html += '<div class="confirm-row"><span class="confirm-label">'
      + fields[i][0] + '</span><span class="confirm-value">'
      + escapeHtml(fields[i][1]) + '</span></div>';
  }
  html += '</div>';
  document.getElementById('detailContent').innerHTML = html;

  var actions = '';
  if (r['確認の状態'] === '未照合') {
    actions = '<div class="form-section">'
      + '<div class="form-section-title">区分</div>'
      + '<div class="toggle-group" id="promoteCategory" style="margin-bottom:12px;">'
      + '<span class="toggle-btn checked" data-value="個人" onclick="toggleCheck(this)">個人</span>'
      + '<span class="toggle-btn" data-value="法人・団体" onclick="toggleCheck(this)">法人</span></div>'
      + '<div class="form-row"><label class="form-label">メモ</label>'
      + '<textarea class="form-input" rows="2" id="promoteMemo" style="resize:vertical;"></textarea></div></div>'
      + '<button class="btn-primary" id="promoteBtn" onclick="doPromote()">昇格する（顧客・車両・セットを作成）</button>'
      + '<button class="btn-secondary" id="notNeededBtn" onclick="doMarkNotNeeded()">照合不要にする</button>';
  }
  if (r['確認の状態'] === '昇格済み') {
    actions = '<div class="confirm-box">'
      + '<div style="font-size:13px;font-weight:600;color:var(--green);margin-bottom:6px;">昇格済み</div>'
      + '<div class="confirm-row"><span class="confirm-label">顧客ID</span>'
      + '<span class="confirm-value">' + escapeHtml(r['昇格した顧客ID'] || '') + '</span></div>'
      + '<div class="confirm-row"><span class="confirm-label">車両ID</span>'
      + '<span class="confirm-value">' + escapeHtml(r['昇格した車両ID'] || '') + '</span></div>'
      + '<div class="confirm-row"><span class="confirm-label">セットID</span>'
      + '<span class="confirm-value">' + escapeHtml(r['タイヤセットID'] || '') + '</span></div></div>';
  }
  document.getElementById('detailActions').innerHTML = actions;
  showScr('scrDetail');
}

async function doPromote() {
  if (!currentItem) return;
  startLoading(document.getElementById('promoteBtn'));
  var result = await callAPI('legacy_promote', {
    legacyNo: currentItem['旧No'], version: currentVersion,
    idempotencyKey: generateIdempotencyKey(),
    category: getToggleValue('promoteCategory'),
    memo: document.getElementById('promoteMemo').value.trim()
  });
  stopLoading(document.getElementById('promoteBtn'));
  if (handleAPIError(result)) return;
  showSuccess('昇格しました');
  loadDetail(currentItem['旧No']);
}

async function doMarkNotNeeded() {
  if (!currentItem) return;
  if (!confirmAction('照合不要にしますか？')) return;
  startLoading(document.getElementById('notNeededBtn'));
  var result = await callAPI('legacy_markNotNeeded', {
    legacyNo: currentItem['旧No'], version: currentVersion, memo: ''
  });
  stopLoading(document.getElementById('notNeededBtn'));
  if (handleAPIError(result)) return;
  showSuccess('照合不要にしました');
  loadDetail(currentItem['旧No']);
}

loadList('');
</script>
</body>
</html>
