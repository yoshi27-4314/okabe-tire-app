<!DOCTYPE html>
<html lang="ja" style="color-scheme:only light;">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>契約書 - タイヤホテルOKABE DX</title>
<link rel="stylesheet" href="style.css">
<script src="api.js"></script>
<script src="common.js"></script>
<style>
.preview-card { background: var(--white); border: 1.5px solid var(--border-light); border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
.preview-title { font-size: 14px; font-weight: 700; color: var(--brown); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid var(--orange); display: flex; justify-content: space-between; }
.edit-link { font-size: 12px; color: var(--blue); cursor: pointer; text-decoration: underline; font-weight: 400; }
.edit-link:active { color: var(--orange); }
.preview-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border-light); font-size: 13px; }
.preview-row:last-child { border-bottom: none; }
.preview-label { color: var(--text3); min-width: 80px; }
.preview-value { color: var(--text); font-weight: 600; text-align: right; flex: 1; }
.preview-value.empty { color: var(--red); font-style: italic; font-weight: 400; }
.preview-value.alert { color: var(--red); font-weight: 700; }
.tire-preview { margin-bottom: 8px; padding: 10px; background: var(--cream); border-radius: 8px; }
.tire-preview-title { font-size: 13px; font-weight: 700; color: var(--brown); margin-bottom: 6px; }
.tire-preview-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
.tire-preview-label { color: var(--text3); }
.tire-preview-value { color: var(--text); font-weight: 600; }
.scratch-tag { font-size: 11px; padding: 2px 8px; background: #FFF5F5; color: var(--red); border-radius: 4px; font-weight: 600; display: inline-block; margin-right: 4px; }
.price-card { background: var(--white); border: 2px solid var(--green); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.price-title { font-size: 14px; font-weight: 700; color: var(--green); margin-bottom: 10px; }
.price-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
.price-row.total { border-top: 2px solid var(--green); padding-top: 10px; margin-top: 6px; font-size: 18px; font-weight: 700; }
.list-card { background: var(--white); border: 1.5px solid var(--border-light); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; box-shadow: var(--shadow-sm); }
.list-card:active { transform: scale(0.98); background: #FFF8F0; }
.list-card.issued { opacity: 0.7; }
.list-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.list-customer { font-size: 15px; font-weight: 700; }
.list-plate { font-size: 14px; font-weight: 600; color: var(--brown); margin-bottom: 4px; }
.list-detail { font-size: 13px; color: var(--text2); }
.list-time { font-size: 12px; color: var(--text3); margin-top: 4px; }
.confirm-box { background: var(--white); border: 1px solid var(--border-light); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
.confirm-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border-light); font-size: 13px; }
.confirm-row:last-child { border-bottom: none; }
.confirm-label { color: var(--text3); }
.confirm-value { font-weight: 600; }
.contact-log { font-size: 12px; color: var(--text2); padding: 6px 0; border-bottom: 1px solid var(--border-light); }
.contact-log:last-child { border-bottom: none; }
</style>
</head>
<body>

<!-- 一覧画面 -->
<div id="scrList" class="screen active">
  <div class="header">
    <button class="home-btn" onclick="goHome()">ホーム</button>
    <div class="header-title">契約書</div><button class="reload-btn" onclick="forceReload()">↻</button>
  </div>
  <div class="content">
    <div class="tab-bar">
      <div class="tab-item active" onclick="switchTab('issue',this)">発行待ち</div>
      <div class="tab-item" onclick="switchTab('active',this)">有効な契約</div>
    </div>
    <div id="tabIssue">
      <div id="completedList"><div style="text-align:center;color:var(--text3);padding:20px;">読み込み中...</div></div>
    </div>
    <div id="tabActive" style="display:none;">
      <div id="contractList"><div style="text-align:center;color:var(--text3);padding:20px;">読み込み中...</div></div>
    </div>
  </div>
</div>

<!-- 契約書プレビュー（発行用） -->
<div id="scrPreview" class="screen">
  <div class="header">
    <button class="home-btn" onclick="goHome()">ホーム</button>
    <button class="back-btn" onclick="showScr('scrList')">< 戻る</button>
    <div class="header-title">契約書プレビュー</div><button class="reload-btn" onclick="forceReload()">↻</button>
  </div>
  <div class="content" id="previewContent">
    <div style="text-align:center;color:var(--text3);padding:20px;">読み込み中...</div>
  </div>
</div>

<!-- 契約詳細（管理用） -->
<div id="scrDetail" class="screen">
  <div class="header">
    <button class="home-btn" onclick="goHome()">ホーム</button>
    <button class="back-btn" onclick="showScr('scrList')">< 戻る</button>
    <div class="header-title">契約詳細</div><button class="reload-btn" onclick="forceReload()">↻</button>
  </div>
  <div class="content" id="detailContent"></div>
</div>

<!-- 契約更新 -->
<div id="scrRenew" class="screen">
  <div class="header">
    <button class="home-btn" onclick="goHome()">ホーム</button>
    <button class="back-btn" onclick="showScr('scrDetail')">< 戻る</button>
    <div class="header-title">契約更新</div><button class="reload-btn" onclick="forceReload()">↻</button>
  </div>
  <div class="content">
    <div id="renewInfo"></div>
    <div class="confirm-box">
      <div style="font-size:13px;font-weight:600;color:var(--brown);margin-bottom:8px;">更新内容</div>
      <div class="form-row"><label class="form-label">更新後の返却予定日（任意）</label><input class="form-input" type="date" id="renewReturnDate" style="padding:10px 12px;"></div>
      <div class="form-row"><label class="form-label">更新メモ</label><textarea class="form-input" rows="2" id="renewMemo" placeholder="更新時の備考" style="resize:vertical;"></textarea></div>
    </div>
    <button class="btn-primary" style="background:var(--green);" id="renewBtn" onclick="doRenew()">契約を更新する</button>
    <button class="btn-secondary" onclick="showScr('scrDetail')">キャンセル</button>
  </div>
</div>

<script>
if (!requireLogin()) {}

var selectedOrder = null;
var currentTireType = '';
var currentContract = null;
var currentVersion = null;

function switchTab(tab, el) {
  var tabs = document.querySelectorAll('.tab-item');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  el.classList.add('active');
  document.getElementById('tabIssue').style.display = tab === 'issue' ? '' : 'none';
  document.getElementById('tabActive').style.display = tab === 'active' ? '' : 'none';
  if (tab === 'active') loadContracts();
}

// ========== 発行待ちタブ ==========

async function loadList() {
  var r = await callAPI('contract_completedList', {});
  if (handleAPIError(r)) return;
  var items = r.data.items || [];

  if (items.length === 0) {
    document.getElementById('completedList').innerHTML = '<div style="text-align:center;color:var(--text3);padding:20px;">発行待ちの作業はありません</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (it.status === '契約発行済み') continue;
    html += '<div class="list-card" onclick="loadPreview(\'' + escapeHtml(it.orderNumber) + '\')">';
    html += '<div class="list-top"><span class="list-customer">' + escapeHtml(it.customerName) + '</span>';
    html += '<span class="status st-ready">作業完了</span></div>';
    html += '<div class="list-plate">' + escapeHtml(it.plate) + '</div>';
    html += '<div class="list-detail">' + escapeHtml(it.model) + ' / ' + escapeHtml(it.tireInfo) + '</div>';
    html += '<div class="list-time">完了 : ' + formatDateTime(it.completedAt) + '</div>';
    html += '</div>';
  }

  if (!html) html = '<div style="text-align:center;color:var(--text3);padding:20px;">発行待ちの作業はありません</div>';
  document.getElementById('completedList').innerHTML = html;
}

// 契約書プレビュー
async function loadPreview(orderNumber) {
  selectedOrder = orderNumber;
  document.getElementById('previewContent').innerHTML = '<div style="text-align:center;color:var(--text3);padding:20px;">読み込み中...</div>';
  showScr('scrPreview');

  var r = await callAPI('contract_getPreview', { orderNumber: orderNumber });
  if (handleAPIError(r)) return;

  var d = r.data;
  var c = d.customer || {};
  var v = d.vehicle || {};
  var ts = d.tireSet || {};
  currentTireType = ts['区分'] || '';
  var recs = d.tireRecords || [];
  var plate = [v['地名'], v['分類番号'], v['かな'], v['下4桁']].filter(Boolean).join(' ');

  var html = '';

  html += '<div class="preview-card"><div class="preview-title">顧客情報 <a href="customer.html?customerId=' + encodeURIComponent(c['顧客ID'] || '') + '" class="edit-link">編集</a></div>';
  html += '<div class="preview-row"><span class="preview-label">氏名</span><span class="preview-value">' + escapeHtml(c['氏名'] || '') + '</span></div>';
  html += '<div class="preview-row"><span class="preview-label">電話番号</span><span class="preview-value' + (!c['電話'] ? ' empty' : '') + '">' + escapeHtml(c['電話'] || '未入力') + '</span></div>';
  html += '<div class="preview-row"><span class="preview-label">携帯番号</span><span class="preview-value">' + escapeHtml(c['携帯'] || '') + '</span></div>';
  html += '<div class="preview-row"><span class="preview-label">住所</span><span class="preview-value" style="font-size:12px;">' + escapeHtml(c['住所'] || '') + '</span></div>';
  html += '</div>';

  html += '<div class="preview-card"><div class="preview-title">車両情報 <a href="vehicle.html?vehicleId=' + encodeURIComponent(v['車両ID'] || '') + '" class="edit-link">編集</a></div>';
  html += '<div class="preview-row"><span class="preview-label">ナンバー</span><span class="preview-value">' + escapeHtml(plate) + '</span></div>';
  html += '<div class="preview-row"><span class="preview-label">メーカー</span><span class="preview-value">' + escapeHtml(v['メーカー'] || '') + '</span></div>';
  html += '<div class="preview-row"><span class="preview-label">車種</span><span class="preview-value">' + escapeHtml(v['車種名'] || '') + '</span></div>';
  html += '</div>';

  html += '<div class="preview-card"><div class="preview-title">タイヤ情報（' + (ts['本数'] || '') + '本） <a href="tire_input.html?orderNumber=' + encodeURIComponent(selectedOrder || '') + '&tireSetId=' + encodeURIComponent(ts['タイヤセットID'] || '') + '" class="edit-link">編集</a></div>';
  html += '<div class="preview-row"><span class="preview-label">預かり区分</span><span class="preview-value">' + escapeHtml(ts['区分'] || '') + 'タイヤ預かり</span></div>';
  for (var k = 0; k < recs.length; k++) {
    var rec = recs[k];
    html += '<div class="tire-preview">';
    html += '<div class="tire-preview-title">' + (k+1) + '本目 : ' + escapeHtml(rec['ポジション'] || '') + '</div>';
    html += '<div class="tire-preview-row"><span class="tire-preview-label">メーカー / パターン</span><span class="tire-preview-value">' + escapeHtml(rec['メーカー'] || '') + ' / ' + escapeHtml(rec['パターン'] || '') + '</span></div>';
    html += '<div class="tire-preview-row"><span class="tire-preview-label">サイズ</span><span class="tire-preview-value">' + escapeHtml(rec['サイズ'] || '') + '</span></div>';
    var groove = parseFloat(rec['残溝']) || 0;
    var grooveClass = groove > 0 && groove < 3 ? ' alert' : '';
    html += '<div class="tire-preview-row"><span class="tire-preview-label">残溝</span><span class="tire-preview-value' + grooveClass + '">' + escapeHtml(rec['残溝'] || '') + ' mm' + (groove > 0 && groove < 3 ? ' ⚠要交換' : '') + '</span></div>';
    var scratches = [];
    if (rec['傷_サイドウォール'] === 'はい') scratches.push('サイドウォール');
    if (rec['傷_トレッド面'] === 'はい') scratches.push('トレッド面');
    if (rec['傷_リム'] === 'はい') scratches.push('リム');
    if (scratches.length > 0) {
      html += '<div class="tire-preview-row"><span class="tire-preview-label">傷</span></div>';
      for (var s = 0; s < scratches.length; s++) html += '<span class="scratch-tag">' + scratches[s] + '</span>';
      if (rec['傷写真フォルダID']) {
        html += '<div id="photos_' + k + '" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;"><div style="font-size:11px;color:var(--text3);">写真を読み込み中...</div></div>';
        loadScratchPhotos(k, rec['傷写真フォルダID']);
      }
    } else if (rec['傷なし'] === 'はい') {
      html += '<div class="tire-preview-row"><span class="tire-preview-label">傷</span><span class="tire-preview-value" style="color:var(--green);">傷なし</span></div>';
    }
    html += '</div>';
  }
  html += '</div>';

  html += '<div class="preview-card"><div class="preview-title">保管について</div>';
  html += '<div style="font-size:13px;color:var(--text2);line-height:1.6;">お預かりしたタイヤは、株式会社OKABE GROUPが管理する倉庫にて安全に保管いたします。</div></div>';

  html += '<div class="price-card"><div class="price-title">料金</div>';
  html += '<div class="form-row"><label class="form-label">料金プラン</label><select class="form-input" id="pricePlanSelect" style="padding:10px;" onchange="calcPrice()">';
  html += '<option value="">選択してください</option>';
  for (var p = 0; p < d.pricePlans.length; p++) {
    var pp = d.pricePlans[p];
    html += '<option value="' + escapeHtml(pp['プランID']) + '" data-fee="' + escapeHtml(pp['保管料']) + '">' + escapeHtml(pp['プラン名']) + '（' + escapeHtml(pp['保管料']) + '円）</option>';
  }
  html += '</select></div>';
  html += '<div class="form-row"><label class="form-label">割引</label><select class="form-input" id="discountSelect" style="padding:10px;" onchange="calcPrice()">';
  html += '<option value="" data-rate="0">なし</option>';
  for (var q = 0; q < d.discountRules.length; q++) {
    var dr = d.discountRules[q];
    html += '<option value="' + escapeHtml(dr['割引ルールID']) + '" data-rate="' + escapeHtml(dr['割引率']) + '">' + escapeHtml(dr['割引名']) + '（' + escapeHtml(dr['割引率']) + '%OFF）</option>';
  }
  html += '</select></div>';
  html += '<div id="priceDisplay"></div>';
  html += '</div>';

  html += '<div class="preview-card"><div class="preview-title">返却予定日</div>';
  html += '<div class="form-row"><input class="form-input" type="date" id="returnDate" style="padding:10px 12px;"></div>';
  html += '</div>';

  html += '<div style="font-size:13px;font-weight:700;color:var(--brown);margin-bottom:6px;">① 契約書を発行する</div>';
  html += '<button class="btn-primary" style="background:var(--blue);margin-bottom:16px;" onclick="navigateTo(\'pdf_preview.html\',{orderNumber:\'' + (selectedOrder || '') + '\'})">PDF印刷（契約書3枚）</button>';
  html += '<div style="font-size:13px;font-weight:700;color:var(--brown);margin-bottom:6px;">② 契約内容を保管する</div>';
  html += '<button class="btn-primary" style="background:var(--green);margin-bottom:16px;" id="issueBtn" onclick="doIssue()">有効な契約に保管</button>';
  html += '<button class="btn-secondary" onclick="showScr(\'scrList\')">一覧に戻る</button>';

  document.getElementById('previewContent').innerHTML = html;
}

function calcPrice() {
  var planSelect = document.getElementById('pricePlanSelect');
  var discountSelect = document.getElementById('discountSelect');
  var fee = Number(planSelect.options[planSelect.selectedIndex].dataset.fee) || 0;
  var rate = Number(discountSelect.options[discountSelect.selectedIndex].dataset.rate) || 0;
  var discount = Math.floor(fee * rate / 100);
  var total = fee - discount;
  var html = '';
  if (fee > 0) {
    html += '<div class="price-row"><span>保管料</span><span>' + fee.toLocaleString() + '円</span></div>';
    if (discount > 0) html += '<div class="price-row"><span>割引</span><span>-' + discount.toLocaleString() + '円</span></div>';
    html += '<div class="price-row total"><span>合計（税別）</span><span>' + total.toLocaleString() + '円</span></div>';
  }
  document.getElementById('priceDisplay').innerHTML = html;
}

var issueLoading = false;
async function doIssue() {
  if (!selectedOrder || issueLoading) return;
  var planSelect = document.getElementById('pricePlanSelect');
  var discountSelect = document.getElementById('discountSelect');
  if (!planSelect.value) { showError('料金プランを選択してください'); return; }
  var returnDate = document.getElementById('returnDate').value;
  if (!returnDate) { showError('返却予定日を入力してください'); return; }
  var fee = Number(planSelect.options[planSelect.selectedIndex].dataset.fee) || 0;
  var rate = Number(discountSelect.options[discountSelect.selectedIndex].dataset.rate) || 0;
  var discount = Math.floor(fee * rate / 100);
  var total = fee - discount;
  issueLoading = true;
  var btn = document.getElementById('issueBtn');
  btn.disabled = true;
  startLoading(btn);
  var r = await callAPI('contract_issue', {
    orderNumber: selectedOrder, tireType: currentTireType || '',
    pricePlan: planSelect.value, fee: String(fee),
    discountRule: discountSelect.value, discountAmount: String(discount),
    total: String(total), returnDate: returnDate,
  });
  stopLoading(btn); btn.disabled = false; issueLoading = false;
  if (handleAPIError(r)) return;
  showSuccess('契約書を発行しました（' + r.data.contractNumber + '）');
  loadList();
  showScr('scrList');
}

function doPrint() {
  var content = document.getElementById('previewContent').innerHTML;
  var pw = window.open('', '_blank');
  pw.document.write('<html><head><title>タイヤホテル契約書</title><style>');
  pw.document.write('body{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;color:#2C2C2C;padding:20mm;font-size:11pt}');
  pw.document.write('.preview-card{border:1px solid #ddd;border-radius:8px;padding:14px;margin-bottom:12px}');
  pw.document.write('.preview-title{font-size:13pt;font-weight:700;color:#5C4033;margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid #E86A2A}');
  pw.document.write('.preview-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee;font-size:10pt}');
  pw.document.write('.preview-label{color:#999}.preview-value{font-weight:600}');
  pw.document.write('.tire-preview{padding:8px;background:#FAF8F5;border-radius:6px;margin-bottom:6px}');
  pw.document.write('.tire-preview-title{font-size:11pt;font-weight:700;color:#5C4033;margin-bottom:4px}');
  pw.document.write('.tire-preview-row{display:flex;justify-content:space-between;font-size:10pt;padding:2px 0}');
  pw.document.write('.scratch-tag{font-size:9pt;padding:2px 6px;background:#FFF5F5;color:#C41E3A;border-radius:3px;display:inline-block;margin-right:3px}');
  pw.document.write('.price-card{border:2px solid #006B3F;border-radius:8px;padding:14px;margin-bottom:12px}');
  pw.document.write('.price-title{font-size:13pt;font-weight:700;color:#006B3F;margin-bottom:8px}');
  pw.document.write('.price-row{display:flex;justify-content:space-between;padding:4px 0;font-size:11pt}');
  pw.document.write('.price-row.total{border-top:2px solid #006B3F;padding-top:8px;margin-top:4px;font-size:14pt;font-weight:700}');
  pw.document.write('.edit-link,.btn-primary,.btn-secondary,select{display:none!important}');
  pw.document.write('@media print{@page{margin:15mm}}');
  pw.document.write('</style></head><body>');
  pw.document.write('<div style="text-align:center;margin-bottom:20px;"><h1 style="font-size:18pt;color:#5C4033;">タイヤホテル預かり契約書</h1></div>');
  pw.document.write(content);
  pw.document.write('<div style="margin-top:40px;border-top:1px solid #ddd;padding-top:20px;display:flex;justify-content:space-between;font-size:11pt;">');
  pw.document.write('<div>お客様署名：＿＿＿＿＿＿＿＿＿＿＿＿</div><div>日付：＿＿＿＿年＿＿月＿＿日</div></div>');
  pw.document.write('</body></html>');
  pw.document.close(); pw.print();
}

async function loadScratchPhotos(idx, folderId) {
  var r = await callAPI('photo_getImage', { folderId: folderId });
  var el = document.getElementById('photos_' + idx);
  if (!el) return;
  if (!r || !r.ok || !r.data || !r.data.images || r.data.images.length === 0) {
    el.innerHTML = '<div style="font-size:11px;color:var(--text3);">写真なし</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < r.data.images.length; i++) {
    var img = r.data.images[i];
    var src = img.base64 || img.dataUrl || img.url || '';
    if (src) html += '<div style="width:60px;height:60px;border-radius:6px;overflow:hidden;border:1px solid var(--border);cursor:pointer;" onclick="showPhotoModal(this.querySelector(\'img\').src)"><img src="' + src + '" style="width:100%;height:100%;object-fit:cover;"></div>';
  }
  el.innerHTML = html || '<div style="font-size:11px;color:var(--text3);">写真なし</div>';
}

// ========== 有効な契約タブ ==========

async function loadContracts() {
  var r = await callAPI('contract_list', {});
  if (handleAPIError(r)) return;
  var contracts = r.data.contracts || [];
  if (contracts.length === 0) {
    document.getElementById('contractList').innerHTML = '<div style="text-align:center;color:var(--text3);padding:20px;">有効な契約はありません</div>';
    return;
  }
  var html = '<div class="section-label">有効な契約（' + contracts.length + '件）</div>';
  for (var i = 0; i < contracts.length; i++) {
    var c = contracts[i];
    html += '<div class="list-card" onclick="loadDetail(\'' + escapeHtml(c['契約番号']) + '\')">'
      + '<div class="list-top"><span class="list-customer">' + escapeHtml(c['顧客名'] || '') + '</span>'
      + '<span class="status st-ready">' + escapeHtml(c['状態']) + '</span></div>'
      + '<div class="list-plate">' + escapeHtml(c['ナンバー'] || '') + ' / ' + escapeHtml(c['車種'] || '') + '</div>'
      + '<div class="list-detail">合計: ¥' + (Number(c['合計（税別）']) || 0).toLocaleString() + '</div>'
      + '<div class="list-detail">' + formatDate(c['預かり日']) + ' 〜 ' + formatDate(c['返却予定日']) + '</div></div>';
  }
  document.getElementById('contractList').innerHTML = html;
}

// ========== 契約詳細 ==========

async function loadDetail(contractNumber) {
  showScr('scrDetail');
  document.getElementById('detailContent').innerHTML = '<div style="text-align:center;color:var(--text3);padding:20px;">読み込み中...</div>';

  var r = await callAPI('contract_detail', { contractNumber: contractNumber });
  if (handleAPIError(r)) return;
  currentContract = r.data.contract;
  currentVersion = currentContract['版番号'];
  var c = currentContract;
  var contacts = r.data.contacts || [];

  var html = '';
  html += '<div class="confirm-box"><div style="font-size:14px;font-weight:700;color:var(--brown);margin-bottom:8px;">契約情報</div>';
  html += '<div class="confirm-row"><span class="confirm-label">契約番号</span><span class="confirm-value">' + escapeHtml(c['契約番号']) + '</span></div>';
  html += '<div class="confirm-row"><span class="confirm-label">状態</span><span class="confirm-value">' + escapeHtml(c['状態']) + '</span></div>';
  html += '<div class="confirm-row"><span class="confirm-label">契約区分</span><span class="confirm-value">' + escapeHtml(c['契約区分'] || c['種別'] || '') + '</span></div>';
  html += '<div class="confirm-row"><span class="confirm-label">預かり区分</span><span class="confirm-value">' + escapeHtml(c['預かり区分'] || '') + '</span></div>';
  html += '<div class="confirm-row"><span class="confirm-label">預かり日</span><span class="confirm-value">' + formatDate(c['預かり日']) + '</span></div>';
  html += '<div class="confirm-row"><span class="confirm-label">返却予定日</span><span class="confirm-value">' + formatDate(c['返却予定日']) + '</span></div>';
  html += '<div class="confirm-row"><span class="confirm-label">更新回数</span><span class="confirm-value">' + (c['更新回数'] || 0) + '回</span></div>';
  html += '</div>';

  html += '<div class="confirm-box"><div style="font-size:14px;font-weight:700;color:var(--brown);margin-bottom:8px;">料金</div>';
  html += '<div class="confirm-row"><span class="confirm-label">保管料（税別）</span><span class="confirm-value">¥' + (Number(c['保管料（税別）']) || 0).toLocaleString() + '</span></div>';
  html += '<div class="confirm-row"><span class="confirm-label">割引額</span><span class="confirm-value">¥' + (Number(c['割引額']) || 0).toLocaleString() + '</span></div>';
  html += '<div class="confirm-row"><span class="confirm-label">合計（税別）</span><span class="confirm-value" style="color:var(--orange);font-weight:700;">¥' + (Number(c['合計（税別）']) || 0).toLocaleString() + '</span></div>';
  html += '</div>';

  // 連絡状況
  html += '<div class="confirm-box"><div style="font-size:14px;font-weight:700;color:var(--brown);margin-bottom:8px;">連絡状況</div>';
  html += '<div class="toggle-group" id="contactStatusGroup" style="flex-wrap:wrap;margin-bottom:10px;">';
  var statuses = ['未連絡', '連絡済み', '返事待ち', '予約入り', '連絡不能', '督促済'];
  for (var si = 0; si < statuses.length; si++) {
    var stColor = (statuses[si] === '連絡不能' || statuses[si] === '督促済') ? ';color:var(--red)' : '';
    html += '<span class="toggle-btn" data-value="' + statuses[si] + '" onclick="toggleCheck(this)" style="font-size:12px;padding:8px 12px' + stColor + '">' + statuses[si] + '</span>';
  }
  html += '</div>';
  html += '<textarea class="form-input" rows="3" id="contactMemo" placeholder="連絡日時、内容、お客様の反応など" style="resize:vertical;margin-bottom:8px;"></textarea>';
  html += '<button class="btn-secondary" style="color:var(--green);border-color:var(--green);" id="contactSaveBtn" onclick="saveContact()">連絡状況を保存</button>';

  if (contacts.length > 0) {
    html += '<div style="font-size:12px;font-weight:600;color:var(--text3);margin:12px 0 6px;">連絡履歴</div>';
    for (var ci = 0; ci < contacts.length; ci++) {
      var ct = contacts[ci];
      html += '<div class="contact-log"><span style="font-weight:600;">' + escapeHtml(ct['連絡状況'] || '') + '</span> ' + formatDateTime(ct['連絡日時']) + '<br>' + escapeHtml(ct['連絡メモ'] || '') + '</div>';
    }
  }
  html += '</div>';

  // 印刷
  var printCount = Number(c['印刷回数']) || 0;
  html += '<div class="confirm-box"><div style="font-size:14px;font-weight:700;color:var(--brown);margin-bottom:8px;">印刷</div>';
  if (printCount > 0) {
    html += '<div style="font-size:12px;color:var(--text2);margin-bottom:8px;">印刷済み: ' + printCount + '回（最新: ' + escapeHtml(c['契約番号']) + '-' + printCount + '）</div>';
  }
  html += '<button class="btn-secondary" style="color:var(--blue);border-color:var(--blue);" onclick="doPrintContract(\'' + escapeHtml(c['契約番号']) + '\',\'' + escapeHtml(c['伝票番号'] || '') + '\')">PDF印刷（契約書3枚）</button>';
  html += '</div>';

  // アクション
  html += '<div class="confirm-box"><div style="font-size:14px;font-weight:700;color:var(--brown);margin-bottom:8px;">アクション</div>';
  html += '<button class="btn-secondary" style="color:var(--green);border-color:var(--green);" onclick="showRenewScreen()">契約を更新する</button>';
  html += '<button class="btn-danger" id="closeBtn" onclick="closeContract()">契約を終了する</button>';
  html += '</div>';

  document.getElementById('detailContent').innerHTML = html;
}

// 連絡状況保存
async function saveContact() {
  if (!currentContract) return;
  var status = getToggleValue('contactStatusGroup');
  if (!status) { showError('連絡状況を選んでください'); return; }
  startLoading(document.getElementById('contactSaveBtn'));
  var r = await callAPI('contract_updateContact', {
    contractNumber: currentContract['契約番号'],
    contactStatus: status,
    contactMemo: document.getElementById('contactMemo').value.trim()
  });
  stopLoading(document.getElementById('contactSaveBtn'));
  if (handleAPIError(r)) return;
  showSuccess('連絡状況を保存しました');
  loadDetail(currentContract['契約番号']);
}

// 契約更新画面
function showRenewScreen() {
  if (!currentContract) return;
  var c = currentContract;
  var html = '<div class="confirm-box"><div style="font-size:14px;font-weight:700;color:var(--brown);margin-bottom:8px;">現在の契約</div>';
  html += '<div class="confirm-row"><span class="confirm-label">契約番号</span><span class="confirm-value">' + escapeHtml(c['契約番号']) + '</span></div>';
  html += '<div class="confirm-row"><span class="confirm-label">保管料</span><span class="confirm-value">¥' + (Number(c['保管料（税別）']) || 0).toLocaleString() + '</span></div>';
  html += '<div class="confirm-row"><span class="confirm-label">更新回数</span><span class="confirm-value">' + (c['更新回数'] || 0) + '回</span></div></div>';
  document.getElementById('renewInfo').innerHTML = html;
  document.getElementById('renewReturnDate').value = '';
  document.getElementById('renewMemo').value = '';
  showScr('scrRenew');
}

async function doRenew() {
  if (!currentContract) return;
  startLoading(document.getElementById('renewBtn'));
  var r = await callAPI('contract_renew', {
    contractNumber: currentContract['契約番号'],
    version: currentVersion,
    idempotencyKey: generateIdempotencyKey(),
    returnDate: document.getElementById('renewReturnDate').value,
    renewMemo: document.getElementById('renewMemo').value.trim()
  });
  stopLoading(document.getElementById('renewBtn'));
  if (handleAPIError(r)) return;
  showSuccess('契約を更新しました');
  loadDetail(currentContract['契約番号']);
  showScr('scrDetail');
}

async function closeContract() {
  if (!currentContract) return;
  if (!confirmAction('この契約を終了しますか？')) return;
  startLoading(document.getElementById('closeBtn'));
  var r = await callAPI('contract_close', {
    contractNumber: currentContract['契約番号'],
    version: currentVersion
  });
  stopLoading(document.getElementById('closeBtn'));
  if (handleAPIError(r)) return;
  showSuccess('契約を終了しました');
  loadContracts();
  showScr('scrList');
}

async function doPrintContract(contractNumber, orderNumber) {
  var r = await callAPI('contract_print', { contractNumber: contractNumber });
  if (handleAPIError(r)) return;
  showSuccess('印刷番号: ' + r.data.printNumber + '（' + r.data.printCount + '回目）');
  navigateTo('pdf_preview.html', { orderNumber: orderNumber, printNumber: r.data.printNumber });
}

function getStatusClass(st) {
  if (st === '有効') return 'st-ready';
  if (st === '終了' || st === '早期終了') return 'st-done';
  return 'st-waiting';
}

loadList();
</script>
</body>
</html>
