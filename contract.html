<!DOCTYPE html>
<html lang="ja" style="color-scheme:only light;">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>契約書発行 - タイヤホテルOKABE DX</title>
<link rel="stylesheet" href="style.css">
<script src="api.js"></script>
<script src="common.js"></script>
<style>
.preview-card { background: var(--white); border: 1.5px solid var(--border-light); border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
.preview-title { font-size: 14px; font-weight: 700; color: var(--brown); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid var(--orange); display: flex; justify-content: space-between; }
.edit-link { font-size: 12px; color: var(--blue); cursor: pointer; text-decoration: underline; font-weight: 400; }
.edit-link:active { color: var(--orange); }
.preview-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border-light); font-size: 13px; }
.preview-row:last-child { border-bottom: none; }
.preview-label { color: var(--text3); min-width: 80px; }
.preview-value { color: var(--text); font-weight: 600; text-align: right; flex: 1; }
.preview-value.empty { color: var(--red); font-style: italic; font-weight: 400; }
.preview-value.alert { color: var(--red); font-weight: 700; }
.tire-preview { margin-bottom: 8px; padding: 10px; background: var(--cream); border-radius: 8px; }
.tire-preview-title { font-size: 13px; font-weight: 700; color: var(--brown); margin-bottom: 6px; }
.tire-preview-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
.tire-preview-label { color: var(--text3); }
.tire-preview-value { color: var(--text); font-weight: 600; }
.scratch-tag { font-size: 11px; padding: 2px 8px; background: #FFF5F5; color: var(--red); border-radius: 4px; font-weight: 600; display: inline-block; margin-right: 4px; }
.price-card { background: var(--white); border: 2px solid var(--green); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.price-title { font-size: 14px; font-weight: 700; color: var(--green); margin-bottom: 10px; }
.price-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
.price-row.total { border-top: 2px solid var(--green); padding-top: 10px; margin-top: 6px; font-size: 18px; font-weight: 700; }
.list-card { background: var(--white); border: 1.5px solid var(--border-light); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; box-shadow: var(--shadow-sm); }
.list-card:active { transform: scale(0.98); background: #FFF8F0; }
.list-card.issued { opacity: 0.5; }
.list-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.list-customer { font-size: 15px; font-weight: 700; }
.list-plate { font-size: 14px; font-weight: 600; color: var(--brown); margin-bottom: 4px; }
.list-detail { font-size: 13px; color: var(--text2); }
.list-time { font-size: 12px; color: var(--text3); margin-top: 4px; }
</style>
</head>
<body>

<!-- 一覧画面 -->
<div id="scrList" class="screen active">
  <div class="header">
    <button class="home-btn" onclick="goHome()">ホーム</button>
    <div class="header-title">契約書発行</div>
  </div>
  <div class="content">
    <div class="section-label">契約書発行待ち</div>
    <div id="completedList"><div style="text-align:center;color:var(--text3);padding:20px;">読み込み中...</div></div>
  </div>
</div>

<!-- プレビュー画面 -->
<div id="scrPreview" class="screen">
  <div class="header">
    <button class="home-btn" onclick="goHome()">ホーム</button>
    <button class="back-btn" onclick="showScr('scrList')">< 戻る</button>
    <div class="header-title">契約書プレビュー</div>
  </div>
  <div class="content" id="previewContent">
    <div style="text-align:center;color:var(--text3);padding:20px;">読み込み中...</div>
  </div>
</div>

<script>
if (!requireLogin()) {}

var selectedOrder = null;
var currentTireType = '';

// 一覧
async function loadList() {
  var r = await callAPI('contract_completedList', {});
  if (handleAPIError(r)) return;
  var items = r.data.items || [];

  if (items.length === 0) {
    document.getElementById('completedList').innerHTML = '<div style="text-align:center;color:var(--text3);padding:20px;">発行待ちの契約はありません</div>';
    return;
  }

  var html = '';
  var hasIssued = false;

  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (it.status === '契約発行済み') continue;
    html += '<div class="list-card" onclick="loadPreview(\'' + escapeHtml(it.orderNumber) + '\')">';
    html += '<div class="list-top"><span class="list-customer">' + escapeHtml(it.customerName) + '</span>';
    html += '<span class="status st-ready">作業完了</span></div>';
    html += '<div class="list-plate">' + escapeHtml(it.plate) + '</div>';
    html += '<div class="list-detail">' + escapeHtml(it.model) + ' / ' + escapeHtml(it.tireInfo) + '</div>';
    html += '<div class="list-time">完了 : ' + formatDateTime(it.completedAt) + '</div>';
    html += '</div>';
  }

  for (var j = 0; j < items.length; j++) {
    var it2 = items[j];
    if (it2.status !== '契約発行済み') continue;
    if (!hasIssued) {
      html += '<div class="section-label" style="color:var(--text3);margin-top:16px;">発行済み</div>';
      hasIssued = true;
    }
    html += '<div class="list-card issued">';
    html += '<div class="list-top"><span class="list-customer">' + escapeHtml(it2.customerName) + '</span>';
    html += '<span class="status st-done">発行済み</span></div>';
    html += '<div class="list-plate">' + escapeHtml(it2.plate) + '</div>';
    html += '<div class="list-detail">' + escapeHtml(it2.model) + '</div>';
    html += '</div>';
  }

  document.getElementById('completedList').innerHTML = html;
}

// プレビュー
async function loadPreview(orderNumber) {
  selectedOrder = orderNumber;
  document.getElementById('previewContent').innerHTML = '<div style="text-align:center;color:var(--text3);padding:20px;">読み込み中...</div>';
  showScr('scrPreview');

  var r = await callAPI('contract_getPreview', { orderNumber: orderNumber });
  if (handleAPIError(r)) return;

  var d = r.data;
  var c = d.customer || {};
  var v = d.vehicle || {};
  var ts = d.tireSet || {};
  currentTireType = ts['区分'] || '';
  var recs = d.tireRecords || [];
  var plate = [v['地名'], v['分類番号'], v['かな'], v['下4桁']].filter(Boolean).join(' ');

  var html = '';

  html += '<div class="preview-card"><div class="preview-title">顧客情報 <span class="edit-link" onclick="navigateTo(\'customer.html\',{customerId:\'' + (c['顧客ID'] || '') + '\'})">編集</span></div>';
  html += '<div class="preview-row"><span class="preview-label">氏名</span><span class="preview-value">' + escapeHtml(c['氏名'] || '') + '</span></div>';
  html += '<div class="preview-row"><span class="preview-label">電話番号</span><span class="preview-value' + (!c['電話'] ? ' empty' : '') + '">' + escapeHtml(c['電話'] || '未入力') + '</span></div>';
  html += '<div class="preview-row"><span class="preview-label">携帯番号</span><span class="preview-value">' + escapeHtml(c['携帯'] || '') + '</span></div>';
  html += '<div class="preview-row"><span class="preview-label">住所</span><span class="preview-value" style="font-size:12px;">' + escapeHtml(c['住所'] || '') + '</span></div>';
  html += '</div>';

  html += '<div class="preview-card"><div class="preview-title">車両情報 <span class="edit-link" onclick="navigateTo(\'vehicle.html\',{vehicleId:\'' + (v['車両ID'] || '') + '\'})">編集</span></div>';
  html += '<div class="preview-row"><span class="preview-label">ナンバー</span><span class="preview-value">' + escapeHtml(plate) + '</span></div>';
  html += '<div class="preview-row"><span class="preview-label">メーカー</span><span class="preview-value">' + escapeHtml(v['メーカー'] || '') + '</span></div>';
  html += '<div class="preview-row"><span class="preview-label">車種</span><span class="preview-value">' + escapeHtml(v['車種名'] || '') + '</span></div>';
  html += '</div>';

  html += '<div class="preview-card"><div class="preview-title">タイヤ情報（' + (ts['本数'] || '') + '本） <span class="edit-link" onclick="navigateTo(\'tire_input.html\',{orderNumber:\'' + (selectedOrder || '') + '\',tireSetId:\'' + (ts['タイヤセットID'] || '') + '\'})">編集</span></div>';
  html += '<div class="preview-row"><span class="preview-label">預かり区分</span><span class="preview-value">' + escapeHtml(ts['区分'] || '') + 'タイヤ預かり</span></div>';
  for (var k = 0; k < recs.length; k++) {
    var rec = recs[k];
    html += '<div class="tire-preview">';
    html += '<div class="tire-preview-title">' + (k+1) + '本目 : ' + escapeHtml(rec['ポジション'] || '') + '</div>';
    html += '<div class="tire-preview-row"><span class="tire-preview-label">メーカー / パターン</span><span class="tire-preview-value">' + escapeHtml(rec['メーカー'] || '') + ' / ' + escapeHtml(rec['パターン'] || '') + '</span></div>';
    html += '<div class="tire-preview-row"><span class="tire-preview-label">サイズ</span><span class="tire-preview-value">' + escapeHtml(rec['サイズ'] || '') + '</span></div>';
    var groove = parseFloat(rec['残溝']) || 0;
    var grooveClass = groove > 0 && groove < 3 ? ' alert' : '';
    html += '<div class="tire-preview-row"><span class="tire-preview-label">残溝</span><span class="tire-preview-value' + grooveClass + '">' + escapeHtml(rec['残溝'] || '') + ' mm' + (groove > 0 && groove < 3 ? ' ⚠要交換' : '') + '</span></div>';
    var scratches = [];
    if (rec['傷_サイドウォール'] === 'はい') scratches.push('サイドウォール');
    if (rec['傷_トレッド面'] === 'はい') scratches.push('トレッド面');
    if (rec['傷_リム'] === 'はい') scratches.push('リム');
    if (scratches.length > 0) {
      html += '<div class="tire-preview-row"><span class="tire-preview-label">傷</span></div>';
      for (var s = 0; s < scratches.length; s++) html += '<span class="scratch-tag">' + scratches[s] + '</span>';
      if (rec['傷写真フォルダID']) {
        html += '<div id="photos_' + k + '" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;"><div style="font-size:11px;color:var(--text3);">写真を読み込み中...</div></div>';
        loadScratchPhotos(k, rec['傷写真フォルダID']);
      }
    } else if (rec['傷なし'] === 'はい') {
      html += '<div class="tire-preview-row"><span class="tire-preview-label">傷</span><span class="tire-preview-value" style="color:var(--green);">傷なし</span></div>';
    }
    html += '</div>';
  }
  html += '</div>';

  html += '<div class="preview-card"><div class="preview-title">保管について</div>';
  html += '<div style="font-size:13px;color:var(--text2);line-height:1.6;">お預かりしたタイヤは、株式会社OKABE GROUPが管理する倉庫にて安全に保管いたします。</div></div>';

  html += '<div class="price-card"><div class="price-title">料金</div>';
  html += '<div class="form-row"><label class="form-label">料金プラン</label><select class="form-input" id="pricePlanSelect" style="padding:10px;" onchange="calcPrice()">';
  html += '<option value="">選択してください</option>';
  for (var p = 0; p < d.pricePlans.length; p++) {
    var pp = d.pricePlans[p];
    html += '<option value="' + escapeHtml(pp['プランID']) + '" data-fee="' + escapeHtml(pp['保管料']) + '">' + escapeHtml(pp['プラン名']) + '（' + escapeHtml(pp['保管料']) + '円）</option>';
  }
  html += '</select></div>';
  html += '<div class="form-row"><label class="form-label">割引</label><select class="form-input" id="discountSelect" style="padding:10px;" onchange="calcPrice()">';
  html += '<option value="" data-rate="0">なし</option>';
  for (var q = 0; q < d.discountRules.length; q++) {
    var dr = d.discountRules[q];
    html += '<option value="' + escapeHtml(dr['割引ルールID']) + '" data-rate="' + escapeHtml(dr['割引率']) + '">' + escapeHtml(dr['割引名']) + '（' + escapeHtml(dr['割引率']) + '%OFF）</option>';
  }
  html += '</select></div>';
  html += '<div id="priceDisplay"></div>';
  html += '</div>';

  html += '<div class="preview-card"><div class="preview-title">返却予定日</div>';
  html += '<div class="form-row"><input class="form-input" type="date" id="returnDate" style="padding:10px 12px;"></div>';
  html += '</div>';

  html += '<button class="btn-primary" style="background:var(--green);" id="issueBtn" onclick="doIssue()">契約書を発行する</button>';
  html += '<button class="btn-secondary" style="color:var(--blue);border-color:var(--blue);" onclick="doPrint()">PDF印刷（契約書）</button>';
  html += '<button class="btn-secondary" onclick="showScr(\'scrList\')">一覧に戻る</button>';

  document.getElementById('previewContent').innerHTML = html;
}

function calcPrice() {
  var planSelect = document.getElementById('pricePlanSelect');
  var discountSelect = document.getElementById('discountSelect');
  var fee = Number(planSelect.options[planSelect.selectedIndex].dataset.fee) || 0;
  var rate = Number(discountSelect.options[discountSelect.selectedIndex].dataset.rate) || 0;
  var discount = Math.floor(fee * rate / 100);
  var total = fee - discount;

  var html = '';
  if (fee > 0) {
    html += '<div class="price-row"><span>保管料</span><span>' + fee.toLocaleString() + '円</span></div>';
    if (discount > 0) html += '<div class="price-row"><span>割引</span><span>-' + discount.toLocaleString() + '円</span></div>';
    html += '<div class="price-row total"><span>合計（税別）</span><span>' + total.toLocaleString() + '円</span></div>';
  }
  document.getElementById('priceDisplay').innerHTML = html;
}

var issueLoading = false;
async function doIssue() {
  if (!selectedOrder || issueLoading) return;
  var planSelect = document.getElementById('pricePlanSelect');
  var discountSelect = document.getElementById('discountSelect');

  if (!planSelect.value) { showError('料金プランを選択してください'); return; }
  var returnDate = document.getElementById('returnDate').value;
  if (!returnDate) { showError('返却予定日を入力してください'); return; }

  var fee = Number(planSelect.options[planSelect.selectedIndex].dataset.fee) || 0;
  var rate = Number(discountSelect.options[discountSelect.selectedIndex].dataset.rate) || 0;
  var discount = Math.floor(fee * rate / 100);
  var total = fee - discount;

  issueLoading = true;
  var btn = document.getElementById('issueBtn');
  btn.disabled = true;
  startLoading(btn);
  var r = await callAPI('contract_issue', {
    orderNumber: selectedOrder,
    tireType: currentTireType || '',
    pricePlan: planSelect.value,
    fee: String(fee),
    discountRule: discountSelect.value,
    discountAmount: String(discount),
    total: String(total),
    returnDate: returnDate,
  });
  stopLoading(btn);
  btn.disabled = false;
  issueLoading = false;
  if (handleAPIError(r)) return;

  showSuccess('契約書を発行しました（' + r.data.contractNumber + '）');
  loadList();
  showScr('scrList');
}

function doPrint() {
  var printContent = document.getElementById('previewContent').innerHTML;
  var printWindow = window.open('', '_blank');
  printWindow.document.write('<html><head><title>タイヤホテル契約書</title>');
  printWindow.document.write('<style>');
  printWindow.document.write('body { font-family: "Hiragino Sans","Noto Sans JP",sans-serif; color: #2C2C2C; padding: 20mm; font-size: 11pt; }');
  printWindow.document.write('.preview-card { border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin-bottom: 12px; }');
  printWindow.document.write('.preview-title { font-size: 13pt; font-weight: 700; color: #5C4033; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 2px solid #E86A2A; }');
  printWindow.document.write('.preview-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #eee; font-size: 10pt; }');
  printWindow.document.write('.preview-label { color: #999; }');
  printWindow.document.write('.preview-value { font-weight: 600; }');
  printWindow.document.write('.preview-value.empty { color: #C41E3A; }');
  printWindow.document.write('.preview-value.alert { color: #C41E3A; font-weight: 700; }');
  printWindow.document.write('.tire-preview { padding: 8px; background: #FAF8F5; border-radius: 6px; margin-bottom: 6px; }');
  printWindow.document.write('.tire-preview-title { font-size: 11pt; font-weight: 700; color: #5C4033; margin-bottom: 4px; }');
  printWindow.document.write('.tire-preview-row { display: flex; justify-content: space-between; font-size: 10pt; padding: 2px 0; }');
  printWindow.document.write('.tire-preview-label { color: #999; }');
  printWindow.document.write('.tire-preview-value { font-weight: 600; }');
  printWindow.document.write('.scratch-tag { font-size: 9pt; padding: 2px 6px; background: #FFF5F5; color: #C41E3A; border-radius: 3px; display: inline-block; margin-right: 3px; }');
  printWindow.document.write('.price-card { border: 2px solid #006B3F; border-radius: 8px; padding: 14px; margin-bottom: 12px; }');
  printWindow.document.write('.price-title { font-size: 13pt; font-weight: 700; color: #006B3F; margin-bottom: 8px; }');
  printWindow.document.write('.price-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 11pt; }');
  printWindow.document.write('.price-row.total { border-top: 2px solid #006B3F; padding-top: 8px; margin-top: 4px; font-size: 14pt; font-weight: 700; }');
  printWindow.document.write('.edit-link, .btn-primary, .btn-secondary, select, #priceDisplay + div { display: none !important; }');
  printWindow.document.write('@media print { @page { margin: 15mm; } }');
  printWindow.document.write('</style></head><body>');
  printWindow.document.write('<div style="text-align:center;margin-bottom:20px;"><h1 style="font-size:18pt;color:#5C4033;">タイヤホテル預かり契約書</h1></div>');
  printWindow.document.write(printContent);
  printWindow.document.write('<div style="margin-top:40px;border-top:1px solid #ddd;padding-top:20px;">');
  printWindow.document.write('<div style="display:flex;justify-content:space-between;font-size:11pt;">');
  printWindow.document.write('<div>お客様署名：＿＿＿＿＿＿＿＿＿＿＿＿</div>');
  printWindow.document.write('<div>日付：＿＿＿＿年＿＿月＿＿日</div>');
  printWindow.document.write('</div></div>');
  printWindow.document.write('</body></html>');
  printWindow.document.close();
  printWindow.print();
}

async function loadScratchPhotos(idx, folderId) {
  var r = await callAPI('photo_getImage', { folderId: folderId });
  var el = document.getElementById('photos_' + idx);
  if (!el) return;
  if (!r || !r.ok || !r.data || !r.data.images || r.data.images.length === 0) {
    el.innerHTML = '<div style="font-size:11px;color:var(--text3);">写真なし</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < r.data.images.length; i++) {
    var img = r.data.images[i];
    var src = img.dataUrl || img.url || '';
    if (src) {
      html += '<div style="width:60px;height:60px;border-radius:6px;overflow:hidden;border:1px solid var(--border);cursor:pointer;" onclick="showPhotoModal(this.querySelector(\'img\').src)"><img src="' + src + '" style="width:100%;height:100%;object-fit:cover;"></div>';
    }
  }
  el.innerHTML = html || '<div style="font-size:11px;color:var(--text3);">写真なし</div>';
}

loadList();
</script>
</body>
</html>
