<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>D. 車両選択 - タイヤホテルOKABE DX</title>
<link rel="stylesheet" href="style.css">
<script src="api.js"></script>
<script src="common.js"></script>
<style>
.vehicle-card { background: var(--white); border: 2px solid var(--border-light); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; }
.vehicle-card:active { transform: scale(0.98); }
.vehicle-card.selected { border-color: var(--orange); background: #FFF8F0; }
.vehicle-number { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.vehicle-info { font-size: 13px; color: var(--text2); line-height: 1.5; }
.stored-tire-box { background: var(--white); border: 2px solid var(--blue); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
</style>
</head>
<body>

<!-- D-4 車両選択 -->
<div id="scrVehicle" class="screen active">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="location.href='d_reception_customer.html'">&lt; 戻る</button>
    <div class="header-title">車両を選ぶ</div>
  </div>
  <div class="content">
    <div class="info-bar"><span class="info-bar-label">顧客: </span><span class="info-bar-value" id="customerName">読み込み中...</span></div>
    <div class="section-label">登録済み車両</div>
    <div id="vehicleFilterBox" style="display:none;margin-bottom:10px;">
      <input class="form-input" type="text" id="vehicleFilter" placeholder="ナンバー・車種で絞り込み" oninput="filterVehicles()" style="padding:10px 14px;font-size:14px;">
      <div style="font-size:12px;color:var(--text3);margin-top:4px;" id="vehicleCountLabel"></div>
    </div>
    <div id="vehicleList"><div style="text-align:center;color:var(--text3);padding:12px;">読み込み中...</div></div>
    <div class="btn-row" style="flex-direction:column;gap:10px;">
      <button class="btn-primary" style="flex:none;" id="selectVehicleBtn" onclick="proceedWithVehicle()" disabled>この車で受付へ</button>
      <button class="btn-primary" style="background:var(--green);flex:none;" onclick="showScr('scrNewVehicle')">車両が見つからない → 新規登録</button>
      <button class="btn-secondary" style="flex:none;" onclick="goToNext()">車両は後から登録 → タイヤ入力へ</button>
    </div>
  </div>
  <div class="page-id">D-4 車両選択</div>
</div>

<!-- D-4b 預かり中タイヤ確認 -->
<div id="scrStoredTire" class="screen">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="showScr('scrVehicle')">&lt; 戻る</button>
    <div class="header-title">預かり中タイヤ確認</div>
  </div>
  <div class="content">
    <div class="info-bar" id="storedTireInfo"></div>
    <div id="storedTireList"></div>
    <div class="btn-row" style="flex-direction:column;gap:10px;">
      <button class="btn-primary" style="flex:none;" onclick="goToNext()">次へ（タイヤ情報の入力）</button>
    </div>
  </div>
  <div class="page-id">D-4b 預かり中タイヤ確認</div>
</div>

<!-- D-5 新規車両登録 -->
<div id="scrNewVehicle" class="screen">
  <div class="header">
    <button class="home-btn" onclick="location.href='index.html'">ホーム</button>
    <button class="back-btn" onclick="showScr('scrVehicle')">&lt; 戻る</button>
    <div class="header-title">新規車両登録</div>
  </div>
  <div class="content">
    <div class="form-section">
      <div class="form-section-title">読み取りで入力</div>
      <button class="reg-btn" style="background:var(--white);color:var(--text);border:1.5px solid var(--border);margin-bottom:6px;" onclick="document.getElementById('ocrShaken2').click()">車検証を読み取り<span style="display:block;font-size:11px;font-weight:400;color:var(--text3);margin-top:2px;">ファイル選択で読み取り</span></button>
      <input type="file" id="ocrShaken2" accept="image/*" style="display:none;" onchange="doOcrVehicle(this,'車検証')">
      <button class="reg-btn" style="background:var(--white);color:var(--text);border:1.5px solid var(--border);" onclick="document.getElementById('ocrWork2').click()">作業指示書を読み取り<span style="display:block;font-size:11px;font-weight:400;color:var(--text3);margin-top:2px;">ファイル選択で読み取り</span></button>
      <input type="file" id="ocrWork2" accept="image/*" style="display:none;" onchange="doOcrVehicle(this,'作業指示書')">
    </div>
    <div class="form-section">
      <div class="form-section-title">ナンバー</div>
      <div class="form-row"><label class="form-label">下4桁</label><input class="form-input" type="text" id="nvPlateNum" placeholder="1234" maxlength="4" style="width:120px;font-size:20px;font-weight:700;text-align:center;"></div>
      <div class="form-row"><label class="form-label">地名（任意）</label><input class="form-input" type="text" id="nvArea" placeholder="岐阜" style="width:150px;"></div>
      <div class="form-row"><label class="form-label">分類番号（任意）</label><input class="form-input" type="text" id="nvClassNo" placeholder="500" style="width:120px;"></div>
      <div class="form-row"><label class="form-label">かな（任意）</label><input class="form-input" type="text" id="nvKana" placeholder="あ" style="width:80px;"></div>
    </div>
    <div class="form-section">
      <div class="form-section-title">車両情報</div>
      <div class="form-row"><label class="form-label">輪数</label>
        <select class="form-select" id="nvWheelCount"><option value="未確認">未確認</option><option value="4輪" selected>4輪</option><option value="6輪">6輪</option></select>
      </div>
      <div class="form-row"><label class="form-label">メーカー（任意）</label><input class="form-input" type="text" id="nvMaker" placeholder="トヨタ"></div>
      <div class="form-row"><label class="form-label">車種名（任意）</label><input class="form-input" type="text" id="nvModel" placeholder="プリウス"></div>
      <div class="form-row"><label class="form-label">車台番号 VIN（任意）</label><input class="form-input" type="text" id="nvVin"></div>
    </div>
    <div class="btn-row" style="flex-direction:column;gap:10px;">
      <button class="btn-primary" style="flex:none;" id="nvSaveBtn" onclick="createVehicle()">登録して受付へ</button>
      <button class="btn-secondary" style="flex:none;" onclick="showScr('scrVehicle')">キャンセル</button>
    </div>
  </div>
  <div class="page-id">D-5 新規車両登録</div>
</div>

<script>
if (!requireLogin()) {}

var customerId = getParam('customerId') || sessionStorage.getItem('reception_customerId') || '';
var fromForm = getParam('fromForm') === '1';
var selectedVehicleId = '';

function showScr(id) {
  var s = document.querySelectorAll('.screen');
  for (var i = 0; i < s.length; i++) s[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

async function loadCustomerVehicles() {
  if (!customerId) { showError('顧客が選択されていません'); return; }
  var result = await callAPI('customer_detail', { customerId: customerId });
  if (handleAPIError(result)) return;
  var c = result.data.customer;
  document.getElementById('customerName').textContent = c['氏名'] || '';
  sessionStorage.setItem('reception_customerName', c['氏名'] || '');
  allVehicles = result.data.vehicles || [];
  if (allVehicles.length === 0) {
    document.getElementById('vehicleList').innerHTML = '<div style="text-align:center;color:var(--text3);padding:20px;">登録車両なし</div>';
    return;
  }
  if (allVehicles.length > 20) {
    document.getElementById('vehicleFilterBox').style.display = '';
  }
  renderVehicleList(allVehicles);
}

var allVehicles = [];

function filterVehicles() {
  var q = (document.getElementById('vehicleFilter').value || '').trim().toLowerCase();
  if (!q) { renderVehicleList(allVehicles); return; }
  var filtered = allVehicles.filter(function(v) {
    var text = [v['地名'], v['分類番号'], v['かな'], v['下4桁'], v['車種名'], v['メーカー'], v['メモ']].filter(Boolean).join(' ').toLowerCase();
    return text.indexOf(q) >= 0;
  });
  renderVehicleList(filtered);
}

function renderVehicleList(vehicles) {
  document.getElementById('vehicleCountLabel').textContent = vehicles.length + '件 / 全' + allVehicles.length + '件';
  if (vehicles.length === 0) {
    document.getElementById('vehicleList').innerHTML = '<div style="text-align:center;color:var(--text3);padding:20px;">該当なし</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < vehicles.length; i++) {
    var v = vehicles[i];
    var plate = [v['地名'], v['分類番号'], v['かな'], v['下4桁']].filter(Boolean).join(' ');
    var memo = v['メモ'] ? ' [' + v['メモ'] + ']' : '';
    html += '<div class="vehicle-card" data-id="' + escapeHtml(v['車両ID']) + '" onclick="selectVehicleCard(this)">'
      + '<div class="vehicle-number">' + escapeHtml(plate || '（ナンバー未登録）') + escapeHtml(memo) + '</div>'
      + '<div class="vehicle-info">' + escapeHtml(v['車種名'] || '') + ' / ' + escapeHtml(v['輪数'] || '') + '</div></div>';
  }
  document.getElementById('vehicleList').innerHTML = html;
}

function selectVehicleCard(el) {
  var cards = document.querySelectorAll('.vehicle-card');
  for (var i = 0; i < cards.length; i++) cards[i].classList.remove('selected');
  el.classList.add('selected');
  selectedVehicleId = el.dataset.id;
  document.getElementById('selectVehicleBtn').disabled = false;
}

async function proceedWithVehicle() {
  if (!selectedVehicleId) { showError('車両を選んでください'); return; }
  sessionStorage.setItem('reception_vehicleId', selectedVehicleId);
  var result = await callAPI('reception_checkStoredTires', {
    customerId: customerId, vehicleId: selectedVehicleId
  });
  if (handleAPIError(result)) return;
  var stored = result.data.storedTires || [];
  if (stored.length === 0) { goToNext(); return; }
  document.getElementById('storedTireInfo').innerHTML =
    '<span class="info-bar-label">顧客: </span><strong>'
    + escapeHtml(sessionStorage.getItem('reception_customerName') || '') + '</strong>';
  var html = '<div class="form-section"><div class="form-section-title" style="color:var(--blue);">預かり中のタイヤがあります</div>';
  for (var i = 0; i < stored.length; i++) {
    var ts = stored[i].tireSet;
    var loc = stored[i].location;
    html += '<div class="stored-tire-box">'
      + '<div style="font-size:15px;font-weight:700;margin-bottom:8px;">'
      + escapeHtml(ts['区分'] || 'タイヤ') + '（' + escapeHtml(ts['本数'] || '?') + '本）</div>'
      + '<div style="font-size:13px;color:var(--text2);">セットID: ' + escapeHtml(ts['タイヤセットID']) + '</div>'
      + (loc ? '<div style="font-size:14px;font-weight:700;color:var(--brown);margin-top:8px;">状態: '
        + escapeHtml(loc['状態']) + (loc['棚'] ? ' / 棚: ' + escapeHtml(loc['棚']) : '') + '</div>' : '')
      + '</div>';
  }
  html += '</div>';
  document.getElementById('storedTireList').innerHTML = html;
  showScr('scrStoredTire');
}

async function createPhotoFolder() {
  var cName = sessionStorage.getItem('reception_customerName') || '';
  var vid = selectedVehicleId || sessionStorage.getItem('reception_vehicleId') || '';
  var area = '', classNo = '', kana = '', plateNum = '';
  if (vid) {
    var vr = await callAPI('vehicle_detail', { vehicleId: vid });
    if (vr && vr.ok && vr.data && vr.data.vehicle) {
      var v = vr.data.vehicle;
      area = v['地名'] || '';
      classNo = v['分類番号'] || '';
      kana = v['かな'] || '';
      plateNum = v['下4桁'] || '';
    }
  }
  var result = await callAPI('photo_createFolder', {
    customerName: cName,
    area: area,
    classNo: classNo,
    kana: kana,
    plateNum: plateNum
  });
  if (result && result.ok && result.data && result.data.folderId) {
    sessionStorage.setItem('reception_photoFolderId', result.data.folderId);
  }
}

async function goToNext() {
  var vid = selectedVehicleId || sessionStorage.getItem('reception_vehicleId') || '';
  sessionStorage.setItem('reception_vehicleId', vid);

  if (fromForm) {
    location.href = 'd_reception_form.html?customerId='
      + encodeURIComponent(customerId) + '&vehicleId=' + encodeURIComponent(vid);
    return;
  }

  var purpose = sessionStorage.getItem('reception_purpose') || '';

  if (purpose === '履き替え') {
    location.href = 'd_reception_form.html?customerId='
      + encodeURIComponent(customerId) + '&vehicleId=' + encodeURIComponent(vid);
  } else if (purpose === '返却のみ') {
    location.href = 'search_storage.html?fromReception=1';
  } else {
    await createPhotoFolder();
    location.href = 'd_reception_tire.html?customerId='
      + encodeURIComponent(customerId) + '&vehicleId=' + encodeURIComponent(vid);
  }
}

async function createVehicle() {
  startLoading(document.getElementById('nvSaveBtn'));
  var result = await callAPI('vehicle_create', {
    customerId: customerId,
    plateNum: document.getElementById('nvPlateNum').value.trim(),
    area: document.getElementById('nvArea').value.trim(),
    classNo: document.getElementById('nvClassNo').value.trim(),
    kana: document.getElementById('nvKana').value.trim(),
    wheelCount: document.getElementById('nvWheelCount').value,
    maker: document.getElementById('nvMaker').value.trim(),
    model: document.getElementById('nvModel').value.trim(),
    vin: document.getElementById('nvVin').value.trim()
  });
  stopLoading(document.getElementById('nvSaveBtn'));
  if (handleAPIError(result)) return;
  showSuccess('車両を登録しました');
  selectedVehicleId = result.data.vehicleId;
  sessionStorage.setItem('reception_vehicleId', selectedVehicleId);
  goToNext();
}

async function doOcrVehicle(input, docType) {
  if (!input.files || !input.files[0]) return;
  var file = input.files[0];
  var reader = new FileReader();
  reader.onload = async function(e) {
    showSuccess('読み取り中...');
    var result = await callAPI('ocr_read', { imageData: e.target.result, docType: docType });
    if (handleAPIError(result)) return;
    var ex = result.data.extracted || {};
    if (ex['下4桁']) document.getElementById('nvPlateNum').value = ex['下4桁'];
    if (ex['地名']) document.getElementById('nvArea').value = ex['地名'];
    if (ex['分類番号']) document.getElementById('nvClassNo').value = ex['分類番号'];
    if (ex['かな']) document.getElementById('nvKana').value = ex['かな'];
    if (ex['車種名']) document.getElementById('nvModel').value = ex['車種名'];
    if (ex['車台番号']) document.getElementById('nvVin').value = ex['車台番号'];
    showSuccess(docType + 'を読み取りました');
  };
  reader.readAsDataURL(file);
  input.value = '';
}

loadCustomerVehicles();
</script>
</body>
</html>
