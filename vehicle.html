<!DOCTYPE html>
<html lang="ja" style="color-scheme:only light;">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>車両台帳 - タイヤホテルOKABE DX</title>
<link rel="stylesheet" href="style.css">
<script src="api.js"></script>
<script src="common.js"></script>
</head>
<body>

<!-- 検索 -->
<div id="scrSearch" class="screen active">
  <div class="header">
    <button class="home-btn" onclick="goHome()">ホーム</button>
    <div class="header-title">車両台帳</div><button class="reload-btn" onclick="forceReload()">↻</button>
  </div>
  <div class="content">
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <input class="form-input" type="text" id="searchQuery" placeholder="ナンバー・車種・メーカー・顧客名" onkeydown="if(event.key==='Enter')doSearch()" style="flex:1;">
      <button style="padding:12px 20px;font-size:14px;font-weight:700;color:var(--white);background:var(--orange);border:none;border-radius:8px;cursor:pointer;" id="searchBtn" onclick="doSearch()">検索</button>
    </div>
    <div id="searchResults"></div>
  </div>
</div>

<!-- 顧客の車両一覧 -->
<div id="scrVehicleList" class="screen">
  <div class="header">
    <button class="home-btn" onclick="goHome()">ホーム</button>
    <button class="back-btn" onclick="showScr('scrSearch')">< 戻る</button>
    <div class="header-title">車両一覧</div><button class="reload-btn" onclick="forceReload()">↻</button>
  </div>
  <div class="content">
    <div class="card" id="custInfoBar" style="margin-bottom:12px;"></div>
    <div class="section-label">登録されている車両</div>
    <div id="vehicleListArea"></div>
    <button class="btn-primary" onclick="showNewVehicleScreen()" style="margin-top:12px;background:var(--blue);">+ 新しい車両を登録する</button>
  </div>
</div>

<!-- 新規車両登録 -->
<div id="scrNewVehicle" class="screen">
  <div class="header">
    <button class="home-btn" onclick="goHome()">ホーム</button>
    <button class="back-btn" onclick="showScr('scrVehicleList')">< 戻る</button>
    <div class="header-title">新規車両登録</div><button class="reload-btn" onclick="forceReload()">↻</button>
  </div>
  <div class="content">
    <div class="card" id="newVehCustName" style="margin-bottom:12px;font-weight:700;"></div>
    <div class="card">
      <div style="font-size:12px;color:var(--text3);margin-bottom:8px;">ナンバー</div>
      <div class="form-row"><label class="form-label">地名</label><input class="form-input" type="text" id="newArea" style="width:150px;"></div>
      <div class="form-row"><label class="form-label">分類番号</label><input class="form-input" type="text" id="newClassNo" style="width:120px;"></div>
      <div class="form-row"><label class="form-label">かな</label><input class="form-input" type="text" id="newKana" style="width:80px;"></div>
      <div class="form-row"><label class="form-label">下4桁 <span style="color:var(--red);">*</span></label><input class="form-input" type="text" id="newPlateNum" style="width:120px;font-size:20px;font-weight:700;text-align:center;"></div>
      <div style="margin-top:12px;"></div>
      <div class="form-row"><label class="form-label">メーカー</label><input class="form-input" type="text" id="newMaker"></div>
      <div class="form-row"><label class="form-label">車種名</label><input class="form-input" type="text" id="newModel"></div>
      <div class="form-row"><label class="form-label">輪数</label>
        <select class="form-input" id="newWheelCount" style="padding:10px;"><option value="未確認">未確認</option><option value="4輪">4輪</option><option value="6輪">6輪</option></select>
      </div>
      <div class="form-row"><label class="form-label">車台番号</label><input class="form-input" type="text" id="newVin"></div>
    </div>
    <button class="btn-primary" id="newVehSaveBtn" onclick="doCreateVehicle()">登録する</button>
    <button class="btn-secondary" onclick="showScr('scrVehicleList')">キャンセル</button>
  </div>
</div>

<!-- 詳細 -->
<div id="scrDetail" class="screen">
  <div class="header">
    <button class="home-btn" onclick="goHome()">ホーム</button>
    <button class="back-btn" onclick="goBackFromDetail()">< 戻る</button>
    <div class="header-title">車両詳細</div><button class="reload-btn" onclick="forceReload()">↻</button>
  </div>
  <div class="content">
    <div class="card" id="vehicleInfo"></div>
    <button class="btn-primary" onclick="showEditScreen()">車両情報を編集する</button>
    <div class="section-label">預かりタイヤ</div>
    <div id="tireList"><div style="text-align:center;color:var(--text3);padding:20px;">読み込み中...</div></div>
    <div style="text-align:right;margin-top:24px;"><a href="#" onclick="event.preventDefault();deleteVehicle()" style="font-size:13px;color:var(--red);text-decoration:underline;">この車両を削除する</a></div>
  </div>
</div>

<!-- 編集 -->
<div id="scrEdit" class="screen">
  <div class="header">
    <button class="home-btn" onclick="goHome()">ホーム</button>
    <button class="back-btn" onclick="showScr('scrDetail')">< 戻る</button>
    <div class="header-title">車両情報の編集</div><button class="reload-btn" onclick="forceReload()">↻</button>
  </div>
  <div class="content">
    <div class="card">
      <div style="font-size:12px;color:var(--text3);margin-bottom:8px;">ナンバー</div>
      <div class="form-row"><label class="form-label">地名</label><input class="form-input" type="text" id="editArea" style="width:150px;"></div>
      <div class="form-row"><label class="form-label">分類番号</label><input class="form-input" type="text" id="editClassNo" style="width:120px;"></div>
      <div class="form-row"><label class="form-label">かな</label><input class="form-input" type="text" id="editKana" style="width:80px;"></div>
      <div class="form-row"><label class="form-label">下4桁</label><input class="form-input" type="text" id="editPlateNum" style="width:120px;font-size:20px;font-weight:700;text-align:center;"></div>
      <div style="margin-top:12px;"></div>
      <div class="form-row"><label class="form-label">メーカー</label><input class="form-input" type="text" id="editMaker"></div>
      <div class="form-row"><label class="form-label">車種名</label><input class="form-input" type="text" id="editModel"></div>
      <div class="form-row"><label class="form-label">輪数</label>
        <select class="form-input" id="editWheelCount" style="padding:10px;"><option value="未確認">未確認</option><option value="4輪">4輪</option><option value="6輪">6輪</option></select>
      </div>
      <div class="form-row"><label class="form-label">車台番号</label><input class="form-input" type="text" id="editVin"></div>
    </div>
    <button class="btn-primary" id="saveBtn" onclick="saveVehicle()">変更を保存</button>
    <button class="btn-secondary" onclick="showScr('scrDetail')">キャンセル</button>
  </div>
</div>

<script>
if (!requireLogin()) {}
var currentVehicle = null;
var currentVersion = null;
var currentCustomerId = null;
var currentCustomerName = null;

// === 検索 ===
async function doSearch() {
  var query = document.getElementById('searchQuery').value.trim();
  if (!query) { showError('検索語を入力してください'); return; }
  startLoading(document.getElementById('searchBtn'));
  var r = await callAPI('vehicle_search', { query: query });
  stopLoading(document.getElementById('searchBtn'));
  if (handleAPIError(r)) return;
  var vehicles = r.data.vehicles || [];

  // 顧客ごとにグループ化
  var custMap = {};
  var custOrder = [];
  for (var i = 0; i < vehicles.length; i++) {
    var v = vehicles[i];
    var cid = v['顧客ID'] || 'unknown';
    if (!custMap[cid]) {
      custMap[cid] = { name: v['顧客名'] || '（不明）', vehicles: [] };
      custOrder.push(cid);
    }
    custMap[cid].vehicles.push(v);
  }

  var html = '<div class="section-label">検索結果（' + vehicles.length + '件）</div>';
  if (vehicles.length === 0) html += '<div style="text-align:center;color:var(--text3);padding:20px;">該当なし</div>';

  for (var ci = 0; ci < custOrder.length; ci++) {
    var cid = custOrder[ci];
    var group = custMap[cid];
    html += '<div class="card clickable" onclick="loadVehicleList(\'' + escapeHtml(cid) + '\')" style="margin-bottom:8px;">';
    html += '<div style="font-size:14px;font-weight:700;color:var(--brown);margin-bottom:6px;">' + escapeHtml(group.name) + '</div>';
    for (var vi = 0; vi < group.vehicles.length; vi++) {
      var vv = group.vehicles[vi];
      var plate = [vv['地名'], vv['分類番号'], vv['かな'], vv['下4桁']].filter(Boolean).join(' ');
      html += '<div style="font-size:13px;color:var(--text2);padding:2px 0;">' + escapeHtml(plate || '（ナンバー未登録）') + ' / ' + escapeHtml(vv['車種名'] || '') + '</div>';
    }
    html += '</div>';
  }
  document.getElementById('searchResults').innerHTML = html;
}

// === 顧客の車両一覧 ===
async function loadVehicleList(customerId) {
  var r = await callAPI('customer_detail', { customerId: customerId });
  if (handleAPIError(r)) return;
  var cust = r.data.customer;
  var vehicles = r.data.vehicles || [];
  currentCustomerId = customerId;
  currentCustomerName = cust['氏名'] || '';

  document.getElementById('custInfoBar').innerHTML =
    '<div style="font-size:16px;font-weight:700;color:var(--brown);">' + escapeHtml(currentCustomerName) + '</div>'
    + '<div style="font-size:12px;color:var(--text3);margin-top:2px;">' + escapeHtml(cust['電話'] || cust['携帯'] || '') + '</div>';

  var html = '';
  if (vehicles.length === 0) {
    html = '<div style="text-align:center;color:var(--text3);padding:20px;">車両が登録されていません</div>';
  }
  for (var i = 0; i < vehicles.length; i++) {
    var v = vehicles[i];
    var plate = [v['地名'], v['分類番号'], v['かな'], v['下4桁']].filter(Boolean).join(' ');
    html += '<div class="card clickable" onclick="loadDetail(\'' + escapeHtml(v['車両ID']) + '\')">'
      + '<div style="font-size:16px;font-weight:700;margin-bottom:4px;">' + escapeHtml(plate || '（ナンバー未登録）') + '</div>'
      + '<div style="font-size:13px;color:var(--text2);">' + escapeHtml(v['車種名'] || '') + ' / ' + escapeHtml(v['メーカー'] || '') + '</div></div>';
  }
  document.getElementById('vehicleListArea').innerHTML = html;
  showScr('scrVehicleList');
}

// === 新規車両登録 ===
function showNewVehicleScreen() {
  document.getElementById('newVehCustName').textContent = currentCustomerName;
  document.getElementById('newArea').value = '';
  document.getElementById('newClassNo').value = '';
  document.getElementById('newKana').value = '';
  document.getElementById('newPlateNum').value = '';
  document.getElementById('newMaker').value = '';
  document.getElementById('newModel').value = '';
  document.getElementById('newWheelCount').value = '未確認';
  document.getElementById('newVin').value = '';
  showScr('scrNewVehicle');
}

async function doCreateVehicle() {
  var plateNum = document.getElementById('newPlateNum').value.trim();
  if (!plateNum) { showError('ナンバー下4桁を入力してください'); return; }
  startLoading(document.getElementById('newVehSaveBtn'));
  var r = await callAPI('vehicle_create', {
    customerId: currentCustomerId,
    area: document.getElementById('newArea').value.trim(),
    classNo: document.getElementById('newClassNo').value.trim(),
    kana: document.getElementById('newKana').value.trim(),
    plateNum: plateNum,
    maker: document.getElementById('newMaker').value.trim(),
    model: document.getElementById('newModel').value.trim(),
    wheelCount: document.getElementById('newWheelCount').value,
    vin: document.getElementById('newVin').value.trim(),
  });
  stopLoading(document.getElementById('newVehSaveBtn'));
  if (handleAPIError(r)) return;
  showSuccess('車両を登録しました');
  loadVehicleList(currentCustomerId);
}

// === 詳細表示 ===
async function loadDetail(vehicleId) {
  var r = await callAPI('vehicle_detail', { vehicleId: vehicleId });
  if (handleAPIError(r)) return;
  currentVehicle = r.data.vehicle;
  currentVersion = currentVehicle['版番号'];
  var v = currentVehicle;
  var plate = [v['地名'], v['分類番号'], v['かな'], v['下4桁']].filter(Boolean).join(' ');
  var fields = [
    ['ナンバー', plate || '（未登録）'], ['車種', v['車種名']],
    ['メーカー', v['メーカー']], ['輪数', v['輪数']],
    ['車台番号', v['車台番号']]
  ];
  var html = '';
  for (var i = 0; i < fields.length; i++) {
    if (fields[i][1]) html += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border-light);font-size:13px;"><span style="color:var(--text3);">' + fields[i][0] + '</span><span style="font-weight:600;">' + escapeHtml(fields[i][1]) + '</span></div>';
  }
  document.getElementById('vehicleInfo').innerHTML = html;

  // 預かりタイヤ一覧
  var tireHtml = '';
  var tr = await callAPI('warehouse_searchTires', { vehicleId: vehicleId });
  if (handleAPIError(tr)) return;
  var tires = (tr && tr.ok && tr.data) ? tr.data.results || [] : [];
  if (tires.length === 0) {
    tireHtml = '<div style="text-align:center;color:var(--text3);padding:20px;">預かりタイヤなし</div>';
  } else {
    for (var t = 0; t < tires.length; t++) {
      var ti = tires[t];
      var locStatus = ti.location ? ti.location['状態'] || '' : '';
      var tsId = ti.tireSet ? ti.tireSet['タイヤセットID'] || '' : '';
      var isActive = locStatus === '保管中' || locStatus === '格納待ち';
      tireHtml += '<div class="card">'
        + '<div style="display:flex;justify-content:space-between;align-items:flex-start;">'
        + '<div>'
        + '<div style="font-size:14px;font-weight:700;color:var(--orange);">' + escapeHtml(ti.location ? ti.location['棚'] : '棚未定') + '</div>'
        + '<div style="font-size:13px;color:var(--text2);">' + escapeHtml(ti.tireSet ? ti.tireSet['区分'] || '' : '') + 'タイヤ ' + escapeHtml(ti.tireSet ? ti.tireSet['本数'] || '' : '') + '本</div>'
        + '<div style="font-size:12px;color:var(--text3);">' + escapeHtml(locStatus) + '</div>'
        + '</div>'
        + (isActive ? '<div style="display:flex;flex-direction:column;gap:4px;">'
          + '<button style="padding:6px 10px;font-size:11px;font-weight:600;border-radius:6px;cursor:pointer;border:none;background:var(--border-light);color:var(--text2);" onclick="doChangeVehicle(\'' + escapeHtml(tsId) + '\')">車両変更</button>'
          + '<button style="padding:6px 10px;font-size:11px;font-weight:600;border-radius:6px;cursor:pointer;border:none;background:#FEE2E2;color:var(--red);" onclick="doEndCustody(\'' + escapeHtml(tsId) + '\')">預かり終了</button>'
          + '</div>' : '')
        + '</div>'
        + '</div>';
    }
  }
  document.getElementById('tireList').innerHTML = tireHtml;
  showScr('scrDetail');
}

// === 車両編集 ===
function showEditScreen() {
  if (!currentVehicle) return;
  var v = currentVehicle;
  document.getElementById('editArea').value = v['地名'] || '';
  document.getElementById('editClassNo').value = v['分類番号'] || '';
  document.getElementById('editKana').value = v['かな'] || '';
  document.getElementById('editPlateNum').value = v['下4桁'] || '';
  document.getElementById('editMaker').value = v['メーカー'] || '';
  document.getElementById('editModel').value = v['車種名'] || '';
  document.getElementById('editWheelCount').value = v['輪数'] || '未確認';
  document.getElementById('editVin').value = v['車台番号'] || '';
  showScr('scrEdit');
}

async function saveVehicle() {
  if (!currentVehicle) return;
  startLoading(document.getElementById('saveBtn'));
  var r = await callAPI('vehicle_update', {
    vehicleId: currentVehicle['車両ID'], version: currentVersion,
    updates: {
      '地名': document.getElementById('editArea').value,
      '分類番号': document.getElementById('editClassNo').value,
      'かな': document.getElementById('editKana').value,
      '下4桁': document.getElementById('editPlateNum').value,
      'メーカー': document.getElementById('editMaker').value,
      '車種名': document.getElementById('editModel').value,
      '輪数': document.getElementById('editWheelCount').value,
      '車台番号': document.getElementById('editVin').value
    }
  });
  stopLoading(document.getElementById('saveBtn'));
  if (handleAPIError(r)) return;
  currentVersion = r.data.newVersion;
  showSuccess('変更を保存しました');
  loadDetail(currentVehicle['車両ID']);
}

// === 預かり終了 ===
async function doEndCustody(tireSetId) {
  if (!confirmAction('このタイヤの預かりを終了しますか？\n棚が空きます。')) return;
  var r = await callAPI('tire_endCustody', { tireSetId: tireSetId });
  if (handleAPIError(r)) return;
  showSuccess('預かりを終了しました');
  loadDetail(currentVehicle['車両ID']);
}

// === 車両変更 ===
async function doChangeVehicle(tireSetId) {
  var query = prompt('移動先の車両を検索してください（ナンバー・車種・顧客名）');
  if (!query) return;
  var r = await callAPI('vehicle_search', { query: query });
  if (handleAPIError(r)) return;
  var vehicles = r.data.vehicles || [];
  if (vehicles.length === 0) { showError('車両が見つかりません'); return; }
  var names = vehicles.map(function(v, i) {
    var plate = [v['地名'], v['分類番号'], v['かな'], v['下4桁']].filter(Boolean).join(' ');
    return (i+1) + ': ' + (plate || '未登録') + '（' + (v['車種名']||'') + ' / ' + (v['顧客名']||'') + '）';
  }).join('\n');
  var idx = prompt('移動先の車両を番号で選んでください:\n' + names);
  if (!idx) return;
  var sel = vehicles[parseInt(idx) - 1];
  if (!sel) { showError('無効な番号です'); return; }
  if (sel['車両ID'] === currentVehicle['車両ID']) { showError('同じ車両です'); return; }
  var plate = [sel['地名'], sel['分類番号'], sel['かな'], sel['下4桁']].filter(Boolean).join(' ');
  if (!confirmAction('このタイヤを「' + (plate || '未登録') + '（' + (sel['車種名']||'') + '）」に移動しますか？')) return;
  var r2 = await callAPI('tire_changeVehicle', { tireSetId: tireSetId, newVehicleId: sel['車両ID'] });
  if (handleAPIError(r2)) return;
  showSuccess('車両を変更しました');
  loadDetail(currentVehicle['車両ID']);
}

// === 車両削除 ===
async function deleteVehicle() {
  if (!currentVehicle) return;
  if (!confirmAction('この車両を削除しますか？\n\n預かり中のタイヤがある場合、タイヤの車両紐づけが解除されます（預かりは継続します）。')) return;
  var r = await callAPI('vehicle_delete', { vehicleId: currentVehicle['車両ID'] });
  if (handleAPIError(r)) return;
  showSuccess('削除しました');
  showScr('scrSearch');
}

function goBackFromDetail() {
  if (paramId) { history.back(); } else if (currentCustomerId) { loadVehicleList(currentCustomerId); } else { showScr('scrSearch'); }
}

var paramId = getParam('vehicleId');
if (paramId) {
  document.getElementById('scrSearch').classList.remove('active');
  loadDetail(paramId);
}
</script>
</body>
</html>
